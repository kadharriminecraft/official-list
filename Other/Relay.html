   i.redd.it …) that defeat every general-purpose proxy */
function wsrvUrl(u){ return 'https://wsrv.nl/?url=' + encodeURIComponent(u); }
function weservUrl(u){ return 'https://images.weserv.nl/?url=' + encodeURIComponent(String(u).replace(/^https?:\/\//i, '')); }

function mediaShell(title, body){
  return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>' + esc(title) + '</title></head>' +
    '<body style="margin:0;background:#0F0F0F;color:#F1F1F1;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif">' +
    body + mediaCardScript() + '</body></html>';
}
function mediaCardScript(){
  /* reuse the YouTube card message plumbing: data-ytcopy copies, data-ytext opens */
  return '<script>(function(){' +
    'document.addEventListener("click", function(ev){' +
      'var t = ev.target;' +
      'var cp = t && t.closest ? t.closest("[data-ytcopy]") : null;' +
      'if (cp){ ev.preventDefault(); ev.stopPropagation();' +
        'if (window.__relayPost) __relayPost({ t: "ytcopy", url: cp.getAttribute("data-ytcopy") });' +
        'var oh = cp.innerHTML; cp.innerHTML = "Copied!"; setTimeout(function(){ cp.innerHTML = oh; }, 1300); return; }' +
      'var ex = t && t.closest ? t.closest("[data-ytext]") : null;' +
      'if (ex){ ev.preventDefault(); ev.stopPropagation(); if (window.__relayPost) __relayPost({ t: "ext", url: ex.getAttribute("data-ytext") }); return; }' +
      'var dl = t && t.closest ? t.closest("[data-rdl]") : null;' +
      'if (dl){ ev.preventDefault(); ev.stopPropagation(); if (window.__relayPost) __relayPost({ t: "download", url: dl.getAttribute("data-rdl"), filename: dl.getAttribute("data-rdl-name") || "" });' +
        'var oh2 = dl.innerHTML; dl.innerHTML = "Downloading…"; setTimeout(function(){ dl.innerHTML = oh2; }, 1800); return; }' +
      'var pd = t && t.closest ? t.closest("[data-rpdf]") : null;' +
      'if (pd){ ev.preventDefault(); ev.stopPropagation(); if (window.__relayPost) __relayPost({ t: "restext" }); }' +
    '});})();<\/script>';
}
var MEDIA_BTN = 'display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 20px;border-radius:23px;font:600 14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;border:0;cursor:pointer;';

function resourcePageHtml(entry, kind){
  var u = entry.url;
  var name = fileNameOf(u) || hostOf(u);
  var host = hostOf(u);
  var openRaw = 'Open raw file';
  /* download button uses the parent's download pipeline (proxy chain fetch +
     Blob URL) so it works even from inside the sandboxed iframe */
  var btns =
    '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0 8px">' +
      '<button type="button" data-rdl="' + esc(u) + '" data-rdl-name="' + esc(name) + '" style="' + MEDIA_BTN + 'background:#0FB5AE;color:#04211F">' + 'Download' + '</button>' +
      '<button type="button" data-ytcopy="' + esc(u) + '" style="' + MEDIA_BTN + 'background:#1F9D55;color:#fff">' + 'Copy link' + '</button>' +
      '<button type="button" data-ytext="' + esc(u) + '" style="' + MEDIA_BTN + 'background:#272727;color:#F1F1F1">' + openRaw + '</button>' +
    '</div>';
  var head =
    '<div style="text-align:center;margin:22px 0 6px">' +
      '<h1 style="font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0;word-break:break-all">' + esc(name) + '</h1>' +
      '<div style="font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#777;text-transform:uppercase;margin-top:6px">' + esc(host) + ' · ' + esc(kind) + '</div>' +
    '</div>';
  if (kind === 'image'){
    /* chain: wsrv → weserv → proxy → direct. src already points at wsrv (a
       known proxy prefix), so the runtime shim leaves this <img> untouched.
       Tap the image to toggle between fit-to-screen and full-size (1:1,
       scrollable) so game screenshots and comics can be inspected up close. */
    var body =
      '<div style="max-width:760px;margin:0 auto;padding:12px 10px 56px">' + head +
        '<div id="rlZoomBox" style="position:relative;display:flex;align-items:center;justify-content:center;min-height:200px;border-radius:14px;background:#181818;overflow:auto">' +
          '<img id="resImg" src="' + esc(wsrvUrl(u)) + '" alt="' + esc(name) + '" style="max-width:100%;max-height:76vh;display:block;object-fit:contain">' +
        '</div>' + btns +
        '<div id="resErr" style="display:none;text-align:center;color:#999;font-size:13px;line-height:1.7;margin-top:10px">' +
          'Couldn\u2019t load this image through any route.<br>Try <b>Copy link</b> or <b>Open raw file</b> below the preview.' +
        '</div>' +
      '</div>' +
      '<script>(function(){' +
        'var img = document.getElementById("resImg"), err = document.getElementById("resErr"), box = document.getElementById("rlZoomBox");' +
        'var chain = [' + JSON.stringify(weservUrl(u)) + ', ' + JSON.stringify(assetUrl(u)) + ', ' + JSON.stringify(u) + '];' +
        'var i = 0;' +
        'img.addEventListener("error", function(){' +
          'if (i < chain.length){ img.src = chain[i++]; }' +
          'else { img.style.display = "none"; err.style.display = "block"; }' +
        '});' +
        'var zoomed = false;' +
        'img.addEventListener("click", function(){' +
          'zoomed = !zoomed;' +
          'box.style.alignItems = zoomed ? "flex-start" : "center";' +
          'box.style.justifyContent = zoomed ? "flex-start" : "center";' +
          'img.style.maxWidth = zoomed ? "none" : "100%";' +
          'img.style.maxHeight = zoomed ? "none" : "76vh";' +
          'img.style.width = zoomed ? "auto" : "";' +
        '});' +
      '})();<\/script>';
    return mediaShell(name, body);
  }
  if (kind === 'media'){
    var isAudio = isAudioRes(u);
    var isHls = /\.m3u8([?#]|$)/i.test(u);
    /* HLS playlists must keep their relative-segment resolution intact —
       hlsUrl() uses the super worker's path-style form (or the direct URL
       for CORS-open CDNs). Everything else goes through assetUrl. */
    var srcAttr = isHls ? hlsUrl(u) : assetUrl(u);
    var player = isAudio
      ? '<audio id="resAv" controls preload="metadata" src="' + esc(srcAttr) + '" style="width:100%;max-width:560px;display:block"></audio>'
      : '<video id="resAv" controls playsinline preload="metadata" src="' + esc(srcAttr) + '" style="width:100%;max-height:70vh;display:block;background:#000"></video>';
    var body =
      '<div style="max-width:760px;margin:0 auto;padding:12px 10px 56px">' + head +
        '<div id="rlAvBox" style="position:relative;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#181818;padding:14px;overflow:hidden">' + player + '</div>' + btns +
        '<div id="resErr" style="display:none;text-align:center;color:#999;font-size:13px;line-height:1.7;margin-top:10px">' +
          (isHls
            ? 'HLS streams play natively on iPhone, iPad and Safari.<br>Other in-app browsers can\u2019t open them — use <b>Copy link</b> instead.'
            : 'This ' + (isAudio ? 'audio' : 'video') + ' couldn\u2019t stream through the proxy chain.<br>Use <b>Copy link</b> and open it in your player app.') +
        '</div>' +
      '</div>' +
      '<script>(function(){' +
        'var av = document.getElementById("resAv"), err = document.getElementById("resErr");' +
        'var tried = false;' +
        'av.addEventListener("error", function(){' +
          'if (!tried){ tried = true; av.src = ' + JSON.stringify(u) + '; av.load(); }' +
          'else { av.style.display = "none"; err.style.display = "block"; }' +
        '});' +
        /* expand button: real fullscreen when allowed, otherwise a fixed overlay
           + the parent hides its chrome (rl-theater). Works even when the native
           fullscreen button is greyed out. */
        'if (!' + JSON.stringify(isAudio) + ' && window.__rlExpand){' +
          'window.__rlExpand(document.getElementById("rlAvBox"), av);' +
        '}' +
      '})();<\/script>';
    return mediaShell(name, body);
  }
  /* pdf */
  var body =
    '<div style="max-width:560px;margin:0 auto;padding:44px 18px 60px;text-align:center">' +
      '<div style="width:74px;height:74px;margin:0 auto 16px;border-radius:18px;background:#1E1E1E;display:grid;place-items:center">' +
        '<span style="font:800 17px ui-monospace,Menlo,monospace;color:#0FB5AE;letter-spacing:-.02em">PDF</span></div>' +
      '<h1 style="font-size:17px;font-weight:650;letter-spacing:-.01em;margin:0 0 6px;word-break:break-all">' + esc(name) + '</h1>' +
      '<div style="font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#777;text-transform:uppercase;margin-bottom:22px">' + esc(host) + '</div>' +
      '<p style="font-size:13.5px;line-height:1.7;color:#BBBBBB;margin:0 0 24px">PDFs can\u2019t render inside the proxy sandbox. Extract the text version through the snapshot engine, or open the file directly.</p>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">' +
        '<button type="button" data-rpdf="1" style="' + MEDIA_BTN + 'background:#0FB5AE;color:#04211F">Extract text</button>' +
        '<button type="button" data-ytcopy="' + esc(u) + '" style="' + MEDIA_BTN + 'background:#272727;color:#F1F1F1">Copy link</button>' +
        '<button type="button" data-ytext="' + esc(u) + '" style="' + MEDIA_BTN + 'background:#272727;color:#F1F1F1">Open raw file</button>' +
      '</div>' +
    '</div>';
  return mediaShell(name, body);
}

/* text/plain · json · csv · source files → monospace reader view */
function renderTextResource(entry, r){
  var txt = (r && r.text) || (entry.resource && entry.resource.text) || '';
  var ct = (r && r.ct) || (entry.resource && entry.resource.ct) || 'text/plain';
  var via = (r && r.via) || (entry.resource && entry.resource.via) || '';
  var name = fileNameOf(entry.url) || hostOf(entry.url);
  entry.title = name;
  entry.engineUsed = 'text';
  entry.mode = 'reader';
  entry.resource = { kind: 'text', text: txt, ct: ct, via: via };
  updateModeSeg(entry);
  showLiveOrReader(entry);
  $('#rdKicker').hidden = true;
  $('#rdH1').textContent = name;
  var meta = '<span>' + esc(hostOf(entry.url)) + '</span><span class="dot"></span><span>' + esc(ct.split(';')[0]) + '</span>';
  if (via) meta += '<span class="dot"></span><span>via ' + esc(via) + '</span>';
  meta += '<span class="dot"></span><span>' + fmtBytes(txt.length) + '</span>';
  $('#rdMeta').innerHTML = meta;
  var body = txt;
  if (/json/i.test(ct)){ try{ body = JSON.stringify(JSON.parse(txt), null, 2); }catch(e){} }
  $('#rdBody').innerHTML = '<pre class="rd-pre">' + esc(body.length > 900000 ? body.slice(0, 900000) + '\n… truncated' : body) + '</pre>';
  addHistory(entry.url, entry.title);
  updateChrome();
}

/* entry point from loadPageEntry — renders image / media / pdf viewer pages */
function renderResourcePage(entry, kind){
  entry.title = fileNameOf(entry.url) || hostOf(entry.url);
  entry.engineUsed = 'resource';
  entry.mode = 'live';
  entry.resource = { kind: kind };
  entry.docCache = { text: resourcePageHtml(entry, kind), base: entry.url, via: kind, ct: 'text/html', ms: 0 };
  updateModeSeg(entry);
  return renderLive(entry, true).then(function(){
    updateChrome();
    addHistory(entry.url, entry.title);
  });
}

<script>
/* ============ 9. Search engines ============ */
var ENGINES = [
  { id: 'all', name: 'All', ic: 'web' },
  { id: 'bing', name: 'Bing', ic: 'web' },
  { id: 'ddg', name: 'DDG', ic: 'web' },
  { id: 'mojeek', name: 'Mojeek', ic: 'web' },
  { id: 'wiki', name: 'Wiki', ic: 'wiki' },
  { id: 'yt', name: 'Videos', ic: 'yt' },
  { id: 'images', name: 'Images', ic: 'image' },
  { id: 'news', name: 'News', ic: 'news' }
];
function searchUrlFor(engineId, q){
  switch (engineId){
    case 'bing': return 'https://www.bing.com/search?q=' + encodeURIComponent(q) + '&format=rss&count=20';
    case 'ddg': return 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(q);
    case 'mojeek': return 'https://www.mojeek.com/search?q=' + encodeURIComponent(q);
    case 'images': return 'https://www.bing.com/images/search?q=' + encodeURIComponent(q) + '&form=HDRSC2';
    case 'news': return 'https://www.bing.com/news/search?q=' + encodeURIComponent(q) + '&format=rss';
    default: return null;
  }
}
/* --- parsers --- */
function parseRssResults(xmlText){
  var doc = new DOMParser().parseFromString(xmlText, 'text/html');
  var items = doc.querySelectorAll('item');
  var out = [];
  for (var i = 0; i < items.length && out.length < 20; i++){
    var it = items[i];
    var link = (it.querySelector('link') || {}).textContent || '';
    /* RSS link element sometimes empty with link[rel] — try next sibling text */
    if (!link){
      var lk = it.getElementsByTagName('link')[0];
      if (lk && lk.nextSibling && lk.nextSibling.nodeType === 3) link = lk.nextSibling.nodeValue.trim();
    }
    var title = (it.querySelector('title') || {}).textContent || '';
    var desc = (it.querySelector('description') || {}).textContent || '';
    if (!link || !/^https?:/i.test(link) || !title) continue;
    var d = doc.createElement('div'); d.innerHTML = desc; desc = d.textContent || '';
    out.push({ title: title.trim(), url: link.trim(), snippet: desc.trim().slice(0, 240) });
  }
  return out;
}
function parseRssNews(xmlText){
  var doc = new DOMParser().parseFromString(xmlText, 'text/html');
  var items = doc.querySelectorAll('item');
  var out = [];
  for (var i = 0; i < items.length && out.length < 24; i++){
    var it = items[i];
    var link = (it.querySelector('link') || {}).textContent || '';
    if (!link){
      var lk = it.getElementsByTagName('link')[0];
      if (lk && lk.nextSibling && lk.nextSibling.nodeType === 3) link = lk.nextSibling.nodeValue.trim();
    }
    var title = (it.querySelector('title') || {}).textContent || '';
    var desc = (it.querySelector('description') || {}).textContent || '';
    var date = (it.querySelector('pubDate') || {}).textContent || '';
    if (!/^https?:/i.test(link) || !title) continue;
    var d = doc.createElement('div'); d.innerHTML = desc; desc = d.textContent || '';
    out.push({ title: title.trim(), url: link.trim(), snippet: desc.trim().slice(0, 200), date: date });
  }
  return out;
}
function decodeDdgHref(href){
  try{
    var u = new URL(href, 'https://duckduckgo.com');
    var uddg = u.searchParams.get('uddg');
    if (uddg) return decodeURIComponent(uddg);
    if (/^https?:\/\//i.test(href)) return href;
  }catch(e){}
  return /^https?:\/\//i.test(href) ? href : null;
}
function parseDdgHtml(html){
  var doc = new DOMParser().parseFromString(html, 'text/html');
  var out = [];
  var blocks = doc.querySelectorAll('.result, .web-result');
  for (var i = 0; i < blocks.length && out.length < 20; i++){
    var b = blocks[i];
    var a = b.querySelector('.result__a[href], a.result__a');
    if (!a) continue;
    var url = decodeDdgHref(a.getAttribute('href') || '');
    if (!url || /duckduckgo\.com\/y\.js|duckduckgo\.com\/\?q/.test(url)) continue;
    var sn = b.querySelector('.result__snippet');
    out.push({ title: a.textContent.trim(), url: url, snippet: sn ? sn.textContent.trim().slice(0, 240) : '' });
  }
  /* related searches */
  var rel = [];
  try{
    doc.querySelectorAll('#related a, .related-searches a, a[href*="/?q="]').forEach(function(a){
      var t = a.textContent.trim();
      if (t && t.length > 2 && t.length < 40 && rel.length < 10 && rel.indexOf(t) < 0) rel.push(t);
    });
  }catch(e){}
  return { results: out, related: rel };
}
function parseMojeek(html){
  var doc = new DOMParser().parseFromString(html, 'text/html');
  var out = [];
  var blocks = doc.querySelectorAll('ul.results-standard li, li.result');
  for (var i = 0; i < blocks.length && out.length < 18; i++){
    var b = blocks[i];
    var a = b.querySelector('h2 a, a.title');
    if (!a) continue;
    var href = a.getAttribute('href') || '';
    if (!/^https?:/i.test(href)) continue;
    var sn = b.querySelector('p.s');
    out.push({ title: a.textContent.trim(), url: href, snippet: sn ? sn.textContent.trim().slice(0, 240) : '' });
  }
  return out;
}
function parseBingImages(html){
  var out = [];
  var re = /class="iusc"[^>]*?\sm="([^"]*)"/g, m;
  while ((m = re.exec(html)) && out.length < 60){
    try{
      var json = JSON.parse(m[1].replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&'));
      if (json && json.murl && /^https?:/i.test(json.murl)){
        out.push({ murl: json.murl, turl: json.turl || json.murl, purl: json.purl || '', title: json.ttl || hostOf(json.murl) });
      }
    }catch(e){}
  }
  if (!out.length){
    /* fallback: meta og:image style single or iusc in data attr */
    var re2 = /<a[^>]+class="iusc"[^>]+m='([^']*)'/g, m2;
    while ((m2 = re2.exec(html)) && out.length < 60){
      try{
        var j2 = JSON.parse(m2[1].replace(/&quot;/g, '"').replace(/&#39;/g, "'"));
        if (j2 && j2.murl && /^https?:/i.test(j2.murl)) out.push({ murl: j2.murl, turl: j2.turl || j2.murl, title: j2.ttl || hostOf(j2.murl) });
      }catch(e){}
    }
  }
  return out;
}
/* --- fetchers (all through the proxy chain) --- */
function fetchEngineResults(engineId, q){
  var url = searchUrlFor(engineId, q);
  if (!url) return Promise.reject(new Error('bad engine'));
  return netFetch(url, { kind: 'search', timeout: 13000 }).then(function(r){
    var text = r.text;
    if (engineId === 'bing' || engineId === 'news') return parseRssResults(text);
    if (engineId === 'ddg') return parseDdgHtml(text).results;
    if (engineId === 'mojeek') return parseMojeek(text);
    return [];
  });
}
function fetchWikiResults(q){
  var url = 'https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=6&srprop=snippet|wordcount&srsearch=' + encodeURIComponent(q);
  return fetch(url, { credentials: 'omit' }).then(function(r){
    if (!r.ok) throw new Error('wiki ' + r.status);
    return r.json();
  }).then(function(j){
    var arr = (j && j.query && j.query.search) || [];
    return arr.map(function(s){
      var d = document.createElement('div'); d.innerHTML = s.snippet || '';
      return {
        title: s.title,
        url: 'https://en.wikipedia.org/wiki/' + encodeURIComponent(s.title.replace(/ /g, '_')),
        snippet: (d.textContent || '').slice(0, 220)
      };
    });
  }).catch(function(){
    /* REST search fallback (different rate-limit class) */
    var rurl = 'https://en.wikipedia.org/w/rest.php/v1/search/page?q=' + encodeURIComponent(q) + '&limit=6';
    return fetch(rurl, { credentials: 'omit' }).then(function(r){
      if (!r.ok) throw new Error('wiki-rest ' + r.status);
      return r.json();
    }).then(function(j){
      return (j && j.pages || []).map(function(p){
        var d = document.createElement('div'); d.innerHTML = p.excerpt || '';
        return {
          title: p.title,
          url: 'https://en.wikipedia.org/wiki/' + encodeURIComponent(p.title.replace(/ /g, '_')),
          snippet: (d.textContent || '').slice(0, 220)
        };
      });
    });
  });
}
function fetchDdgIA(q){
  var url = 'https://api.duckduckgo.com/?q=' + encodeURIComponent(q) + '&format=json&no_html=1&no_redirect=1&skip_disambig=1&t=relay';
  return fetch(url, { credentials: 'omit' }).then(function(r){ return r.json(); }).catch(function(){
    return netJSON(url).catch(function(){ return null; });
  });
}
function fetchWikiSummary(title){
  var url = 'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_'));
  return fetch(url, { credentials: 'omit' }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
}
function fetchImages(q){
  return netFetch(searchUrlFor('images', q), { kind: 'search', timeout: 14000 }).then(function(r){
    var imgs = parseBingImages(r.text);
    if (!imgs.length) throw new Error('no images parsed');
    return imgs;
  });
}
function fetchNews(q){
  return netFetch(searchUrlFor('news', q), { kind: 'search', timeout: 13000 }).then(function(r){
    var news = parseRssNews(r.text);
    if (!news.length) throw new Error('no news');
    return news;
  });
}
/* --- aggregation --- */
function normKey(url){
  try{
    var u = new URL(url);
    var h = u.hostname.replace(/^www\./, '');
    var p = u.pathname.replace(/\/+$/, '');
    var keep = [];
    u.searchParams.forEach(function(v, k){ if (!/^(utm_|fbclid|gclid|ref|referrer)/i.test(k)) keep.push(k + '=' + v); });
    keep.sort();
    return h + p + (keep.length ? '?' + keep.join('&') : '');
  }catch(e){ return url; }
}
function mergeResults(map){
  var by = new Map();
  Object.keys(map).forEach(function(eid){
    (map[eid] || []).forEach(function(r, i){
      if (!r || !r.url) return;
      var key = normKey(r.url);
      var o = by.get(key);
      if (!o){
        o = { title: r.title, url: r.url, snippet: r.snippet || '', engines: [], score: 0 };
        by.set(key, o);
      }
      if (!o.snippet && r.snippet) o.snippet = r.snippet;
      if (o.engines.indexOf(eid) < 0) o.engines.push(eid);
      o.score += 1 / (i + 4);
    });
  });
  var arr = Array.from(by.values());
  arr.forEach(function(o){ if (o.engines.length > 1) o.score *= 1.9; });
  arr.sort(function(a, b){ return b.score - a.score; });
  var domCount = {}, head = [], tail = [];
  for (var i = 0; i < arr.length; i++){
    var h = hostOf(arr[i].url);
    domCount[h] = (domCount[h] || 0) + 1;
    if (head.length < 12 && domCount[h] > 2){ tail.push(arr[i]); continue; }
    (head.length < 12 ? head : tail).push(arr[i]);
  }
  return head.concat(tail).slice(0, 30);
}
/* --- autocomplete --- */
function fetchSuggests(q){

var progressParked = false;

}
function progressDone(){
  /* latch: 'ready' fires twice per load (DOMContentLoaded + load) and the
     bar used to re-animate/flicker on the second call. Once parked at 100%,
     stay parked until a new load sets a lower progress value. */
  var el = $('#progress');
  if (progressParked){ el.classList.add('done'); return; }
  progressParked = true;
  el.firstElementChild.style.width = '100%';
  setTimeout(function(){ $('#progress').classList.add('done'); }, 400);

  var box = $('#hisList');
  var items = store.history.filter(function(h){ return /^https?:/.test(h.url); });
  if (!items.length){
    box.innerHTML = emptyHtml('clock', 'No history', 'Pages you visit will be listed here. Incognito mode skips recording.');
    return;
  }
  var groups = {};
  items.forEach(function(h){
    var d = new Date(h.ts);
    var key = d.toDateString();
    (groups[key] = groups[key] || []).push(h);
  });
  var html = '';
  Object.keys(groups).forEach(function(key){
    html += '<div class="list-group-label">' + esc(key === new Date().toDateString() ? 'Today' : key) + '</div>';
    html += groups[key].map(function(h){
      return '<div class="list-row">' +
        '<span class="lr-ic"><img src="https://icons.duckduckgo.com/ip3/' + esc(hostOf(h.url)) + '.ico" alt="" loading="lazy" onerror="this.style.display=\'none\'"></span>' +
        '<button class="lr-main" data-href="' + esc(h.url) + '"><span class="lr-t">' + esc(h.title || h.url) + '</span><span class="lr-s">' + esc(hostOf(h.url)) + ' · ' + fmtTime(h.ts) + '</span></button>' +
        '<button class="lr-x" data-hisrm="' + esc(h.url) + '" aria-label="Remove">' + icon('trash', 16) + '</button>' +
      '</div>';
    }).join('');
  });
  box.innerHTML = html;
  $('#hisClear').onclick = function(){
    confirmDialog('Clear history?', 'Your entire browsing history in Relay will be deleted.', function(){
      store.history = []; saveSoon(); renderHistoryView();
    });
  };
}

/* ============ 15. Omnibox (address bar dropdown) ============ */
var omniSel = -1, omniItems = [];
var suggestT = null;
function omniShow(items){
  /* stale async suggestions must not reopen the dropdown after Enter/navigate */
  var addr = $('#addr');
  if (document.activeElement !== addr){ omniItems = []; return; }
  omniItems = items;
  omniSel = -1;
  var box = $('#omni');
  if (!items.length){ box.classList.remove('show'); return; }
  box.innerHTML = items.map(function(it, i){
    return '<button class="omni-row" data-omni="' + i + '">' +
      '<span class="or-ic">' + icon(it.ic || 'search', 16) + '</span>' +
      '<span class="or-t">' + it.hl + '</span>' +
      (it.sub ? '<span class="or-s">' + esc(it.sub) + '</span>' : '') +
    '</button>';
  }).join('');
  box.classList.add('show');
}
function omniHide(){ var b = $('#omni'); b.classList.remove('show'); omniSel = -1; }
function hlText(q, s){
  var idx = s.toLowerCase().indexOf(q.toLowerCase());
  if (idx < 0 || !q) return esc(s);
  return esc(s.slice(0, idx)) + '<b>' + esc(s.slice(idx, idx + q.length)) + '</b>' + esc(s.slice(idx + q.length));
}
function omniUpdate(){
  var q = $('#addr').value.trim();
  if (!q){ omniHide(); return; }
  var parsed = parseInput(q);
  var items = [];
  if (parsed && parsed.search != null){
    items.push({ type: 'search', q: parsed.search, ic: 'search', hl: hlText(q, parsed.search), sub: (parsed.engine || settings.engine) + ' search' });
  }
  if (parsed && parsed.url){
    items.push({ type: 'url', url: parsed.url, ic: 'web', hl: hlText(q, parsed.url), sub: 'open' });
  }
  var ql = q.toLowerCase();
  store.bookmarks.forEach(function(b){
    if (items.length > 7) return;
    if ((b.title || '').toLowerCase().indexOf(ql) >= 0 || b.url.toLowerCase().indexOf(ql) >= 0){
      items.push({ type: 'url', url: b.url, ic: 'bookmark', hl: hlText(q, b.title || b.url), sub: 'bookmark' });
    }
  });
  store.history.forEach(function(h){
    if (items.length > 10) return;
    if ((h.title || '').toLowerCase().indexOf(ql) >= 0 && h.title !== q){
      items.push({ type: 'url', url: h.url, ic: 'clock', hl: hlText(q, h.title), sub: hostOf(h.url) });
    }
  });
  omniShow(items);
  /* remote suggestions */
  clearTimeout(suggestT);
  if (parsed && parsed.search != null && q.length > 1){
    suggestT = setTimeout(function(){
      fetchSuggests(parsed.search).then(function(list){
        if ($('#addr').value.trim() !== q) return;
        var extra = list.filter(function(s){ return s && s.toLowerCase() !== q.toLowerCase(); }).slice(0, 5)
          .map(function(s){ return { type: 'search', q: s, ic: 'search', hl: hlText(q, s), sub: 'suggest' }; });
        omniShow(items.concat(extra));
      });
    }, 180);
  }
}
function omniActivate(i){
  var it = omniItems[i];
  omniHide();
  $('#addr').blur();
  if (!it) return;
  if (it.type === 'search') doSearch(it.q, { push: true, engine: it.engine });
  else openUrl(it.url, { push: true });
}
function omniKey(ev){
  var box = $('#omni');
  var open = box.classList.contains('show');
  if (ev.key === 'ArrowDown' && open){
    ev.preventDefault();
    omniSel = Math.min(omniSel + 1, omniItems.length - 1);
    omniPaint();
  } else if (ev.key === 'ArrowUp' && open){
    ev.preventDefault();
    omniSel = Math.max(omniSel - 1, 0);
    omniPaint();
  } else if (ev.key === 'Enter'){
    if (open && omniSel >= 0){ omniActivate(omniSel); }
    else {
      omniHide();
      $('#addr').blur();
      navigate($('#addr').value);
    }
  } else if (ev.key === 'Escape'){
    omniHide();
    $('#addr').blur();
    updateChrome();
  }
}
function omniPaint(){
  $$('#omni .omni-row').forEach(function(r, i){
    r.classList.toggle('sel', i === omniSel);
  });
}

/* ============ 16. Find bar ============ */
var rdMarks = [], rdMarkIdx = -1;
function rdClearMarks(){
  for (var i = rdMarks.length - 1; i >= 0; i--){
    var m = rdMarks[i];
    if (m.parentNode) m.parentNode.replaceChild(document.createTextNode(m.textContent), m);
  }
  rdMarks = []; rdMarkIdx = -1;
}
function rdFind(q){
  rdClearMarks();
  if (!q){ updateFindCount(0, 0); return; }
  var root = $('#rdBody');
  if (!root) return;
  var lq = q.toLowerCase();
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
  var nodes = [], n;
  while ((n = walker.nextNode())){
    if (n.nodeValue && n.nodeValue.trim() && !/SCRIPT|STYLE/.test(n.parentNode.nodeName)) nodes.push(n);
  }
  nodes.forEach(function(node){
    var val = node.nodeValue, lv = val.toLowerCase();
    if (lv.indexOf(lq) < 0) return;
    var frag = document.createDocumentFragment(), pos = 0, idx;
    while ((idx = lv.indexOf(lq, pos)) >= 0){
      if (idx > pos) frag.appendChild(document.createTextNode(val.slice(pos, idx)));
      var mk = document.createElement('mark');
      mk.style.cssText = 'background:#FFD60A;color:#111;border-radius:2px;padding:0 1px;';
      mk.textContent = val.slice(idx, idx + q.length);
      frag.appendChild(mk);
      rdMarks.push(mk);
      pos = idx + q.length;
    }
    if (pos < val.length) frag.appendChild(document.createTextNode(val.slice(pos)));
    node.parentNode.replaceChild(frag, node);
  });
  if (rdMarks.length){ rdMarkIdx = 0; try{ rdMarks[0].scrollIntoView({ block: 'center' }); }catch(e){} }
  updateFindCount(rdMarks.length, rdMarks.length ? 1 : 0);
}
function rdFindNav(dir){
  if (!rdMarks.length) return;
  rdMarkIdx = (rdMarkIdx + dir + rdMarks.length) % rdMarks.length;
  try{ rdMarks[rdMarkIdx].scrollIntoView({ block: 'center' }); }catch(e){}
  updateFindCount(rdMarks.length, rdMarkIdx + 1);
}
function updateFindCount(n, cur){ $('#findCount').textContent = cur + '/' + n; }
var findDeb = null;
function onFindInput(){
  clearTimeout(findDeb);
  findDeb = setTimeout(function(){
    var q = $('#findInput').value;
    var e = activeEntry();
    if (!e || e.kind !== 'page') return;
    if (e.mode === 'live') sendToFrame(e, { t: 'find', q: q });
    else rdFind(q);
  }, 260);
}
function openFind(){
  $('#findbar').classList.add('show');
  setTimeout(function(){ $('#findInput').focus(); }, 60);
}
function closeFind(){
  $('#findbar').classList.remove('show');
  $('#findInput').value = '';
  $('#findCount').textContent = '0/0';
  var e = activeEntry();
  if (e && e.kind === 'page'){
    if (e.mode === 'live') sendToFrame(e, { t: 'clearfind' });
    else rdClearMarks();
  }
}

/* ============ 17. Menu sheet ============ */
function openSheet(html){
  $('#sheetBody').innerHTML = html;
  try{ $('#sheetBody').removeAttribute('data-links-sheet'); }catch(eSA){}
  $('#sheet').classList.add('show');
  $('#scrim').classList.add('show');
}
function closeSheet(){
  $('#sheet').classList.remove('show');
  $('#scrim').classList.remove('show');
}
function sheetItem(ic, t, attr, danger){
  return '<button class="sheet-item' + (danger ? ' danger' : '') + '" ' + attr + '><span class="si-ic">' + icon(ic, 19) + '</span>' + esc(t) + '</button>';
}
function openMenuSheet(){
  var e = activeEntry();
  var isPage = e && e.kind === 'page';
  var starred = isPage && isBookmarked(e.url);
  var html = '<div class="sheet-title">' + esc(isPage ? (e.title || hostOf(e.url)) : 'Relay') + '</div>';
  if (isPage){
    html += sheetItem('find', 'Find in Page', 'data-m="find"');
    html += sheetItem(starred ? 'starFill' : 'star', starred ? 'Remove Bookmark' : 'Bookmark Page', 'data-m="bkm"');
    html += sheetItem('link', 'Links on Page' + (e.linksCount ? ' (' + e.linksCount + ')' : ''), 'data-m="links"');
    html += sheetItem('share', 'Share…', 'data-m="share"');
    html += sheetItem('copy', 'Copy Link', 'data-m="copy"');
    html += sheetItem('download', 'Download Source', 'data-m="dl"');
    html += '<div class="sheet-sep"></div>';
    html += sheetItem('snapshot', 'Reload as Snapshot', 'data-m="snap"');
    html += sheetItem('source', 'View Source', 'data-m="src"');
    html += sheetItem('reload', 'Reload', 'data-m="reload"');
    html += '<div class="sheet-sep"></div>';
    html += sheetItem('external', 'Open in Real Browser', 'data-m="ext"');
  }
  html += sheetItem('plus', 'New Tab', 'data-m="newtab"');
  html += sheetItem('gear', 'Settings', 'data-m="settings"');
  openSheet(html);
}
function menuAction(m){
  closeSheet();
  var e = activeEntry();
  switch (m){
    case 'find': openFind(); break;
    case 'bkm': {
      if (!e || e.kind !== 'page') break;
      var added = toggleBookmark(e.url, e.title);
      toast(added ? 'Bookmarked' : 'Bookmark removed', added ? 'starFill' : 'star');
      break;
    }
    case 'share': {
      if (!e || e.kind !== 'page') break;
      if (navigator.share) navigator.share({ title: e.title || e.url, url: e.url }).catch(function(){});
      else copyText(e.url);
      break;
    }
    case 'copy': if (e && e.kind === 'page') copyText(e.url); break;
    case 'dl': {
      if (!e || e.kind !== 'page') break;
      /* download the page's source HTML (or the current srcdoc) as a file —
         through the real-download ladder so it survives mobile sandboxes */
      var dlName = (e.title || hostOf(e.url) || 'page').replace(/[^\w.-]+/g, '_').slice(0, 60) + '.html';
      setLoading(true, 'Preparing download…');
      setProgress(30);
      var srcText = e.docCache && e.docCache.text ? e.docCache.text : null;
      function finishSave(text, mime){
        var fname = dlName;
        var file = new File([text], fname, { type: mime || 'text/html' });
        triggerBlobDownload(file, fname);
        offerShareFile(fname, mime || 'text/html', function(){ return Promise.resolve(file); });
        progressDone(); setLoading(false);
      }
      if (srcText){
        finishSave(srcText, e.docCache.ct || 'text/html');
      } else {
        netFetch(e.url, { kind: 'doc' }).then(function(r){
          finishSave(r.text, r.ct || 'text/html');
        }).catch(function(){
          progressDone(); setLoading(false);
          toast('Download failed — could not fetch source', 'alert');
        });
      }
      break;
    }
    case 'links': openLinksSheet(); break;
    case 'snap': {
      if (!e || e.kind !== 'page') break;
      e.docCache = null; e.srcdoc = null; e.mode = 'live';
      loadPageEntry(e, { engine: 'jina' });
      break;
    }
    case 'src': viewSource(); break;
    case 'reload': reloadCurrent(); break;
    case 'ext': if (e && e.kind === 'page'){ try{ window.open(e.url, '_blank'); }catch(err){} } break;
    case 'newtab': newTab(); break;
    case 'settings': showView('settings'); break;
  }
}
function openLinksSheet(){
  var e = activeEntry();
  var links = (e && e.links) || [];
  var html = '<div class="sheet-title">Links on Page · ' + (e && e.linksCount || links.length) + '</div>';
  if (!links.length){
    html += '<div class="sheet-note">No links detected yet — the list refreshes as the page updates (countdowns, lazy loads, SPA renders).</div>';
  } else {
    var shown = links.slice(0, 80);
    shown.forEach(function(l, i){
      var host = '';
      try{ host = new URL(l.u).hostname; }catch(eH){ host = String(l.u).slice(0, 40); }
      html += '<div class="ll-row' + (l.d ? ' dl' : '') + '" data-ll="' + i + '">' +
        '<span class="si-ic">' + icon(l.d ? 'download' : 'link', 17) + '</span>' +
        '<span class="ll-txt"><b>' + esc(l.t || host) + '</b><i>' + esc(host) + '</i></span>' +
        (l.d ? '<button type="button" class="ll-dl" data-lldl="' + i + '" aria-label="Download file">' + icon('download', 17) + '</button>' : '') +
        '</div>';
    });
    if (links.length > shown.length){
      html += '<div class="sheet-note">' + (links.length - shown.length) + ' more…</div>';
    }
  }
  openSheet(html);
  try{ $('#sheetBody').setAttribute('data-links-sheet', '1'); }catch(eSA){}
}
function viewSource(){
  var e = activeEntry();
  if (!e || e.kind !== 'page') return;
  $('#srcview').classList.add('show');
  $('#svTitle').textContent = e.url;
  $('#svPre').textContent = 'Fetching source…';
  var show = function(text){ $('#svPre').textContent = String(text).slice(0, 600000); };
  if (e.docCache && e.docCache.text) show(e.docCache.text);
  else netFetch(e.url, { kind: 'doc' }).then(function(r){ show(r.text); })
    .catch(function(err){ show('Fetch failed.\n' + JSON.stringify((err && err.attempts) || err, null, 2)); });
}
function engineSheet(){
  var html = '<div class="sheet-title">Search engine</div>';

/* "Only this proxy": turn everything else off. Works for the super worker,

function useOnlyProxy(id){

  if (id === 'server') label = 'the server proxy';
  else if (id === 'super') label = 'the Super Worker';
  else {
    for (var i = 0; i < (settings.customProxies || []).length; i++){
      if (cPrefixId(settings.customProxies[i]) === id) label = settings.customProxies[i].name || 'your proxy';
    }
    for (var j = 0; j < PUBLIC_PROXIES.length; j++){ if (PUBLIC_PROXIES[j].id === id) label = PUBLIC_PROXIES[j].name; }
  }
  toast('Routing through ' + label + ' only', 'check');
}
function updateEngineChip(){
  var chip = $('#engineChip');
  if (!chip) return;
  var map = { all: 'ALL', bing: 'BING', ddg: 'DDG', mojeek: 'MJK', wiki: 'WIKI', yt: 'VIDEOS', images: 'IMG', news: 'NEWS' };
  chip.textContent = map[settings.engine] || 'ALL';
}

/* ============ 19. Theme ============ */
function applyTheme(){
  var t = settings.theme;
  var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#0A0B0D' : '#F4F5F7');
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if (settings.theme === 'auto') applyTheme(); });

/* ============ 20. Static icons & events ============ */
function renderStaticIcons(){
  $('#btnBack').innerHTML = icon('back');
  $('#btnFwd').innerHTML = icon('fwd');
  $('#btnReload').innerHTML = icon('reload');
  $('#btnModeIc').innerHTML = icon('zap', 19);
  $('#btnMenu').innerHTML = icon('menu');
  $('#goBtn').innerHTML = icon('search', 16);
  $('#addrClear').innerHTML = icon('close', 15);
  $('#findPrev').innerHTML = icon('back', 18);
  $('#findNext').innerHTML = icon('fwd', 18);
  $('#findClose').innerHTML = icon('close', 18);
  $('#resBack').innerHTML = icon('back', 20);
  $('#hsIcon').innerHTML = icon('search', 19);
  $('#bnHomeIc').innerHTML = icon('home', 21);
  $('#bnTabsIc').innerHTML = icon('tabs', 21);
  $('#bnSavedIc').innerHTML = icon('bookmark', 21);
  $('#bnSetIc').innerHTML = icon('gear', 21);
  $('#vwOpen').innerHTML = icon('external', 19);
  $('#vwCopy').innerHTML = icon('copy', 19);
  $('#svClose').innerHTML = icon('close', 18);
  $('#startLogo').innerHTML = 'R';
}
function wireEvents(){
  $('#btnBack').addEventListener('click', goBack);
  $('#btnFwd').addEventListener('click', goForward);
  $('#btnReload').addEventListener('click', reloadCurrent);
  $('#btnMode').addEventListener('click', function(){
    var e = activeEntry();
    if (!e || e.kind !== 'page') return;
    switchMode(e.mode === 'reader' ? 'live' : 'reader');
  });
  $('#btnMenu').addEventListener('click', openMenuSheet);
  /* address bar */
  var addr = $('#addr');
  addr.addEventListener('focus', function(){
    $('#addrbox').classList.add('focus');
    $('#addrClear').hidden = !addr.value;
    addr.select();
    omniUpdate();
  });
  addr.addEventListener('input', function(){
    $('#addrClear').hidden = !addr.value;
    omniUpdate();
  });
  addr.addEventListener('blur', function(){
    $('#addrbox').classList.remove('focus');
    setTimeout(function(){ omniHide(); }, 180);
    setTimeout(updateChrome, 60);
  });
  addr.addEventListener('keydown', omniKey);
  $('#addrClear').addEventListener('click', function(){
    addr.value = '';
    $('#addrClear').hidden = true;
    addr.focus();
  });
  $('#goBtn').addEventListener('click', function(){
    omniHide();
    addr.blur();
    navigate(addr.value);
  });
  /* home search */
  var hs = $('#homesearch');
  hs.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter'){ navigate(hs.value); hs.blur(); }
  });
  $('#heroSearch').addEventListener('focusin', function(){ $('#heroSearch').classList.add('focusw'); });
  $('#heroSearch').addEventListener('focusout', function(){ $('#heroSearch').classList.remove('focusw'); });
  $('#engineChip').addEventListener('click', engineSheet);
  /* results search bar */
  $('#resinput').addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && $('#resinput').value.trim()){ doSearch($('#resinput').value.trim(), { push: true }); }
  });
  $('#resBack').addEventListener('click', goBack);
  /* bottom nav */
  $('#bn-home').addEventListener('click', function(){
    var e = activeEntry();
    if (e && e.kind === 'start') showView('start');
    else goHome();
  });
  $('#bn-tabs').addEventListener('click', function(){
    /* open the tab switcher; tapping Tabs again returns to the page */
    if (currentView === 'tabs'){ showView('page'); activateEntryView(); }
    else { showView('tabs'); }
  });
  $('#bn-saved').addEventListener('click', function(){ showView('bookmarks'); });
  $('#bn-settings').addEventListener('click', function(){ showView('settings'); });
  $('#bkmAll').addEventListener('click', function(){ showView('bookmarks'); });
  /* reader/live toggle lives in the topbar now */
  /* reader controls */
  $('#rdMinus').addEventListener('click', function(){
    settings.readerSize = Math.max(15, (settings.readerSize || 19) - 1);
    document.documentElement.style.setProperty('--readerSize', settings.readerSize + 'px');
    saveSoon();
  });
  $('#rdPlus').addEventListener('click', function(){
    settings.readerSize = Math.min(26, (settings.readerSize || 19) + 1);
    document.documentElement.style.setProperty('--readerSize', settings.readerSize + 'px');
    saveSoon();
  });
  $('#rdSerif').addEventListener('click', function(){
    settings.readerSerif = !settings.readerSerif;
    $('#rdBody').style.fontFamily = settings.readerSerif ? '' : 'var(--sans)';
    $('#rdBody').style.fontSize = settings.readerSerif ? '' : 'calc(var(--readerSize) - 2px)';
    saveSoon();
  });
  /* find bar */
  $('#findInput').addEventListener('input', onFindInput);
  $('#findNext').addEventListener('click', function(){
    var e = activeEntry();
    if (e && e.kind === 'page' && e.mode === 'live') sendToFrame(e, { t: 'findnav', dir: 1 });
    else rdFindNav(1);
  });
  $('#findPrev').addEventListener('click', function(){
    var e = activeEntry();
    if (e && e.kind === 'page' && e.mode === 'live') sendToFrame(e, { t: 'findnav', dir: -1 });
    else rdFindNav(-1);
  });
  $('#findClose').addEventListener('click', closeFind);
  /* overlays */
  $('#scrim').addEventListener('click', closeSheet);
  $('#vwClose').addEventListener('click', function(){ $('#viewer').classList.remove('show'); });
  $('#vwCopy').addEventListener('click', function(){ if (viewerItem) copyText(viewerItem.murl); });
  $('#vwOpen').addEventListener('click', function(){
    if (!viewerItem) return;
    $('#viewer').classList.remove('show');
    var u = viewerItem.purl || viewerItem.murl;
    openUrl(u, { push: true });
  });
  $('#svClose').addEventListener('click', function(){ $('#srcview').classList.remove('show'); });
  $('#svCopy').addEventListener('click', function(){ copyText($('#svPre').textContent); });
  $('#cmCancel').addEventListener('click', function(){ $('#confirmModal').classList.remove('show'); confirmCb = null; });
  $('#cmOk').addEventListener('click', function(){
    $('#confirmModal').classList.remove('show');
    if (confirmCb) confirmCb();
    confirmCb = null;
  });
  /* global delegation */
  document.addEventListener('click', function(ev){
    var el = ev.target.closest ? ev.target.closest('[data-ql],[data-href],[data-omni],[data-m],[data-engine],[data-tab],[data-tabclose],[data-bkmrm],[data-hisrm],[data-ll],[data-lldl]') : null;
    if (!el) return;
    if (el.hasAttribute('data-lldl')){
      ev.stopPropagation();
      var eL = activeEntry();
      var linksL = (eL && eL.links) || [];
      var idxL = parseInt(el.getAttribute('data-lldl'), 10);
      if (linksL[idxL]) relayDownloadUrl(linksL[idxL].u, fileNameOf(linksL[idxL].u) || 'download');
      return;
    }
    if (el.hasAttribute('data-ll')){
      var eL2 = activeEntry();
      var linksL2 = (eL2 && eL2.links) || [];
      var idxL2 = parseInt(el.getAttribute('data-ll'), 10);
      if (linksL2[idxL2]){ closeSheet(); openUrl(linksL2[idxL2].u, { push: true }); }
      return;
    }
    if (el.hasAttribute('data-omni')){ omniActivate(parseInt(el.getAttribute('data-omni'), 10)); return; }
    if (el.hasAttribute('data-m')){ menuAction(el.getAttribute('data-m')); return; }
    if (el.hasAttribute('data-engine')){
      settings.engine = el.getAttribute('data-engine');
      saveSoon();
      closeSheet();
      updateEngineChip();
      toast('Engine: ' + settings.engine, 'check');
      return;
    }
    if (el.hasAttribute('data-ql') || el.hasAttribute('data-href')){
      openUrl(el.getAttribute('data-ql') || el.getAttribute('data-href'), { push: true });
      return;
    }
    if (el.hasAttribute('data-tab')){ switchTab(el.getAttribute('data-tab')); return; }
    if (el.hasAttribute('data-tabclose')){ ev.stopPropagation(); closeTab(el.getAttribute('data-tabclose')); return; }
    if (el.hasAttribute('data-bkmrm')){
      store.bookmarks.splice(parseInt(el.getAttribute('data-bkmrm'), 10), 1);
      saveSoon(); renderBookmarksView();
      return;
    }
    if (el.hasAttribute('data-hisrm')){
      var u = el.getAttribute('data-hisrm');
      store.history = store.history.filter(function(h){ return h.url !== u; });
      saveSoon(); renderHistoryView();
      return;
    }
  });
  /* runtime messages */
  window.addEventListener('message', function(ev){
    var d = ev.data;
    if (!d || typeof d !== 'object') return;
    /* ev.source is NULL when the posting document was already discarded —
       exactly the pagehide escape sentinel's case (rlescape posts while the
       frame is mid-navigation away). The navId match inside
       handleRuntimeMessage is the real gate; here we only reject messages
       that come from a DIFFERENT live window. */
    try{
      if (ev.source){
        var lf = liveFrame();
        if (lf && ev.source !== lf.contentWindow) return;
      }
    }catch(e){ if (ev.source) return; }
    if (d.__relay) handleRuntimeMessage(d);
  });
  /* keyboard shortcuts (desktop) */
  document.addEventListener('keydown', function(ev){
    var mod = ev.metaKey || ev.ctrlKey;
    if (mod && ev.key.toLowerCase() === 'f'){ ev.preventDefault(); openFind(); }
    else if (mod && ev.key.toLowerCase() === 'l'){ ev.preventDefault(); $('#addr').focus(); }
    else if (mod && ev.key.toLowerCase() === 'r'){ ev.preventDefault(); reloadCurrent(); }
    else if (ev.key === 'Escape'){
      if ($('#viewer').classList.contains('show')) $('#viewer').classList.remove('show');
      else if ($('#gallery') && $('#gallery').classList.contains('show')) closeGallery();
      else if ($('#srcview').classList.contains('show')) $('#srcview').classList.remove('show');
      else if ($('#sheet').classList.contains('show')) closeSheet();
      else if ($('#findbar').classList.contains('show')) closeFind();
    }
  });
  window.addEventListener('beforeunload', persistTabs);
}

/* ============ 21. Init ============ */
function init(){
  document.documentElement.style.setProperty('--readerSize', (settings.readerSize || 19) + 'px');
  if (!settings.readerSerif) $('#rdBody').style.fontFamily = 'var(--sans)';
  applyTheme();
  renderStaticIcons();
  updateEngineChip();
  restoreTabs();
  wireEvents();
  renderStartDynamic();
  updateChrome();
  setLoading(false);
  probeServerProxy().then(function(){
    updateChrome();
    renderStartDynamic();
    warmProxies();
    setTimeout(renderStartDynamic, 4000);
    if (settings.superUrl) probeSuperWorker().then(function(){ updateShieldPill(); renderStartDynamic(); });
  }).catch(function(){ warmProxies(); });
}
init();
</script>
