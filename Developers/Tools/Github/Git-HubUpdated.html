    // ---------- diff engine ----------
    function splitLines(v) {
      if (!v) return [];
      const l = String(v).split('\n');
      if (l[l.length - 1] === '') l.pop();
      return l;
    }

    function computeLineDiff(a, b) {
      a = a ?? ''; b = b ?? '';
      if (a === b) return [{ lines: splitLines(a) }];
      if (window.Diff && typeof window.Diff.diffLines === 'function') {
        try {
          const parts = window.Diff.diffLines(a, b, { timeout: 2500 });
          if (parts) return parts.map(p => ({ added: !!p.added, removed: !!p.removed, lines: splitLines(p.value) }));
        } catch (e) { /* fall through */ }
      }
      // Fallback: trim common prefix/suffix, show the middle as replaced
      const A = splitLines(a), B = splitLines(b);
      let s = 0;
      while (s < A.length && s < B.length && A[s] === B[s]) s++;
      let e = 0;
      while (e < A.length - s && e < B.length - s && A[A.length - 1 - e] === B[B.length - 1 - e]) e++;
      const parts = [];
      if (s) parts.push({ lines: A.slice(0, s) });
      if (A.length - s - e > 0) parts.push({ removed: true, lines: A.slice(s, A.length - e) });
      if (B.length - s - e > 0) parts.push({ added: true, lines: B.slice(s, B.length - e) });
      if (e) parts.push({ lines: A.slice(A.length - e) });
      return parts;
    }

    function diffRow(t, o, n, code) {
      return `<div class="diff-line ${t}"><span class="diff-num">${o ?? ''}</span><span class="diff-num">${n ?? ''}</span><span class="diff-code">${code}</span></div>`;
    }

    function renderDiffParts(parts, ctx = 3, maxLines = 1500) {
      const rows = [];
      let o = 1, n = 1, add = 0, del = 0;
      for (const p of parts) {
        for (const line of p.lines) {
          if (p.added) { rows.push({ t: 'add', n: n++, line }); add++; }
          else if (p.removed) { rows.push({ t: 'del', o: o++, line }); del++; }
          else rows.push({ t: 'ctx', o: o++, n: n++, line });
        }
      }
      if (!add && !del) return { html: '<div class="diff-empty">No content changes.</div>', add, del };
      const keep = new Uint8Array(rows.length);
      rows.forEach((r, i) => {
        if (r.t !== 'ctx') for (let j = Math.max(0, i - ctx); j <= Math.min(rows.length - 1, i + ctx); j++) keep[j] = 1;
      });
      let html = '', skipped = 0, shown = 0;
      for (let i = 0; i < rows.length; i++) {
        if (!keep[i]) { skipped++; continue; }
        if (skipped) { html += diffRow('hunk', '', '', `⋯ ${plural(skipped, 'unchanged line')}`); skipped = 0; }
        if (shown >= maxLines) { html += diffRow('hunk', '', '', `… diff truncated — ${rows.length - i} more lines`); skipped = 0; break; }
        const r = rows[i];
        shown++;
        html += diffRow(r.t, r.o, r.n, (r.t === 'add' ? '+' : r.t === 'del' ? '-' : ' ') + escFast(r.line));
      }
      if (skipped) html += diffRow('hunk', '', '', `⋯ ${plural(skipped, 'unchanged line')}`);
      return { html, add, del };
    }

    function renderPatch(patch) {
      if (!patch) return '<div class="diff-empty">Diff not available (binary file or too large to display).</div>';
      let o = 0, n = 0;
      return patch.split('\n').map(l => {
        if (l.startsWith('@@')) {
          const m = /@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(l);
          if (m) { o = +m[1]; n = +m[2]; }
          return diffRow('hunk', '', '', escFast(l));
        }
        if (l.startsWith('+')) return diffRow('add', '', n++, escFast(l));
        if (l.startsWith('-')) return diffRow('del', o++, '', escFast(l));
        if (l.startsWith('\\')) return '';
        return diffRow('ctx', o++, n++, escFast(l));
      }).join('');
    }

    // ---------- push engine: many file changes → ONE commit ----------
    // changes: [{ path, action: create|update|delete|rename, content?, contentBase64?, from?, fromSha? }]
    async function pushChanges({ owner, repo, branch, message, changes, mode = 'direct', prTitle, prBody, branchName, label, onProgress }) {
      const api = state.api;
      const step = t => onProgress && onProgress(t);
      step('Reading branch…');
      let baseSha;
      try {
        baseSha = (await api.getRef(owner, repo, branch)).object.sha;
      } catch (e) {
        if (e.status === 409) return pushViaContents({ owner, repo, branch: null, message, changes, step });
        if (e.status === 404) {
          const r = await api.getRepo(owner, repo);
          if (!r.size) return pushViaContents({ owner, repo, branch: null, message, changes, step });
          throw new Error(`Branch "${branch}" was not found in ${owner}/${repo}`);
        }
        throw e;
      }
      const baseCommit = await api.getGitCommit(owner, repo, baseSha);
      const tree = [];
      let i = 0;
      for (const ch of changes) {
        i++;
        step(`Preparing ${i}/${changes.length}: ${ch.path}`);
        if (ch.action === 'delete') {
          tree.push({ path: ch.path, mode: '100644', type: 'blob', sha: null });
          continue;
        }
        let blobSha;
        if (ch.contentBase64 != null) blobSha = (await api.createBlob(owner, repo, ch.contentBase64, 'base64')).sha;
        else if (ch.content != null) blobSha = (await api.createBlob(owner, repo, ch.content, 'utf-8')).sha;
        else if (ch.fromSha) blobSha = ch.fromSha;
        else throw new Error(`No content for ${ch.path}`);
        tree.push({ path: ch.path, mode: '100644', type: 'blob', sha: blobSha });
        if (ch.action === 'rename' && ch.from && ch.from !== ch.path) {
          tree.push({ path: ch.from, mode: '100644', type: 'blob', sha: null });
        }
      }
      step('Creating commit…');
      const newTree = await api.createTree(owner, repo, baseCommit.tree.sha, tree);
      const commit = await api.createCommit(owner, repo, message, newTree.sha, [baseSha]);
      if (mode === 'pr') {
        step('Opening pull request…');
        await api.createRef(owner, repo, branchName, commit.sha);
        const pr = await api.createPull(owner, repo, { title: prTitle || message, head: branchName, base: branch, body: prBody || '' });
        if (label) await api.addLabels(owner, repo, pr.number, [label]).catch(() => {});
        return { commitSha: commit.sha, pr };
      }
      step(`Pushing to ${branch}…`);
      await api.updateRef(owner, repo, branch, commit.sha, false);
      return { commitSha: commit.sha };
    }

    // Fallback for empty repositories (Git Data API needs an existing commit)
    async function pushViaContents({ owner, repo, branch, message, changes, step }) {
      let last = null, i = 0;
      for (const ch of changes) {
        i++;
        step && step(`Committing ${i}/${changes.length}: ${ch.path}`);
        const base = branch ? { branch } : {};
        if (ch.action === 'delete') continue;
        const content = ch.contentBase64 != null ? ch.contentBase64 : utf8ToBase64(ch.content || '');
        last = await state.api.putRawFile(owner, repo, ch.path, { message, content, ...base });
      }
      return { commitSha: last?.commit?.sha || null };
    }

    // ---------- storage-backed state ----------
    function loadStaged() {
      try { return JSON.parse(safeStorage.get('gh_staged') || '[]'); } catch (e) { return []; }
    }
    function saveStaged() {
      try { safeStorage.set('gh_staged', JSON.stringify(state.staged)); }
      catch (e) { showToast('Could not save staged changes on this device', 'warning'); }
    }
    Object.assign(state, {
      currentBranch: null,
      staged: loadStaged(),
      requestCount: 0,
      requestsTab: 'pending',
      selectMode: false,
      selectedRepos: new Set(),
      repoSort: 'updated',
      repoType: 'all',
      repoLanguage: '',
      repoQuery: ''
    });

    function stageChange(item) {
      state.staged = state.staged.filter(s => !(s.owner === item.owner && s.repo === item.repo && s.branch === item.branch && s.path === item.path));
      state.staged.push({ ...item, id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), stagedAt: nowIso() });
      saveStaged();
    }

    function stagedGroups() {
      const groups = {};
      for (const s of state.staged) {
        const key = `${s.owner}/${s.repo}@${s.branch}`;
        (groups[key] = groups[key] || { key, owner: s.owner, repo: s.repo, branch: s.branch, items: [] }).items.push(s);
      }
      return Object.values(groups);
    }

    function stagedToRequest(key) {
      const g = stagedGroups().find(x => x.key === key);
      if (!g) return null;
      return {
        id: 'staged-' + Date.now().toString(36),
        title: `${plural(g.items.length, 'staged change')} to ${g.owner}/${g.repo}`,
        summary: 'Changes you staged on this device. Review them and push everything as a single commit.',
        author: state.user?.login,
        status: 'pending',
        created_at: g.items[0].stagedAt,
        target: { repo: `${g.owner}/${g.repo}`, branch: g.branch },
        commit_message: g.items.length === 1 ? `${g.items[0].action === 'create' ? 'Create' : 'Update'} ${g.items[0].path}` : `Update ${g.items.length} files`,
        changes: g.items.map(s => ({ path: s.path, action: s.action, content: s.content, base_sha: s.baseSha, _stagedId: s.id })),
        _staged: true,
        _stagedKey: key
      };
    }

    // =====================================================================
    //  CHANGE REQUESTS — proposals from Perplexity Computer
    //  Stored as JSON files in a private inbox repo: <you>/computer-requests
    //  requests/<id>.json. Pull requests labelled "computer-request" in any
    //  of your repos also show up here.
    // =====================================================================

    const REQUEST_ACTIONS = ['create', 'update', 'delete', 'rename'];

    function inboxRepoFull() {
      return safeStorage.get('gh_inbox_repo') || `${state.user?.login || 'me'}/${INBOX_DEFAULT_NAME}`;
    }
    function inboxParts() {
      const [owner, repo] = inboxRepoFull().split('/');
      return { owner, repo };
    }

    function validateRequest(r) {
      const errs = [];
      if (!r || typeof r !== 'object') return ['Request must be a JSON object'];
      if (!r.title) errs.push('Missing "title"');
      const repo = r.target?.repo;
      if (!repo || !/^[\w.-]+\/[\w.-]+$/.test(repo)) errs.push('"target.repo" must look like owner/name');
      if (!Array.isArray(r.changes) || !r.changes.length) errs.push('"changes" must be a non-empty array');
      (r.changes || []).forEach((c, i) => {
        if (!c.path) errs.push(`changes[${i}] is missing "path"`);
        if (!REQUEST_ACTIONS.includes(c.action)) errs.push(`changes[${i}].action must be one of ${REQUEST_ACTIONS.join(', ')}`);
        if ((c.action === 'create' || c.action === 'update') && c.content == null && c.content_base64 == null) errs.push(`changes[${i}] needs "content"`);
        if (c.action === 'rename' && !c.from) errs.push(`changes[${i}] (rename) needs "from"`);
      });
      return errs;
    }

    function requestStatus(r) { return r.status || 'pending'; }

    async function mapLimit(items, limit, fn) {
      const out = new Array(items.length);
      let i = 0;
      const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
        while (i < items.length) { const idx = i++; out[idx] = await fn(items[idx], idx); }
      });
      await Promise.all(workers);
      return out;
    }

    async function loadRequests(force = false) {
      if (state.requests && !force && Date.now() - state.requests.loadedAt < 60000) return state.requests;
      const { owner, repo } = inboxParts();
      const result = { items: [], prs: [], inboxMissing: false, errors: [], loadedAt: Date.now() };
      const filesP = state.api.getMeta(owner, repo, 'requests').catch(e => {
        if (e.status === 404) {
          return state.api.getRepo(owner, repo).then(() => [], () => { result.inboxMissing = true; return []; });
        }
        result.errors.push('Inbox: ' + e.message);
        return [];
      });
      const prsP = state.api.searchIssues(`is:pr is:open label:${CR_LABEL} user:${state.user.login} archived:false`, 50)
        .then(r => r.items || []).catch(() => []);
      const [files, prs] = await Promise.all([filesP, prsP]);
      const jsonFiles = (Array.isArray(files) ? files : []).filter(f => f.type === 'file' && f.name.endsWith('.json'));
      result.items = (await mapLimit(jsonFiles, 6, async f => {
        try {
          const raw = await state.api.getRaw(owner, repo, f.path);
          const obj = JSON.parse(raw);
          obj.id = obj.id || f.name.replace(/\.json$/, '');
          obj._path = f.path;
          obj._sha = f.sha;
          obj._errors = validateRequest(obj);
          return obj;
        } catch (e) {
          return { id: f.name.replace(/\.json$/, ''), title: f.name, _path: f.path, _sha: f.sha, _errors: ['Could not parse JSON: ' + e.message], changes: [], status: 'invalid' };
        }
      })).sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
      result.prs = prs;
      state.requests = result;
      updateRequestCount();
      return result;
    }

    function updateRequestCount() {
      const r = state.requests;
      const pending = r ? r.items.filter(x => requestStatus(x) === 'pending' && !(x._errors || []).length).length + r.prs.length : 0;
      state.requestCount = pending + stagedGroups().length;
    }

    async function saveRequestFile(req, message) {
      const { owner, repo } = inboxParts();
      const clean = {};
      for (const [k, v] of Object.entries(req)) if (!k.startsWith('_')) clean[k] = v;
      const res = await state.api.putRawFile(owner, repo, req._path, {
        message,
        content: utf8ToBase64(JSON.stringify(clean, null, 2) + '\n'),
        sha: req._sha
      });
      req._sha = res.content.sha;
      return req;
    }

    // Refresh badge counts quietly in the background
    function refreshRequestBadge() {
      if (!state.api || !state.user) return;
      loadRequests(true).then(() => {
        document.querySelectorAll('[data-req-badge]').forEach(el => {
          el.textContent = state.requestCount;
          el.style.display = state.requestCount ? '' : 'none';
        });
      }).catch(() => {});
    }

    function badge(n, extra = '') {
      return `<span class="count-badge ${extra}" data-req-badge style="${n ? '' : 'display:none'}">${n}</span>`;
    }

    // ---------- icons ----------
    const ICONS = {
      inbox: '<svg viewBox="0 0 16 16"><path d="M2.8 2.06A1.75 1.75 0 014.41 1h7.18c.7 0 1.333.417 1.61 1.06l2.74 6.395c.04.093.06.194.06.295v4.5A1.75 1.75 0 0114.25 15H1.75A1.75 1.75 0 010 13.25v-4.5c0-.101.02-.202.06-.295L2.8 2.06zm1.61.44a.25.25 0 00-.23.152L1.887 8H4.75a.75.75 0 01.6.3L6.625 10h2.75l1.275-1.7a.75.75 0 01.6-.3h2.863L11.82 2.652a.25.25 0 00-.23-.152H4.41zm10.09 7h-2.875l-1.275 1.7a.75.75 0 01-.6.3h-3.5a.75.75 0 01-.6-.3L4.375 9.5H1.5v3.75c0 .138.112.25.25.25h12.5a.25.25 0 00.25-.25V9.5z"/></svg>',
      pr: '<svg viewBox="0 0 16 16"><path d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5h-1V4h1a1 1 0 011 1v5.628a2.251 2.251 0 101.5 0V5A2.5 2.5 0 0011 2.5zm1 10.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0zM3.75 12a.75.75 0 100 1.5.75.75 0 000-1.5z"/></svg>',
      file: '<svg viewBox="0 0 16 16"><path d="M3.75 1.5a.25.25 0 00-.25.25v11.5c0 .138.112.25.25.25h8.5a.25.25 0 00.25-.25V6H9.75A1.75 1.75 0 018 4.25V1.5H3.75zm5.75.56v2.19c0 .138.112.25.25.25h2.19L9.5 2.06zM2 1.75C2 .784 2.784 0 3.75 0h5.086c.464 0 .909.184 1.237.513l3.414 3.414c.329.328.513.773.513 1.237v8.086A1.75 1.75 0 0112.25 15h-8.5A1.75 1.75 0 012 13.25V1.75z"/></svg>',
      check: '<svg viewBox="0 0 16 16"><path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/></svg>',
      x: '<svg viewBox="0 0 16 16"><path d="M3.72 3.72a.75.75 0 011.06 0L8 6.94l3.22-3.22a.75.75 0 111.06 1.06L9.06 8l3.22 3.22a.75.75 0 11-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 01-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 010-1.06z"/></svg>',
      comment: '<svg viewBox="0 0 16 16"><path d="M1.75 1h12.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0114.25 13H8.06l-2.573 2.573A1.458 1.458 0 013 14.543V13H1.75A1.75 1.75 0 010 11.25v-8.5C0 1.784.784 1 1.75 1zM1.5 2.75v8.5c0 .138.112.25.25.25h2a.75.75 0 01.75.75v2.19l2.72-2.72a.749.749 0 01.53-.22h6.5a.25.25 0 00.25-.25v-8.5a.25.25 0 00-.25-.25H1.75a.25.25 0 00-.25.25z"/></svg>',
      branch: '<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M9.5 3.25a2.25 2.25 0 113 2.122V6A2.5 2.5 0 0110 8.5H6a1 1 0 00-1 1v1.128a2.251 2.251 0 11-1.5 0V5.372a2.25 2.25 0 111.5 0v1.836A2.492 2.492 0 016 7h4a1 1 0 001-1v-.628A2.25 2.25 0 019.5 3.25zm-6 0a.75.75 0 101.5 0 .75.75 0 00-1.5 0zm8.25-.75a.75.75 0 100 1.5.75.75 0 000-1.5zM4.25 12a.75.75 0 100 1.5.75.75 0 000-1.5z"/></svg>'
    };

    function requestIconFor(status) {
      if (status === 'applied' || status === 'pr_opened') return ICONS.check;
      if (status === 'rejected') return ICONS.x;
      if (status === 'changes_requested') return ICONS.comment;
      return ICONS.file;
    }

    const STATUS_LABEL = { pending: 'Pending', changes_requested: 'Changes requested', applied: 'Pushed', pr_opened: 'PR opened', rejected: 'Rejected', invalid: 'Invalid' };

    function changeSummary(changes) {
      const c = { create: 0, update: 0, delete: 0, rename: 0 };
      (changes || []).forEach(x => { if (c[x.action] != null) c[x.action]++; });
      return Object.entries(c).filter(([, n]) => n).map(([k, n]) => `${n} ${k === 'update' ? 'modified' : k === 'create' ? 'new' : k === 'delete' ? 'deleted' : 'renamed'}`).join(' · ') || 'No changes';
    }

    function renderRequestRow(r) {
      const st = r._errors?.length ? 'invalid' : requestStatus(r);
      const onclick = r._staged ? `openStagedRequest(${jsArg(r._stagedKey)})` : `openRequest(${jsArg(r.id)})`;
      return `
        <div class="req-item" onclick="${onclick}">
          <div class="req-icon ${st}">${requestIconFor(st)}</div>
          <div class="req-body">
            <div class="req-title">${escFast(r.title)}</div>
            <div class="req-meta">
              <span class="status-pill ${st}">${STATUS_LABEL[st] || st}</span>
              <span>${escFast(r.target?.repo || '')}${r.target?.branch ? ` → ${escFast(r.target.branch)}` : ''}</span>
              <span>${changeSummary(r.changes)}</span>
              ${r.created_at ? `<span>${timeAgo(r.created_at)}</span>` : ''}
              ${r._staged ? '<span class="status-pill outline">This device</span>' : r.author ? `<span>by ${escFast(r.author)}</span>` : ''}
            </div>
          </div>
        </div>`;
    }

    function renderPrRequestRow(pr) {
      const repo = pr.repository_url.split('/repos/')[1];
      const [o, n] = repo.split('/');
      return `
        <div class="req-item" onclick="openPull(${jsArg(o)}, ${jsArg(n)}, ${pr.number})">
          <div class="req-icon pending">${ICONS.pr}</div>
          <div class="req-body">
            <div class="req-title">${escFast(pr.title)}</div>
            <div class="req-meta">
              <span class="status-pill pending">Open PR</span>
              <span>${escFast(repo)} #${pr.number}</span>
              <span>${timeAgo(pr.created_at)}</span>
              <span>by ${escFast(pr.user?.login || '')}</span>
            </div>
          </div>
        </div>`;
    }

    // ---------- Inbox view ----------
    function renderRequests() {
      if (!state.viewData) {
        loadRequests(true).then(r => { state.viewData = { loaded: true }; render(); })
          .catch(e => { state.viewData = { error: e.message }; render(); });
        return renderLoading();
      }
      if (state.viewData.error) return `<div class="empty-state">Could not load requests: ${escFast(state.viewData.error)}</div>`;
      const r = state.requests;
      const tab = state.requestsTab;
      const staged = stagedGroups().map(g => stagedToRequest(g.key));
      const pendingItems = r.items.filter(x => requestStatus(x) === 'pending' && !x._errors.length);
      const reviewItems = r.items.filter(x => requestStatus(x) === 'changes_requested' || x._errors.length);
      const doneItems = r.items.filter(x => ['applied', 'pr_opened', 'rejected'].includes(requestStatus(x)));
      const counts = { pending: pendingItems.length + r.prs.length + staged.length, review: reviewItems.length, done: doneItems.length };

      let body = '';
      if (tab === 'pending') {
        body = `
          ${staged.length ? `<div class="card"><div class="card-header">Staged on this device</div>${staged.map(renderRequestRow).join('')}</div>` : ''}
          ${pendingItems.length ? `<div class="card"><div class="card-header">From Perplexity Computer</div>${pendingItems.map(renderRequestRow).join('')}</div>` : ''}
          ${r.prs.length ? `<div class="card"><div class="card-header">Open pull requests labelled <code class="inline">${CR_LABEL}</code></div>${r.prs.map(renderPrRequestRow).join('')}</div>` : ''}
          ${!counts.pending ? `<div class="card"><div class="empty-state">
              <div style="font-size: 15px; color: var(--text-primary); margin-bottom: 6px;">You're all caught up</div>
              <div>When Perplexity Computer proposes changes to your repos, they land here for you to review and push.</div>
            </div></div>` : ''}`;
      } else if (tab === 'review') {
        body = reviewItems.length ? `<div class="card">${reviewItems.map(renderRequestRow).join('')}</div>` : '<div class="card"><div class="empty-state">Nothing waiting on a revision.</div></div>';
      } else {
        body = doneItems.length ? `<div class="card">${doneItems.map(renderRequestRow).join('')}</div>` : '<div class="card"><div class="empty-state">No pushed or rejected requests yet.</div></div>';
      }

      return `
        <div class="row-between" style="margin-bottom: 16px; flex-wrap: wrap;">
          <div>
            <h2 style="font-size: 20px; margin-bottom: 4px;">Change requests</h2>
            <div class="muted small">Inbox: <span class="link" onclick="openRepo(${jsArg(inboxParts().owner)}, ${jsArg(inboxParts().repo)})">${escFast(inboxRepoFull())}</span></div>
          </div>
          <div class="row">
            <button class="btn btn-sm btn-secondary" onclick="refreshRequests()">Refresh</button>
            <button class="btn btn-sm btn-secondary" onclick="showImportRequestModal()">Paste request</button>
            <button class="btn btn-sm btn-secondary" onclick="showInboxSettings()">Setup</button>
          </div>
        </div>
        ${r.inboxMissing ? `
          <div class="card inbox-hero" style="border-color: var(--accent-blue);">
            <div class="card-body">
              <strong>Set up your request inbox</strong>
              <div class="muted" style="font-size: 14px; line-height: 1.5;">Create a private repo <code class="inline">${escFast(inboxRepoFull())}</code>. Perplexity Computer writes proposed changes there as JSON files; you review the diffs here and push with one tap. Nothing touches your code until you approve it.</div>
              <div class="row"><button class="btn btn-primary btn-sm" onclick="setupInbox()">Create inbox repo</button>
              <button class="btn btn-secondary btn-sm" onclick="showProtocolModal()">How it works</button></div>
            </div>
          </div>` : ''}
        ${r.errors.length ? `<div class="warn-banner" style="margin: 0 0 12px;">${r.errors.map(escFast).join('<br>')}</div>` : ''}
        <div style="margin-bottom: 12px;">
          <div class="segmented" role="tablist">
            <button class="${tab === 'pending' ? 'active' : ''}" onclick="setRequestsTab('pending')">Pending ${counts.pending ? `<span class="count-badge">${counts.pending}</span>` : ''}</button>
            <button class="${tab === 'review' ? 'active' : ''}" onclick="setRequestsTab('review')">Needs revision ${counts.review ? `<span class="count-badge muted-badge">${counts.review}</span>` : ''}</button>
            <button class="${tab === 'done' ? 'active' : ''}" onclick="setRequestsTab('done')">History</button>
          </div>
        </div>
        ${body}`;
    }

    function setRequestsTab(t) { state.requestsTab = t; render(); }
    function refreshRequests() { state.viewData = null; state.requests = null; render(); }

    // ---------- Request detail ----------
    function openRequest(id) {
      state.currentView = 'request';
      state.currentRequest = { id };
      state.viewData = null;
      closeSidebar();
      render();
      window.scrollTo(0, 0);
    }

    function openStagedRequest(key) {
      state.currentView = 'request';
      state.currentRequest = { stagedKey: key };
      state.viewData = null;
      closeSidebar();
      render();
      window.scrollTo(0, 0);
    }

    async function fetchCurrentFile(owner, repo, path, ref) {
      try {
        const meta = await state.api.getMeta(owner, repo, path, ref);
        if (Array.isArray(meta)) return { isDir: true };
        let text = null, binary = false;
        if (meta.content && meta.encoding === 'base64') {
          text = base64ToUtf8(meta.content.replace(/\n/g, ''));
        } else if (meta.size <= 20 * 1024 * 1024) {
          text = await state.api.getRaw(owner, repo, path, ref);
        }
        if (text != null && /\u0000/.test(text.slice(0, 8000))) binary = true;
        return { exists: true, sha: meta.sha, size: meta.size, text, binary };
      } catch (e) {
        if (e.status === 404) return { exists: false };
        throw e;
      }
    }

    async function loadRequestDetail() {
      try {
        let req;
        if (state.currentRequest.stagedKey) {
          req = stagedToRequest(state.currentRequest.stagedKey);
          if (!req) { navigate('requests'); return; }
        } else {
          if (!state.requests) await loadRequests(true);
          req = state.requests.items.find(x => x.id === state.currentRequest.id);
          if (!req) { await loadRequests(true); req = state.requests.items.find(x => x.id === state.currentRequest.id); }
          if (!req) throw new Error('Request not found — it may have been deleted.');
        }
        const errors = req._errors || [];
        let files = [], branches = [], repoInfo = null;
        if (!errors.length) {
          const [owner, repo] = req.target.repo.split('/');
          repoInfo = await state.api.getRepo(owner, repo);
          const branch = req.target.branch || repoInfo.default_branch;
          req.target.branch = branch;
          branches = await state.api.listBranches(owner, repo).catch(() => []);
          files = await mapLimit(req.changes, 5, async (ch) => {
            const cur = await fetchCurrentFile(owner, repo, ch.action === 'rename' ? ch.from : ch.path, branch);
            let destExists = null;
            if (ch.action === 'rename') destExists = (await fetchCurrentFile(owner, repo, ch.path, branch)).exists;
            return { change: ch, current: cur, destExists };
          });
        }
        state.viewData = { req, files, branches, repoInfo, excluded: new Set(), errors };
        render();
      } catch (e) {
        state.viewData = { fatal: e.message };
        render();
      }
    }

    function proposedText(ch) {
      if (ch.content != null) return ch.content;
      if (ch.content_base64 != null) { try { return base64ToUtf8(ch.content_base64); } catch (e) { return null; } }
      return null;
    }

    function fileWarnings(f) {
      const w = [];
      const ch = f.change, cur = f.current;
      if (cur.isDir) w.push('Path is a folder in the target repo.');
      if (ch.action === 'create' && cur.exists) w.push('This file already exists — pushing will overwrite it.');
      if (ch.action === 'update' && !cur.exists) w.push('File does not exist on this branch yet — it will be created.');
      if (ch.action === 'update' && cur.exists && ch.base_sha && ch.base_sha !== cur.sha) w.push('The file changed on GitHub after this request was written. Review the diff carefully — pushing replaces the current version.');
      if (ch.action === 'delete' && !cur.exists) w.push('File is already gone — nothing to delete.');
      if (ch.action === 'rename' && !cur.exists) w.push(`Source file ${ch.from} was not found.`);
      if (ch.action === 'rename' && f.destExists) w.push('Destination already exists — it will be overwritten.');
      if (cur.binary) w.push('Current file looks binary; the diff may be unreadable.');
      return w;
    }

    function renderRequestFile(f, i, excluded, actionable = true) {
      const ch = f.change;
      const before = f.current.exists ? (f.current.text ?? '') : '';
      const after = ch.action === 'delete' ? '' : ch.action === 'rename' && proposedText(ch) == null ? before : (proposedText(ch) ?? '');
      const d = renderDiffParts(computeLineDiff(before, after));
      const warns = fileWarnings(f);
      const on = !excluded.has(i);
      const label = ch.action === 'rename' ? `${escFast(ch.from)} → ${escFast(ch.path)}` : escFast(ch.path);
      return `
        <div class="card diff-file" style="${on ? '' : 'opacity: 0.55;'}">
          <details class="diff-details" ${i < 8 ? 'open' : ''}>
            <summary class="diff-file-header">
              <span class="chev">▶</span>
              <span class="action-pill ${ch.action}">${ch.action}</span>
              <span class="diff-file-path">${label}</span>
              <span class="diff-stat"><span class="a">+${d.add}</span> <span class="d">−${d.del}</span></span>
              ${state.viewData.req._staged || !actionable ? '' : `<button class="btn btn-sm btn-secondary" onclick="event.preventDefault(); event.stopPropagation(); editRequestChange(${i})" ${ch.action === 'delete' ? 'disabled' : ''}>Edit</button>`}
              ${actionable ? `<label class="checkbox-label" onclick="event.stopPropagation()" style="margin: 0;">
                <input type="checkbox" ${on ? 'checked' : ''} onchange="toggleRequestFile(${i}, this.checked)"> Include
              </label>` : ''}
            </summary>
            ${warns.map(w => `<div class="warn-banner">${escFast(w)}</div>`).join('')}
            ${ch.note ? `<div class="info-banner">${escFast(ch.note)}</div>` : ''}
            <div class="diff-body">${d.html}</div>
          </details>
        </div>`;
    }

    function renderRequest() {
      if (!state.viewData) { loadRequestDetail(); return renderLoading(); }
      if (state.viewData.fatal) return `
        <div class="breadcrumb"><span class="breadcrumb-item" onclick="navigate('requests')">Requests</span></div>
        <div class="card"><div class="empty-state">${escFast(state.viewData.fatal)}</div></div>`;
      const { req, files, errors, excluded, repoInfo } = state.viewData;
      const st = errors.length ? 'invalid' : requestStatus(req);
      const actionable = !errors.length && ['pending', 'changes_requested'].includes(st);
      const totals = files.reduce((acc, f, i) => {
        if (excluded.has(i)) return acc;
        acc.n++;
        return acc;
      }, { n: 0 });
      return `
        <div class="breadcrumb">
          <span class="breadcrumb-item" onclick="navigate('requests')">Requests</span>
          <span class="breadcrumb-separator">/</span>
          <span>${escFast(req._staged ? 'Staged changes' : req.id)}</span>
        </div>
        <div class="card">
          <div class="card-body">
            <div class="row" style="margin-bottom: 8px;">
              <span class="status-pill ${st}">${STATUS_LABEL[st] || st}</span>
              ${req.target?.repo ? `<span class="link" onclick="openRepo(${jsArg(req.target.repo.split('/')[0])}, ${jsArg(req.target.repo.split('/')[1])})">${escFast(req.target.repo)}</span>` : ''}
              ${req.target?.branch ? `<span class="status-pill outline">${ICONS.branch} ${escFast(req.target.branch)}</span>` : ''}
            </div>
            <h2 style="font-size: 20px; margin-bottom: 6px; word-break: break-word;">${escFast(req.title)}</h2>
            <div class="muted small" style="margin-bottom: 12px;">
              ${req.author ? `Proposed by ${escFast(req.author)} · ` : ''}${req.created_at ? timeAgo(req.created_at) : ''} · ${changeSummary(req.changes)}
            </div>
            ${req.summary ? `<div class="markdown">${renderMarkdown(req.summary)}</div>` : ''}
            ${req.commit_message ? `<div class="kv" style="margin-top: 10px;"><span>Commit message</span><span style="text-align: right; word-break: break-word;">${escFast(req.commit_message.split('\n')[0])}</span></div>` : ''}
            ${req.applied_commit ? `<div class="kv"><span>Pushed commit</span><a class="sha" href="${ghUrl(`${req.target.repo}/commit/${req.applied_commit}`)}" target="_blank" rel="noopener">${req.applied_commit.slice(0, 7)}</a></div>` : ''}
            ${req.pr_url ? `<div class="kv"><span>Pull request</span><a class="link" href="${escAttr(req.pr_url)}" target="_blank" rel="noopener">${escFast(req.pr_url.split('/').slice(-3).join('/'))}</a></div>` : ''}
          </div>
        </div>
        ${errors.length ? `<div class="warn-banner" style="margin: 0 0 16px;"><strong>This request can't be applied:</strong><br>${errors.map(escFast).join('<br>')}</div>` : ''}
        ${req.feedback?.length ? `
          <div class="card">
            <div class="card-header">Review notes</div>
            ${req.feedback.map(f => `<div class="feedback-item"><div class="muted small" style="margin-bottom: 4px;">${escFast(f.by || '')} · ${f.at ? timeAgo(f.at) : ''}</div><div class="markdown">${renderMarkdown(f.message || '')}</div></div>`).join('')}
          </div>` : ''}
        ${repoInfo?.archived ? '<div class="warn-banner" style="margin: 0 0 16px;">The target repository is archived. Unarchive it in Settings before pushing.</div>' : ''}
        <h3 style="margin: 16px 0 12px; font-size: 16px;">Files (${files.length})</h3>
        ${files.map((f, i) => renderRequestFile(f, i, excluded, actionable)).join('')}
        <div class="sticky-actions">
          ${actionable ? `
            <button class="btn btn-primary" onclick="showApplyRequestModal()" ${totals.n ? '' : 'disabled'}>Push ${plural(totals.n, 'file')}…</button>
            ${req._staged ? `<button class="btn btn-secondary" onclick="discardStaged(${jsArg(req._stagedKey)})">Discard staged</button>` : `
              <button class="btn btn-secondary" onclick="showRequestChangesModal()">Request changes</button>
              <span class="spacer"></span>
              <button class="btn btn-danger btn-sm" onclick="rejectRequest()">Reject</button>`}
          ` : `
            <span class="muted small">${st === 'invalid' ? 'Fix the JSON in the inbox repo, or delete it.' : 'This request is closed.'}</span>
            <span class="spacer"></span>
            ${!req._staged && st !== 'pending' && !errors.length ? `<button class="btn btn-secondary btn-sm" onclick="reopenRequest()">Reopen</button>` : ''}
          `}
          ${!req._staged ? `<button class="btn btn-secondary btn-sm" onclick="deleteRequest()">Delete</button>` : ''}
        </div>`;
    }

    function toggleRequestFile(i, on) {
      const ex = state.viewData.excluded;
      on ? ex.delete(i) : ex.add(i);
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
    }

    function editRequestChange(i) {

    async function saveRequestChangeEdit(i) {
      const v = document.getElementById('reqEditContent').value;
      const { req, files } = state.viewData;
      req.changes[i].content = v;
      delete req.changes[i].content_base64;
      files[i].change = req.changes[i];
      closeModal();
      try {
        if (!req._staged) {
          req.edited_by_user = true;

    function showApplyRequestModal() {
      const { req, branches, repoInfo, excluded, files } = state.viewData;
      const base = req.target.branch;
      const names = branches.map(b => b.name);
      if (!names.includes(base)) names.unshift(base);
      const suggested = `computer/${slugify(req.title)}`;
      const n = files.length - excluded.size;
      showModal('Push changes', `
        <div class="kv"><span>Repository</span><span>${escFast(req.target.repo)}</span></div>
        <div class="kv" style="margin-bottom: 12px;"><span>Files</span><span>${plural(n, 'file')} in one commit</span></div>
        <div class="input-group">
          <label class="input-label">Target branch</label>
          <select class="select" id="applyBranch">${names.map(b => `<option value="${escAttr(b)}" ${b === base ? 'selected' : ''}>${escFast(b)}${b === repoInfo?.default_branch ? ' (default)' : ''}</option>`).join('')}</select>
        </div>
        <div class="input-group">
          <label class="input-label">Commit message</label>
          <textarea class="textarea" id="applyMessage" style="min-height: 72px;">${escFast(req.commit_message || req.title)}</textarea>
        </div>
        <div class="input-group">
          <label class="input-label">How to push</label>
          <label class="checkbox-label"><input type="radio" name="applyMode" value="direct" checked onchange="document.getElementById('prBranchGroup').style.display='none'"> Commit directly to the branch</label>
          <label class="checkbox-label"><input type="radio" name="applyMode" value="pr" onchange="document.getElementById('prBranchGroup').style.display=''"> Open a pull request from a new branch</label>
        </div>
        <div class="input-group" id="prBranchGroup" style="display: none;">
          <label class="input-label">New branch name</label>
          <input class="input" id="applyPrBranch" value="${escAttr(suggested)}">
        </div>
        <div class="upload-status" id="applyStatus" style="display: none; font-size: 13px;"></div>
      `, `
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="applyBtn" onclick="applyRequest()">Push</button>
      `);
    }

    async function applyRequest() {
      const { req, files, excluded } = state.viewData;
      const branch = document.getElementById('applyBranch').value;
      const message = document.getElementById('applyMessage').value.trim() || req.title;
      const mode = document.querySelector('input[name="applyMode"]:checked').value;
      const prBranch = (document.getElementById('applyPrBranch')?.value || '').trim();
      if (mode === 'pr' && !/^[\w./-]+$/.test(prBranch)) { showToast('Enter a valid branch name', 'error'); return; }
      const btn = document.getElementById('applyBtn');
      const status = document.getElementById('applyStatus');
      btn.disabled = true; btn.textContent = 'Pushing…';
      status.style.display = '';
      const [owner, repo] = req.target.repo.split('/');
      try {
        const changes = [];
        files.forEach((f, i) => {
          if (excluded.has(i)) return;
          const ch = f.change;
          if (ch.action === 'delete') { if (f.current.exists) changes.push({ path: ch.path, action: 'delete' }); return; }
          const out = { path: ch.path, action: ch.action };
          if (ch.content != null) out.content = ch.content;
          else if (ch.content_base64 != null) out.contentBase64 = ch.content_base64;
          else if (ch.action === 'rename') out.fromSha = f.current.sha;
          if (ch.action === 'rename') out.from = ch.from;
          changes.push(out);
        });
        if (!changes.length) throw new Error('Nothing to push — all selected changes are no-ops.');
        const res = await pushChanges({
          owner, repo, branch, message, changes, mode,
          branchName: prBranch, prTitle: req.title,
          prBody: `${req.summary || ''}\n\n---\nPushed from GitHub Manager change request \`${req.id}\`.`,
          label: CR_LABEL,
          onProgress: t => { status.textContent = t; }
        });
        if (req._staged) {
          const ids = new Set(req.changes.filter((c, i) => !excluded.has(i)).map(c => c._stagedId));
          state.staged = state.staged.filter(s => !ids.has(s.id));
          saveStaged();
        } else {
          req.status = res.pr ? 'pr_opened' : 'applied';
          req.applied_at = nowIso();
          req.applied_by = state.user.login;
          req.applied_commit = res.commitSha;
          req.applied_branch = res.pr ? prBranch : branch;
          if (res.pr) req.pr_url = res.pr.html_url;
          await saveRequestFile(req, `${res.pr ? 'Open PR for' : 'Apply'} request ${req.id}`).catch(e => showToast('Pushed, but updating the request status failed: ' + e.message, 'warning'));
        }
        closeModal();
        showToast(res.pr ? `Pull request #${res.pr.number} opened` : `Pushed ${plural(changes.length, 'file')} to ${branch}`, 'success');
        updateRequestCount();
        state.viewData = null;
        if (req._staged) navigate('requests'); else render();
      } catch (e) {
        status.textContent = 'Failed: ' + e.message;
        btn.disabled = false; btn.textContent = 'Retry';
        showToast('Push failed: ' + e.message, 'error');
      }
    }

    function showRequestChangesModal() {
      showModal('Request changes', `
        <div class="muted small" style="margin-bottom: 10px;">Describe what should be different. Perplexity Computer reads this note from the request file and revises its proposal.</div>
        <textarea class="textarea" id="feedbackBody" style="min-height: 140px;" placeholder="e.g. Keep the old header, and use tabs instead of spaces"></textarea>
      `, `
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitRequestFeedback()">Send note</button>
      `);
    }

    async function submitRequestFeedback() {
      const msg = document.getElementById('feedbackBody').value.trim();
      if (!msg) { showToast('Write a note first', 'error'); return; }
      const { req } = state.viewData;
      req.feedback = [...(req.feedback || []), { by: state.user.login, at: nowIso(), message: msg }];
      req.status = 'changes_requested';
      try {
        await saveRequestFile(req, `Request changes on ${req.id}`);
        closeModal();
        showToast('Note saved to the request', 'success');
        updateRequestCount();
        render();
      } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    async function setRequestStatus(status, message) {
      const { req } = state.viewData;
      const prev = req.status;
      req.status = status;
      try {
        await saveRequestFile(req, message);
        updateRequestCount();
        render();
      } catch (e) { req.status = prev; showToast('Failed: ' + e.message, 'error'); }
    }

    async function rejectRequest() {
      if (!confirm('Reject this request? It moves to History and nothing is pushed.')) return;
      await setRequestStatus('rejected', `Reject request ${state.viewData.req.id}`);
      showToast('Request rejected', 'success');
    }

    async function reopenRequest() { await setRequestStatus('pending', `Reopen request ${state.viewData.req.id}`); }

    async function deleteRequest() {
      const { req } = state.viewData;
      if (!confirm('Delete this request file from your inbox repo?')) return;
      try {
        const { owner, repo } = inboxParts();
        await state.api.deleteRawFile(owner, repo, req._path, { message: `Delete request ${req.id}`, sha: req._sha });
        state.requests.items = state.requests.items.filter(x => x !== req);
        updateRequestCount();
        showToast('Request deleted', 'success');
        navigate('requests');
      } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    function discardStaged(key) {
      if (!confirm('Discard all staged changes in this group?')) return;
      const g = stagedGroups().find(x => x.key === key);
      const ids = new Set((g?.items || []).map(s => s.id));
      state.staged = state.staged.filter(s => !ids.has(s.id));
      saveStaged();
      updateRequestCount();
      navigate('requests');
    }

    function protocolExample() {
      const login = state.user?.login || 'you';
      return JSON.stringify({
        id: '2026-09-22-fix-readme-typos',
        title: 'Fix typos in README',
        summary: 'Corrects three spelling mistakes and adds a **Usage** section.',
        author: 'Perplexity Computer',
        status: 'pending',
        created_at: '2026-09-22T21:00:00Z',
        target: { repo: `${login}/my-project`, branch: 'main' },
        commit_message: 'Fix README typos and add usage section',
        changes: [
          { path: 'README.md', action: 'update', base_sha: '<blob sha the change was based on>', content: '# My Project\n...' },
          { path: 'docs/old.md', action: 'delete' },
          { path: 'src/new-name.js', action: 'rename', from: 'src/old-name.js' }
        ]
      }, null, 2);
    }

    function protocolMarkdown() {
      return `# Change request protocol

This repo is the inbox for **GitHub Manager**. Perplexity Computer proposes changes by committing
one JSON file per request to \`requests/<id>.json\`. Nothing is pushed to the target repo until the owner
reviews the diff in GitHub Manager and taps **Push**.

## Request schema

\`\`\`json
${protocolExample()}
\`\`\`

| Field | Notes |
| --- | --- |
| \`target.repo\` | \`owner/name\` of the repo to change |
| \`target.branch\` | Branch to commit to (defaults to the repo's default branch) |
| \`changes[].action\` | \`create\`, \`update\`, \`delete\`, or \`rename\` (\`rename\` needs \`from\`; \`content\` optional) |
| \`changes[].content\` | Full new file contents (UTF-8). Use \`content_base64\` for binary files |
| \`changes[].base_sha\` | Optional blob SHA the edit was based on, used for conflict warnings |
| \`status\` | \`pending\` → \`applied\` / \`pr_opened\` / \`rejected\` / \`changes_requested\` (set by the app) |
| \`feedback[]\` | Review notes the owner leaves when requesting changes. Revise the request and set \`status\` back to \`pending\` |

Alternative: open a pull request in any of your repos with the label \`${CR_LABEL}\`; it also appears in the inbox.
`;
    }

    function showProtocolModal() {
      const instr = `When you want to change one of my GitHub repos, don't push directly. Instead, commit a change request JSON file to ${inboxRepoFull()} at requests/<id>.json following PROTOCOL.md in that repo (fields: id, title, summary, author, status "pending", created_at, target {repo, branch}, commit_message, changes [{path, action create|update|delete|rename, content, from, base_sha}]). I'll review the diff and push it from GitHub Manager.`;
      showModal('How change requests work', `
        <div class="protocol">
          <ol style="padding-left: 20px; line-height: 1.7; font-size: 14px;">
            <li>Perplexity Computer writes a JSON request into <code class="inline">${escFast(inboxRepoFull())}/requests/</code>.</li>
            <li>It shows up in <strong>Requests</strong> with a line-by-line diff against the live file.</li>
            <li>You push it as a single commit, open it as a pull request, edit it, send a note back, or reject it.</li>
          </ol>
          <div class="input-label" style="margin-top: 14px;">Tell Perplexity Computer</div>
          <pre>${escFast(instr)}</pre>
          <button class="btn btn-sm btn-secondary" style="margin-top: 8px;" onclick="copyText(${jsArg(instr)})">Copy instructions</button>

      `, `<button class="btn btn-secondary" onclick="closeModal()">Close</button>`);
      document.querySelector('.modal')?.classList.add('modal-lg');
    }

    async function setupInbox() {
      const { owner, repo } = inboxParts();
      if (owner !== state.user.login) { showToast('Inbox repo must be under your account to auto-create it', 'error'); return; }
      try {
        showToast('Creating inbox repo…');
        await state.api.createRepo({ name: repo, private: true, auto_init: true, description: 'Change requests for GitHub Manager — proposals from Perplexity Computer awaiting review' });
        await new Promise(r => setTimeout(r, 1500));
        const info = await state.api.getRepo(owner, repo);
        await pushChanges({
          owner, repo, branch: info.default_branch, message: 'Set up change request inbox',
          changes: [
            { path: 'PROTOCOL.md', action: 'create', content: protocolMarkdown() },
            { path: 'requests/.gitkeep', action: 'create', content: '' },
            { path: 'README.md', action: 'update', content: `# ${repo}\n\nInbox for GitHub Manager change requests. See [PROTOCOL.md](PROTOCOL.md).\n` }
          ]
        });
        showToast('Inbox ready', 'success');
        refreshRequests();
      } catch (e) { showToast('Setup failed: ' + e.message, 'error'); }
    }

      const errs = validateRequest(obj);

      obj.id = obj.id || `${new Date().toISOString().slice(0, 10)}-${slugify(obj.title)}`;
      obj.status = 'pending';
      obj.created_at = obj.created_at || nowIso();
      obj.author = obj.author || 'Pasted request';
      const { owner, repo } = inboxParts();
      try {
        await state.api.putRawFile(owner, repo, `requests/${obj.id}.json`, {
          message: `Add request ${obj.id}`,
          content: utf8ToBase64(JSON.stringify(obj, null, 2) + '\n')
        });
        closeModal();
        showToast('Request added', 'success');
        state.requests = null;
        openRequest(obj.id);

    const VIEW_TITLES = {
      home: 'Home', repos: 'Repositories', gists: 'Gists', gist: 'Gist', search: 'Search', profile: 'Profile',
      notifications: 'Notifications', starred: 'Starred', orgs: 'Organizations', requests: 'Requests',
      request: 'Change request', commit: 'Commit', issue: 'Issue', pull: 'Pull request', file: 'File'
    };

    function renderHeader() {
      const t = state.currentView === 'repo' && state.currentRepo ? `${state.currentRepo.owner}/${state.currentRepo.name}` : (VIEW_TITLES[state.currentView] || 'GitHub');
      return `
        <header class="header">
          <button class="header-btn" onclick="toggleSidebar()" aria-label="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
          </button>
          <span class="header-title">${escFast(t)}</span>
          <button class="header-btn" onclick="navigate('requests')" aria-label="Change requests" title="Change requests">
            <svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor">${ICONS.inbox.replace(/<\/?svg[^>]*>/g, '')}</svg>
            ${state.requestCount ? '<span class="dot"></span>' : ''}
          </button>
          <button class="header-btn" onclick="navigate('search')" aria-label="Search">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
        </header>`;
    }

    function navItem(view, label, svg, extra = '') {
      return `<div class="nav-item ${state.currentView === view ? 'active' : ''}" onclick="navigate('${view}')">${svg}${label}${extra}</div>`;
    }

    function renderSidebar() {
      const rl = state.rateLimit;
      return `
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <img class="sidebar-avatar" src="${escAttr(state.user?.avatar_url || '')}" alt="">
            <div class="sidebar-user">
              <div class="sidebar-username">${escFast(state.user?.login || '')}</div>
              <div class="sidebar-name">${escFast(state.user?.name || '')}</div>
            </div>
          </div>
          <nav class="nav-section">
            ${navItem('home', 'Home', '<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>')}
            ${navItem('requests', 'Requests', ICONS.inbox, badge(state.requestCount))}
            ${navItem('repos', 'Repositories', '<svg viewBox="0 0 16 16"><path d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8z"/></svg>')}
            ${navItem('notifications', 'Notifications', '<svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>')}
            ${navItem('starred', 'Starred', '<svg viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>')}
            ${navItem('gists', 'Gists', '<svg viewBox="0 0 16 16"><path d="M8.75 1.75a.75.75 0 00-1.5 0V5H4a.75.75 0 000 1.5h3.25v3.25a.75.75 0 001.5 0V6.5H12A.75.75 0 0012 5H8.75V1.75z"/></svg>')}
            ${navItem('orgs', 'Organizations', '<svg viewBox="0 0 16 16"><path d="M1.75 0h8.5C11.216 0 12 .784 12 1.75v12.5c0 .085-.006.168-.018.25h2.268a.25.25 0 00.25-.25V8.285a.25.25 0 00-.111-.208l-1.055-.703a.75.75 0 11.832-1.248l1.055.703c.487.325.779.871.779 1.456v5.965A1.75 1.75 0 0114.25 16h-3.5a.75.75 0 01-.197-.026c-.099.017-.2.026-.303.026h-3a.75.75 0 01-.75-.75V14h-1v1.25a.75.75 0 01-.75.75h-3A1.75 1.75 0 010 14.25V1.75C0 .784.784 0 1.75 0zM3 3.75v.5c0 .414.336.75.75.75h.5a.75.75 0 000-1.5h-.5a.75.75 0 00-.75.25zm4 0v.5c0 .414.336.75.75.75h.5a.75.75 0 000-1.5h-.5A.75.75 0 007 3.75zM3.75 6a.75.75 0 000 1.5h.5a.75.75 0 000-1.5h-.5zM7 6.75c0 .414.336.75.75.75h.5a.75.75 0 000-1.5h-.5a.75.75 0 00-.75.75z"/></svg>')}
          </nav>
          <nav class="nav-section">
            ${navItem('profile', 'Profile', '<svg viewBox="0 0 16 16"><path d="M10.561 8.073a6.005 6.005 0 013.432 5.142.75.75 0 11-1.498.07 4.5 4.5 0 00-8.99 0 .75.75 0 01-1.498-.07 6.004 6.004 0 013.431-5.142 3.999 3.999 0 115.123 0zM10.5 5a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/></svg>')}
            <div class="nav-item" onclick="signOut()">
              <svg viewBox="0 0 16 16"><path d="M2 2.75C2 1.784 2.784 1 3.75 1h2.5a.75.75 0 010 1.5h-2.5a.25.25 0 00-.25.25v10.5c0 .138.112.25.25.25h2.5a.75.75 0 010 1.5h-2.5A1.75 1.75 0 012 13.25V2.75zm10.44 4.5H6.75a.75.75 0 000 1.5h5.69l-1.97 1.97a.75.75 0 101.06 1.06l3.25-3.25a.75.75 0 000-1.06l-3.25-3.25a.75.75 0 10-1.06 1.06l1.97 1.97z"/></svg>
              Sign Out
            </div>
          </nav>
          ${rl ? `<div style="padding: 12px 16px; font-size: 12px; color: var(--text-secondary);">API ${rl.remaining.toLocaleString()} / ${rl.limit.toLocaleString()} left · resets ${new Date(rl.reset * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</div>` : ''}
        </aside>`;
    }

    function renderBottomNav() {
      const item = (view, label, svg, extra = '') => `
        <div class="bottom-nav-item ${state.currentView === view ? 'active' : ''}" onclick="navigate('${view}')">${svg}${label}${extra}</div>`;
      return `
        <nav class="bottom-nav">
          ${item('home', 'Home', '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>')}
          ${item('repos', 'Repos', '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8z"/></svg>')}
          ${item('requests', 'Requests', ICONS.inbox.replace('<svg ', '<svg fill="currentColor" '), badge(state.requestCount))}
          ${item('notifications', 'Activity', '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>')}
          ${item('profile', 'Profile', '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M10.561 8.073a6.005 6.005 0 013.432 5.142.75.75 0 11-1.498.07 4.5 4.5 0 00-8.99 0 .75.75 0 01-1.498-.07 6.004 6.004 0 013.431-5.142 3.999 3.999 0 115.123 0zM10.5 5a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/></svg>')}
        </nav>`;
    }

    function renderView() {
      switch (state.currentView) {
        case 'home': return renderHome();
        case 'repos': return renderRepos();
        case 'repo': return renderRepo();
        case 'file': return renderFile();
        case 'issue': return renderIssue();
        case 'pull': return renderPull();
        case 'commit': return renderCommit();
        case 'gists': return renderGists();
        case 'gist': return renderGist();
        case 'search': return renderSearch();
        case 'profile': return renderProfile();
        case 'notifications': return renderNotifications();
        case 'starred': return renderStarred();
        case 'orgs': return renderOrgs();
        case 'requests': return renderRequests();
        case 'request': return renderRequest();
        default: return renderHome();
      }
    }

    function openRepo(owner, name) {
      state.currentRepo = { owner, name };
      state.currentPath = [];
      state.currentBranch = null;
      state.currentView = 'repo';
      state.viewData = null;
      state.repoTab = 'code';
      closeSidebar();
      render();
      window.scrollTo(0, 0);
    }

    async function refreshRateLimit() {
      try {
        const r = await state.api.request('/rate_limit');
        state.rateLimit = r.resources.core;
      } catch (e) {}
    }

    // =====================================================================
    //  HOME DASHBOARD
    // =====================================================================
    async function loadHomeData() {
      try {
        const [repos, prs, issues] = await Promise.all([
          state.api.getRepos(),
          state.api.searchIssues(`is:pr is:open user:${state.user.login} archived:false`, 1).catch(() => ({ total_count: 0 })),
          state.api.searchIssues(`is:issue is:open user:${state.user.login} archived:false`, 1).catch(() => ({ total_count: 0 })),
          loadRequests(true).catch(() => null)
        ]);
        state.viewData = { repos, openPrs: prs.total_count, openIssues: issues.total_count };
        render();
      } catch (e) {
        showToast('Failed to load data: ' + e.message, 'error');
      }
    }

    function repoRowHTML(repo, opts = {}) {
      const sel = state.selectMode && opts.selectable;
      const checked = state.selectedRepos.has(repo.full_name);
      return `
        <div class="repo-item ${sel ? 'selectable' : ''} ${sel && checked ? 'selected' : ''}" onclick="${sel ? `toggleRepoSelect(${jsArg(repo.full_name)})` : `openRepo(${jsArg(repo.owner.login)}, ${jsArg(repo.name)})`}">
          ${sel ? `<input type="checkbox" class="repo-check" ${checked ? 'checked' : ''} onclick="event.stopPropagation(); toggleRepoSelect(${jsArg(repo.full_name)})" aria-label="Select ${escAttr(repo.name)}">` : ''}
          <div class="repo-item-main">
            <div class="repo-name">
              <span>${escFast(opts.full ? repo.full_name : repo.name)}</span>
              <span class="repo-visibility">${repo.private ? 'Private' : 'Public'}</span>
              ${repo.archived ? '<span class="repo-visibility" style="color: var(--accent-orange); border-color: var(--accent-orange);">Archived</span>' : ''}
              ${repo.fork ? '<span class="repo-visibility">Fork</span>' : ''}
            </div>
            ${repo.description ? `<div class="repo-description">${escFast(repo.description)}</div>` : ''}
            ${repo.topics?.length ? `<div class="topic-list">${repo.topics.slice(0, 6).map(t => `<span class="topic">${escFast(t)}</span>`).join('')}</div>` : ''}
            <div class="repo-meta">
              ${repo.language ? `<span class="repo-meta-item"><span class="language-dot" style="background: ${languageColors[repo.language] || '#ccc'}"></span>${escFast(repo.language)}</span>` : ''}
              <span class="repo-meta-item">⭐ ${repo.stargazers_count}</span>
              <span class="repo-meta-item">🍴 ${repo.forks_count}</span>
              ${repo.open_issues_count ? `<span class="repo-meta-item">${repo.open_issues_count} open</span>` : ''}
              <span class="repo-meta-item">Updated ${timeAgo(repo.pushed_at || repo.updated_at)}</span>
            </div>
          </div>
        </div>`;
    }

    function renderHome() {
      if (!state.viewData) { loadHomeData(); return renderLoading(); }
      const { repos, openPrs, openIssues } = state.viewData;
      const rq = state.requests;
      const staged = stagedGroups().map(g => stagedToRequest(g.key));
      const pending = rq ? rq.items.filter(x => requestStatus(x) === 'pending' && !x._errors.length) : [];
      const pendingAll = [...staged, ...pending];
      return `
        <div class="stat-grid">
          <div class="stat-card clickable ${state.requestCount ? 'highlight' : ''}" onclick="navigate('requests')">
            <div class="stat-label">Pending requests</div>
            <div class="stat-value">${state.requestCount}</div>
            <div class="stat-sub">${state.requestCount ? 'Ready to review' : 'All caught up'}</div>
          </div>
          <div class="stat-card clickable" onclick="navigate('repos')">
            <div class="stat-label">Repositories</div>
            <div class="stat-value">${state.user.public_repos + (state.user.total_private_repos || 0)}</div>
            <div class="stat-sub">${state.user.total_private_repos || 0} private</div>
          </div>
          <div class="stat-card clickable" onclick="searchMy('pr')">
            <div class="stat-label">Open pull requests</div>
            <div class="stat-value">${openPrs}</div>
            <div class="stat-sub">Across your repos</div>
          </div>
          <div class="stat-card clickable" onclick="searchMy('issue')">
            <div class="stat-label">Open issues</div>
            <div class="stat-value">${openIssues}</div>
            <div class="stat-sub">Across your repos</div>
          </div>
        </div>

        ${pendingAll.length || rq?.prs?.length ? `
          <div class="card">
            <div class="card-header">
              <span class="card-title">Waiting for you</span>
              <button class="btn btn-sm btn-secondary" onclick="navigate('requests')">Open inbox</button>
            </div>
            ${pendingAll.slice(0, 4).map(renderRequestRow).join('')}
            ${(rq?.prs || []).slice(0, Math.max(0, 4 - pendingAll.length)).map(renderPrRequestRow).join('')}
          </div>` : rq?.inboxMissing ? `
          <div class="card inbox-hero" style="border-color: var(--accent-blue);">
            <div class="card-body">
              <strong>Let Perplexity Computer propose changes</strong>
              <div class="muted" style="font-size: 14px; line-height: 1.5;">Set up a private inbox repo and every change Perplexity Computer suggests shows up here with a diff, ready for you to push.</div>
              <div class="row"><button class="btn btn-primary btn-sm" onclick="navigate('requests')">Set up inbox</button></div>
            </div>
          </div>` : ''}

        <div class="card">
          <div class="card-header">
            <span class="card-title">Recently updated</span>
            <button class="btn btn-sm btn-secondary" onclick="showCreateRepoModal()">+ New</button>
          </div>
          ${repos?.slice(0, 6).map(r => repoRowHTML(r, { full: true })).join('') || '<div class="empty-state">No repositories yet</div>'}
        </div>
        <button class="btn btn-secondary btn-block" onclick="navigate('repos')">View all repositories</button>`;
    }

    function searchMy(kind) {
      window.open(`https://github.com/pulls?q=${encodeURIComponent(`is:${kind} is:open user:${state.user.login} archived:false`)}`, '_blank', 'noopener');
    }

    // =====================================================================
    //  REPOSITORIES — search, sort, filter, bulk actions
    // =====================================================================
    async function loadRepos() {
      try {
        const repos = await state.api.getAllRepos();
        state.allRepos = repos;
        state.viewData = { repos };
        render();
      } catch (e) {
        state.viewData = { repos: [], error: e.message };
        render();
      }
    }

    function filteredRepoList() {
      const q = state.repoQuery.trim().toLowerCase();
      const login = state.user.login;
      let list = state.viewData.repos.filter(r => {
        if (q && !(`${r.full_name} ${r.description || ''} ${(r.topics || []).join(' ')}`.toLowerCase().includes(q))) return false;
        switch (state.repoType) {
          case 'public': if (r.private) return false; break;
          case 'private': if (!r.private) return false; break;
          case 'sources': if (r.fork) return false; break;
          case 'forks': if (!r.fork) return false; break;
          case 'archived': if (!r.archived) return false; break;
          case 'owned': if (r.owner.login !== login) return false; break;
          case 'shared': if (r.owner.login === login) return false; break;
        }
        if (state.repoLanguage && r.language !== state.repoLanguage) return false;
        return true;
      });
      const by = {
        updated: (a, b) => new Date(b.pushed_at || b.updated_at) - new Date(a.pushed_at || a.updated_at),
        name: (a, b) => a.name.localeCompare(b.name),
        stars: (a, b) => b.stargazers_count - a.stargazers_count,
        size: (a, b) => b.size - a.size,
        created: (a, b) => new Date(b.created_at) - new Date(a.created_at)
      }[state.repoSort];
      return list.sort(by);
    }

    function renderRepos() {
      if (!state.viewData) { loadRepos(); return renderLoading(); }
      if (state.viewData.error) return `<div class="card"><div class="empty-state">Failed to load repositories: ${escFast(state.viewData.error)}</div></div>`;
      const langs = [...new Set(state.viewData.repos.map(r => r.language).filter(Boolean))].sort();
      const list = filteredRepoList();
      const sel = state.selectedRepos;
      return `
        <input type="search" class="search-input" id="repoSearchInput" placeholder="Find a repository…" value="${escAttr(state.repoQuery)}" oninput="onRepoQuery(this.value)">
        <div class="toolbar">
          <select class="select" onchange="state.repoType=this.value; render()" aria-label="Type">
            ${[['all', 'All types'], ['owned', 'Owned by me'], ['shared', 'Shared with me'], ['public', 'Public'], ['private', 'Private'], ['sources', 'Sources'], ['forks', 'Forks'], ['archived', 'Archived']].map(([v, l]) => `<option value="${v}" ${state.repoType === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
          <select class="select" onchange="state.repoLanguage=this.value; render()" aria-label="Language">
            <option value="">All languages</option>
            ${langs.map(l => `<option ${state.repoLanguage === l ? 'selected' : ''}>${escFast(l)}</option>`).join('')}
          </select>
          <select class="select" onchange="state.repoSort=this.value; render()" aria-label="Sort">
            ${[['updated', 'Last pushed'], ['name', 'Name'], ['stars', 'Stars'], ['size', 'Size'], ['created', 'Newest']].map(([v, l]) => `<option value="${v}" ${state.repoSort === v ? 'selected' : ''}>Sort: ${l}</option>`).join('')}
          </select>
          <span style="flex: 1;"></span>
          <button class="btn btn-sm btn-secondary" onclick="toggleSelectMode()">${state.selectMode ? 'Done' : 'Select'}</button>
          <button class="btn btn-sm btn-primary" onclick="showCreateRepoModal()">+ New</button>
        </div>
        <div class="muted small" style="margin-bottom: 8px;">${plural(list.length, 'repository').replace('repositorys', 'repositories')}${state.selectMode ? ` · ${sel.size} selected · <span class="link" onclick="selectAllRepos()">select all shown</span>` : ''}</div>
        <div class="card" id="repoList">
          ${list.map(r => repoRowHTML(r, { selectable: true, full: r.owner.login !== state.user.login })).join('') || '<div class="empty-state">No repositories match these filters</div>'}
        </div>
        ${state.selectMode && sel.size ? `
          <div class="bulk-bar">
            <strong style="font-size: 14px;">${sel.size} selected</strong>
            <span style="flex: 1;"></span>
            <button class="btn btn-sm btn-secondary" onclick="bulkRepoAction('private')">Make private</button>
            <button class="btn btn-sm btn-secondary" onclick="bulkRepoAction('public')">Make public</button>
            <button class="btn btn-sm btn-secondary" onclick="bulkRepoAction('archive')">Archive</button>
            <button class="btn btn-sm btn-secondary" onclick="bulkRepoAction('unarchive')">Unarchive</button>
            <button class="btn btn-sm btn-danger" onclick="bulkRepoAction('delete')">Delete</button>
          </div>` : ''}`;
    }

    let repoQueryTimer = null;
    function onRepoQuery(v) {
      state.repoQuery = v;
      clearTimeout(repoQueryTimer);
      repoQueryTimer = setTimeout(() => {
        render();
        const el = document.getElementById('repoSearchInput');
        if (el) { el.focus(); el.setSelectionRange(v.length, v.length); }
      }, 180);
    }
    function toggleSelectMode() { state.selectMode = !state.selectMode; state.selectedRepos.clear(); render(); }
    function toggleRepoSelect(full) {
      const s = state.selectedRepos;
      s.has(full) ? s.delete(full) : s.add(full);
      const y = window.scrollY; render(); window.scrollTo(0, y);
    }
    function selectAllRepos() { filteredRepoList().forEach(r => state.selectedRepos.add(r.full_name)); render(); }

    async function bulkRepoAction(kind) {
      const names = [...state.selectedRepos];
      const label = { private: 'make private', public: 'make public', archive: 'archive', unarchive: 'unarchive', delete: 'permanently DELETE' }[kind];
      if (kind === 'delete') {
        const typed = prompt(`This permanently deletes ${plural(names.length, 'repository').replace('repositorys', 'repositories')}:\n${names.join('\n')}\n\nType DELETE to confirm.`);
        if (typed !== 'DELETE') return;
      } else if (!confirm(`${label[0].toUpperCase() + label.slice(1)} ${names.length} selected?\n${names.join('\n')}`)) return;
      let ok = 0, fail = [];
      for (const full of names) {
        const [o, n] = full.split('/');
        try {
          if (kind === 'delete') await state.api.deleteRepo(o, n);
          else await state.api.updateRepo(o, n, kind === 'private' ? { private: true } : kind === 'public' ? { private: false } : { archived: kind === 'archive' });
          ok++;
        } catch (e) { fail.push(`${full}: ${e.message}`); }
      }
      showToast(`${ok} updated${fail.length ? `, ${fail.length} failed` : ''}`, fail.length ? 'warning' : 'success');
      if (fail.length) console.warn(fail);
      state.selectedRepos.clear();
      state.viewData = null;
      render();
    }

    // =====================================================================
    //  REPOSITORY VIEW — branches, staging, Actions, releases, settings
    // =====================================================================
    async function loadRepo() {
      try {
        const { owner, name } = state.currentRepo;
        const pathStr = state.currentPath.join('/');
        const [repo, contents, isStarred, branches] = await Promise.all([
          state.api.getRepo(owner, name),
          state.api.getContents(owner, name, pathStr).catch(e => { if (e.status === 404) return []; throw e; }),
          state.api.isStarred(owner, name),
          state.api.listBranches(owner, name).catch(() => [])
        ]);
        if (!state.currentBranch) state.currentBranch = repo.default_branch;
        let readme = null;
        if (!pathStr) readme = await state.api.getReadme(owner, name);
        const prev = state.viewData || {};
        state.viewData = { repo, contents: Array.isArray(contents) ? contents : [], readme, isStarred, branches,
          issues: prev.issues, pulls: prev.pulls, commits: null };
        render();
      } catch (e) {
        state.viewData = { fatal: e.message };
        render();
      }
    }

    const REPO_TABS = [
      ['code', 'Code'], ['issues', 'Issues'], ['pulls', 'Pull requests'], ['commits', 'Commits'],
      ['branches', 'Branches'], ['actions', 'Actions'], ['releases', 'Releases'], ['settings', 'Settings']
    ];

    function renderRepo() {
      if (!state.viewData) { loadRepo(); return renderLoading(); }
      if (state.viewData.fatal) return `<div class="card"><div class="empty-state">Failed to load repository: ${escFast(state.viewData.fatal)}</div></div>`;
      const { repo, contents, readme, isStarred, branches } = state.viewData;
      const tab = state.repoTab || 'code';
      const canAdmin = !!repo.permissions?.admin;
      const tabs = REPO_TABS.filter(([k]) => k !== 'settings' || canAdmin);
      const branchNames = (branches || []).map(b => b.name);
      if (state.currentBranch && !branchNames.includes(state.currentBranch)) branchNames.unshift(state.currentBranch);
      const stagedHere = state.staged.filter(s => s.owner === repo.owner.login && s.repo === repo.name && s.branch === state.currentBranch);
      const stagedKey = `${repo.owner.login}/${repo.name}@${state.currentBranch}`;
      return `
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-body">
            <div class="repo-name" style="font-size: 20px; margin-bottom: 8px; flex-wrap: wrap;">
              <span>${escFast(repo.full_name)}</span>
              <span class="repo-visibility">${repo.private ? 'Private' : 'Public'}</span>
              ${repo.archived ? '<span class="repo-visibility" style="color: var(--accent-orange); border-color: var(--accent-orange);">Archived</span>' : ''}
            </div>
            ${repo.fork && repo.parent ? `<div class="muted small" style="margin-bottom: 6px;">Forked from <span class="link" onclick="openRepo(${jsArg(repo.parent.owner.login)}, ${jsArg(repo.parent.name)})">${escFast(repo.parent.full_name)}</span></div>` : ''}
            ${repo.description ? `<div class="repo-description">${escFast(repo.description)}</div>` : ''}
            ${repo.homepage ? `<a class="link small" href="${escAttr(repo.homepage)}" target="_blank" rel="noopener">${escFast(repo.homepage)}</a>` : ''}
            ${repo.topics?.length ? `<div class="topic-list">${repo.topics.map(t => `<span class="topic">${escFast(t)}</span>`).join('')}</div>` : ''}
            <div class="repo-meta" style="margin-top: 12px;">
              ${repo.language ? `<span class="repo-meta-item"><span class="language-dot" style="background: ${languageColors[repo.language] || '#ccc'}"></span>${escFast(repo.language)}</span>` : ''}
              <span class="repo-meta-item">⭐ ${repo.stargazers_count}</span>
              <span class="repo-meta-item">🍴 ${repo.forks_count}</span>
              <span class="repo-meta-item">👁 ${repo.subscribers_count ?? repo.watchers_count}</span>
              <span class="repo-meta-item">📦 ${formatBytes(repo.size * 1024)}</span>
            </div>
            <div class="actions-bar" style="margin-top: 12px; flex-wrap: wrap;">
              <button class="btn btn-sm btn-secondary star-btn ${isStarred ? 'starred' : ''}" onclick="toggleStar(${jsArg(repo.owner.login)}, ${jsArg(repo.name)}, ${isStarred})">${isStarred ? '★ Starred' : '☆ Star'}</button>
              <button class="btn btn-sm btn-secondary" onclick="forkRepo(${jsArg(repo.owner.login)}, ${jsArg(repo.name)})">🍴 Fork</button>
              <button class="btn btn-sm btn-secondary" onclick="copyText(${jsArg(repo.clone_url)})">Copy clone URL</button>
              <a class="btn btn-sm btn-secondary" href="${escAttr(repo.html_url)}" target="_blank" rel="noopener">Open on GitHub</a>
            </div>
          </div>
        </div>

        <div class="tabs" style="overflow-x: auto;">
          ${tabs.map(([k, l]) => `<div class="tab ${tab === k ? 'active' : ''}" onclick="setRepoTab('${k}')">${l}${k === 'issues' && repo.open_issues_count ? ` <span class="count-badge muted-badge">${repo.open_issues_count}</span>` : ''}</div>`).join('')}
        </div>

        ${['code', 'commits'].includes(tab) ? `
          <div class="branch-bar">
            ${ICONS.branch}
            <select class="select branch-select" onchange="switchBranch(this.value)" aria-label="Branch">
              ${branchNames.map(b => `<option value="${escAttr(b)}" ${b === state.currentBranch ? 'selected' : ''}>${escFast(b)}${b === repo.default_branch ? ' (default)' : ''}</option>`).join('')}
            </select>
            <button class="btn btn-sm btn-secondary" onclick="showCreateBranchModal()">New branch</button>
            ${state.currentBranch !== repo.default_branch ? `<button class="btn btn-sm btn-secondary" onclick="showCompareModal()">Open PR</button>` : ''}
          </div>` : ''}

        ${tab === 'code' && stagedHere.length ? `
          <div class="staged-banner">
            <span><strong>${plural(stagedHere.length, 'staged change')}</strong> on ${escFast(state.currentBranch)} — not pushed yet</span>
            <span class="row">
              <button class="btn btn-sm btn-primary" onclick="openStagedRequest(${jsArg(stagedKey)})">Review &amp; push</button>
            </span>
          </div>` : ''}

        ${tab === 'code' ? renderRepoCode(contents, readme) : ''}
        ${tab === 'issues' ? renderRepoIssues() : ''}
        ${tab === 'pulls' ? renderRepoPulls() : ''}
        ${tab === 'commits' ? renderRepoCommits() : ''}
        ${tab === 'branches' ? renderRepoBranches() : ''}
        ${tab === 'actions' ? renderRepoActions() : ''}
        ${tab === 'releases' ? renderRepoReleases() : ''}
        ${tab === 'settings' ? renderRepoSettings() : ''}`;
    }

    function switchBranch(b) {
      state.currentBranch = b;
      state.currentPath = [];
      state.viewData = null;
      render();
    }

    async function loadRepoCommits() {
      try {
        const { owner, name } = state.currentRepo;
        state.viewData.commits = await state.api.getCommits(owner, name, state.currentBranch ? { sha: state.currentBranch } : {});
      } catch (e) {
        state.viewData.commits = [];
        showToast(e.status === 409 ? 'This repository has no commits yet' : 'Failed to load commits: ' + e.message, e.status === 409 ? 'info' : 'error');
      }
      render();
    }

    async function loadRepoPulls() {
      try {
        const { owner, name } = state.currentRepo;
        state.viewData.pulls = await state.api.getPulls(owner, name, { state: state.pullFilter || 'open' });
      } catch (e) { state.viewData.pulls = []; showToast('Failed to load pull requests: ' + e.message, 'error'); }
      render();
    }

    async function loadRepoIssues() {
      try {
        const { owner, name } = state.currentRepo;
        state.viewData.issues = await state.api.getIssues(owner, name, { state: state.issueFilter || 'open' });
      } catch (e) { state.viewData.issues = []; showToast('Failed to load issues: ' + e.message, 'error'); }
      render();
    }
