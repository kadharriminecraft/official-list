    function renderRepos() {
      if (!state.viewData) {
        loadRepos();
        return renderLoading();
      }

      const languages = [...new Set(state.allRepos.filter(r => r.language).map(r => r.language))].sort();
      const allLanguages = ['HTML', ...languages.filter(l => l !== 'HTML')];

      let filteredRepos = state.viewData;

      // Apply filters
      if (state.filters.language) {
        filteredRepos = filteredRepos.filter(r => r.language === state.filters.language);
      }

      if (state.filters.visibility) {
        filteredRepos = filteredRepos.filter(r => {
          if (state.filters.visibility === 'private') return r.private;
          if (state.filters.visibility === 'public') return !r.private;
          return true;
        });
      }

      if (state.filters.size) {
        filteredRepos = filteredRepos.filter(r => {
          const size = r.size || 0;
          if (state.filters.size === 'small') return size < 1024;
          if (state.filters.size === 'medium') return size >= 1024 && size < 10240;
          if (state.filters.size === 'large') return size >= 10240;
          return true;
        });
      }

      // Apply sorting
      if (state.filters.updated) {
        filteredRepos.sort((a, b) => {
          const result = new Date(b.updated_at) - new Date(a.updated_at);
          return state.filters.updated === 'asc' ? -result : result;
        });
      }

      if (state.filters.stars) {
        filteredRepos.sort((a, b) => {
          const result = b.stargazers_count - a.stargazers_count;
          return state.filters.stars === 'asc' ? -result : result;
        });
      }

      if (state.filters.forks) {
        filteredRepos.sort((a, b) => {
          const result = b.forks_count - a.forks_count;
          return state.filters.forks === 'asc' ? -result : result;
        });
      }

      return `
                <div class="actions-bar">
                    <button class="btn btn-primary" onclick="showCreateRepoModal()">+ New Repository</button>
                </div>

                <div class="search-container">
                    <div class="search-input-wrapper">
                        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <input type="text" class="search-input" id="repoSearchInput" placeholder="Filter repositories..." onkeyup="filterReposText()">
                    </div>
                </div>

                <div class="collapsible-filters">
                    <button class="filter-toggle-btn" onclick="toggleReposFilterDropdown()">
                        ⚙️ Filters
                        <span id="reposFilterChevron">▼</span>
                    </button>
                    <div class="filter-dropdown" id="reposFilterDropdown">
                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Language</label>
                            <select class="filter-dropdown-select" onchange="updateRepoFilter('language', this.value)">
                                <option value="">All Languages</option>
                                ${allLanguages.map(lang => `
                                    <option value="${lang}" ${state.filters.language === lang ? 'selected' : ''}>${lang}</option>
                                `).join('')}
                            </select>
                        </div>

                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Visibility</label>
                            <select class="filter-dropdown-select" onchange="updateRepoFilter('visibility', this.value)">
                                <option value="">All</option>
                                <option value="public" ${state.filters.visibility === 'public' ? 'selected' : ''}>Public</option>
                                <option value="private" ${state.filters.visibility === 'private' ? 'selected' : ''}>Private</option>
                            </select>
                        </div>

                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Size</label>
                            <select class="filter-dropdown-select" onchange="updateRepoFilter('size', this.value)">
                                <option value="">All Sizes</option>
                                <option value="small" ${state.filters.size === 'small' ? 'selected' : ''}>Small (&lt;1MB)</option>
                                <option value="medium" ${state.filters.size === 'medium' ? 'selected' : ''}>Medium (1-10MB)</option>
                                <option value="large" ${state.filters.size === 'large' ? 'selected' : ''}>Large (&gt;10MB)</option>
                            </select>
                        </div>

                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Recently Updated</label>
                            <select class="filter-dropdown-select" onchange="updateRepoFilter('updated', this.value)">
                                <option value="">None</option>
                                <option value="desc" ${state.filters.updated === 'desc' ? 'selected' : ''}>Descending</option>
                                <option value="asc" ${state.filters.updated === 'asc' ? 'selected' : ''}>Ascending</option>
                            </select>
                        </div>

                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Stars</label>
                            <select class="filter-dropdown-select" onchange="updateRepoFilter('stars', this.value)">
                                <option value="">None</option>
                                <option value="desc" ${state.filters.stars === 'desc' ? 'selected' : ''}>Descending</option>
                                <option value="asc" ${state.filters.stars === 'asc' ? 'selected' : ''}>Ascending</option>
                            </select>
                        </div>

                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Forks</label>
                            <select class="filter-dropdown-select" onchange="updateRepoFilter('forks', this.value)">
                                <option value="">None</option>
                                <option value="desc" ${state.filters.forks === 'desc' ? 'selected' : ''}>Descending</option>
                                <option value="asc" ${state.filters.forks === 'asc' ? 'selected' : ''}>Ascending</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="card" id="repoList">
                    ${filteredRepos.map(repo => `
                        <div class="repo-item" data-repo-name="${repo.name.toLowerCase()}" onclick="openRepo('${repo.owner.login}', '${repo.name}')">
                            <div class="repo-name">
                                <span>${repo.name}</span>
                                <span class="repo-visibility">${repo.private ? 'Private' : 'Public'}</span>
                            </div>
                            ${repo.description ? `<div class="repo-description">${escapeHtml(repo.description)}</div>` : ''}
                            <div class="repo-meta">
                                ${repo.language ? `
                                    <span class="repo-meta-item">
                                        <span class="language-dot" style="background: ${languageColors[repo.language] || '#ccc'}"></span>
                                        ${repo.language}
                                    </span>
                                ` : ''}
                                <span class="repo-meta-item">⭐ ${repo.stargazers_count}</span>
                                <span class="repo-meta-item">🍴 ${repo.forks_count}</span>
                                <span class="repo-meta-item">📦 ${formatBytes(repo.size * 1024)}</span>
                                <span class="repo-meta-item">Updated ${timeAgo(repo.updated_at)}</span>
                            </div>
                        </div>
                    `).join('') || '<div class="empty-state">No repositories found</div>'}
                </div>
            `;
    }

    function updateRepoFilter(filterName, value) {
      state.filters[filterName] = value || null;
      render();
    }

    function toggleReposFilterDropdown() {
      state.reposFilterDropdownOpen = !state.reposFilterDropdownOpen;
      const dropdown = document.getElementById('reposFilterDropdown');
      const chevron = document.getElementById('reposFilterChevron');
      if (dropdown) {
        dropdown.classList.toggle('active');
        chevron.textContent = state.reposFilterDropdownOpen ? '▲' : '▼';
      }
    }

    function renderRepo() {
      if (!state.viewData) {
        loadRepo();
        return renderLoading();
      }

      const {
        repo,
        contents,
        readme,
        isStarred
      } = state.viewData;
      const currentTab = state.repoTab || 'code';

      return `
                <div class="card" style="margin-bottom: 16px;">
                    <div class="card-body">
                        <div class="repo-name" style="font-size: 20px; margin-bottom: 8px;">
                            <span>${repo.full_name}</span>
                            <span class="repo-visibility">${repo.private ? 'Private' : 'Public'}</span>
                        </div>
                        ${repo.description ? `<div class="repo-description">${escapeHtml(repo.description)}</div>` : ''}
                        <div class="repo-meta" style="margin-top: 12px;">
                            <span class="repo-meta-item">⭐ ${repo.stargazers_count}</span>
                            <span class="repo-meta-item">🍴 ${repo.forks_count}</span>
                            <span class="repo-meta-item">👁 ${repo.watchers_count}</span>
                        </div>
                        <div class="actions-bar" style="margin-top: 12px;">
                            <button class="btn btn-sm ${isStarred ? 'btn-secondary starred' : 'btn-secondary'} star-btn" 
                                    onclick="toggleStar('${repo.owner.login}', '${repo.name}', ${isStarred})">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="${isStarred ? 'var(--accent-orange)' : 'none'}" stroke="currentColor">
                                    <path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/>
                                </svg>
                                ${isStarred ? 'Starred' : 'Star'}
                            </button>
                            <button class="btn btn-sm btn-secondary" onclick="forkRepo('${repo.owner.login}', '${repo.name}')">
                                🍴 Fork
                            </button>
                        </div>
                    </div>
                </div>

                <div class="tabs">
                    <div class="tab ${currentTab === 'code' ? 'active' : ''}" onclick="setRepoTab('code')">
                        📁 Code
                    </div>
                    <div class="tab ${currentTab === 'issues' ? 'active' : ''}" onclick="setRepoTab('issues')">
                        🔴 Issues (${repo.open_issues_count})
                    </div>
                    <div class="tab ${currentTab === 'pulls' ? 'active' : ''}" onclick="setRepoTab('pulls')">
                        🔀 Pull Requests
                    </div>
                    <div class="tab ${currentTab === 'commits' ? 'active' : ''}" onclick="setRepoTab('commits')">
                        📝 Commits
                    </div>
                </div>

                ${currentTab === 'code' ? renderRepoCode(contents, readme) : ''}
                ${currentTab === 'issues' ? renderRepoIssues() : ''}
                ${currentTab === 'pulls' ? renderRepoPulls() : ''}
                ${currentTab === 'commits' ? renderRepoCommits() : ''}
            `;
    }

    function renderRepoCode(contents, readme) {
      const {
        owner,
        name
      } = state.currentRepo;
      const pathStr = state.currentPath.join('/');

      let filesHTML = '';
      if (Array.isArray(contents)) {
        filesHTML = contents
          .sort((a, b) => {
            if (a.type === b.type) return a.name.localeCompare(b.name);
            return a.type === 'dir' ? -1 : 1;
          })
          .map(item => {
            const itemPath = pathStr ? pathStr + '/' + item.name : item.name;
            const newPath = [...state.currentPath, item.name];
            const renameData = JSON.stringify({
              type: item.type,
              name: item.name,
              path: itemPath,
              sha: item.sha || null,
              folderPath: item.type === 'dir' ? newPath : null
            });

            const iconSvg = item.type === 'dir' ?
              '<path d="M1.75 1A1.75 1.75 0 000 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0016 13.25v-8.5A1.75 1.75 0 0014.25 3H7.5a.25.25 0 01-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75z"/>' :
              '<path d="M3.75 1.5a.25.25 0 00-.25.25v11.5c0 .138.112.25.25.25h8.5a.25.25 0 00.25-.25V6H9.75A1.75 1.75 0 018 4.25V1.5H3.75zm5.75.56v2.19c0 .138.112.25.25.25h2.19L9.5 2.06zM2 1.75C2 .784 2.784 0 3.75 0h5.086c.464 0 .909.184 1.237.513l3.414 3.414c.329.328.513.773.513 1.237v8.086A1.75 1.75 0 0112.25 15h-8.5A1.75 1.75 0 012 13.25V1.75z"/>';

            const main = item.type === 'dir' ?
              `<div class="file-item-main" data-path='${JSON.stringify(newPath)}' onclick="navigateToFolder(JSON.parse(this.getAttribute('data-path')))">
                  <svg class="file-icon folder" viewBox="0 0 16 16">${iconSvg}</svg>
                  <span class="file-name">${escapeHtml(item.name)}</span>
              </div>` :
              `<div class="file-item-main" onclick="openFile('${owner}', '${name}', '${itemPath}')">
                  <svg class="file-icon" viewBox="0 0 16 16">${iconSvg}</svg>
                  <span class="file-name">${escapeHtml(item.name)}</span>
              </div>`;

            return `
                <div class="file-item" data-type="${item.type}">
                    ${main}
                    <button class="file-action" title="Rename" data-rename='${renameData}' onclick="showRenameModalFromAttr(this)">✎</button>
                </div>
              `;
          })
          .join('');
      }

      return `
                <div class="breadcrumb">
                    <span class="breadcrumb-item" onclick="navigateToFolder([])">
                        ${name}
                    </span>
                    ${state.currentPath.map((p, i) => `
                        <span class="breadcrumb-separator">/</span>
                        <span class="breadcrumb-item" onclick="navigateToFolder(${JSON.stringify(state.currentPath.slice(0, i + 1))})">
                            ${p}
                        </span>
                    `).join('')}
                </div>

                <div class="inline-toolbar">
                    <button class="btn btn-sm btn-secondary" onclick="refreshCurrentView()" title="Refresh">⟳</button>
                </div>

                <div class="card">
                    ${filesHTML || '<div class="empty-state">Directory is empty</div>'}
                </div>

                ${readme && state.currentPath.length === 0 ? `
                    <div class="card" style="margin-top: 16px;">
                        <div class="card-header">
                            <span class="card-title">README.md</span>
                        </div>
                        <div class="card-body markdown">
                            ${readme}
                        </div>
                    </div>
                ` : ''}

                <div class="fab-group" id="fabGroup">
                    <button class="fab-option" onclick="closeFabMenu(); showUploadModal()">
                        📤 Upload
                    </button>
                    <button class="fab-option" onclick="closeFabMenu(); showCreateFolderModal()">
                        📁 New Folder
                    </button>
                    <button class="fab-option" onclick="closeFabMenu(); showCreateFileModal()">
                        📄 New File
                    </button>
                    <button class="fab" onclick="toggleFabMenu(event)" title="Add file, folder, or upload">+</button>
                </div>
            `;
    }

    function renderRepoIssues() {
      if (!state.viewData.issues) {
        loadRepoIssues();
        return renderLoading();
      }

      return `
                <div class="actions-bar">
                    <button class="btn btn-primary btn-sm" onclick="showCreateIssueModal()">+ New Issue</button>
                </div>
                <div class="card">
                    ${state.viewData.issues.filter(i => !i.pull_request).map(issue => `
                        <div class="issue-item" onclick="openIssue('${state.currentRepo.owner}', '${state.currentRepo.name}', ${issue.number})">
                            <div class="issue-title">
                                <svg class="issue-icon ${issue.state}" viewBox="0 0 16 16">
                                    ${issue.state === 'open' 
                                        ? '<path d="M8 9.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM8 0a8 8 0 100 16A8 8 0 008 0zM1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0z"/>'
                                        : '<path d="M11.28 6.78a.75.75 0 00-1.06-1.06L7.25 8.69 5.78 7.22a.75.75 0 00-1.06 1.06l2 2a.75.75 0 001.06 0l3.5-3.5zM16 8A8 8 0 110 8a8 8 0 0116 0zm-1.5 0a6.5 6.5 0 10-13 0 6.5 6.5 0 0113 0z"/>'
                                    }
                                </svg>
                                <span>${escapeHtml(issue.title)}</span>
                            </div>
                            <div class="issue-meta">
                                #${issue.number} opened ${timeAgo(issue.created_at)} by ${issue.user.login}
                            </div>
                        </div>
                    `).join('') || '<div class="empty-state">No issues</div>'}
                </div>
            `;
    }

    function renderRepoPulls() {
      if (!state.viewData.pulls) {
        loadRepoPulls();
        return renderLoading();
      }

      return `
                <div class="card">
                    ${state.viewData.pulls.map(pr => `
                        <div class="issue-item" onclick="openPull('${state.currentRepo.owner}', '${state.currentRepo.name}', ${pr.number})">
                            <div class="issue-title">
                                <svg class="issue-icon ${pr.state === 'open' ? 'open' : pr.merged_at ? 'closed' : 'closed'}" viewBox="0 0 16 16">
                                    <path d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5h-1V4h1a1 1 0 011 1v5.628a2.251 2.251 0 101.5 0V5A2.5 2.5 0 0011 2.5zm1 10.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0zM3.75 12a.75.75 0 100 1.5.75.75 0 000-1.5z"/>
                                </svg>
                                <span>${escapeHtml(pr.title)}</span>
                            </div>
                            <div class="issue-meta">
                                #${pr.number} ${pr.state} ${timeAgo(pr.created_at)} by ${pr.user.login}
                            </div>
                        </div>
                    `).join('') || '<div class="empty-state">No pull requests</div>'}
                </div>
            `;
    }

    function renderRepoCommits() {
      if (!state.viewData.commits) {
        loadRepoCommits();
        return renderLoading();
      }

      return `
                <div class="card">
                    ${state.viewData.commits.map(commit => `
                        <div class="commit-item">
                            <div class="commit-message">${escapeHtml(commit.commit.message.split('\n')[0])}</div>
                            <div class="commit-meta">
                                ${commit.author ? `<img class="commit-avatar" src="${commit.author.avatar_url}" alt="">` : ''}
                                <span>${commit.commit.author.name}</span>
                                <span>•</span>
                                <span>${timeAgo(commit.commit.author.date)}</span>
                            </div>
                        </div>
                    `).join('') || '<div class="empty-state">No commits</div>'}
                </div>
            `;
    }

    function renderFile() {
      if (!state.viewData) {
        return renderLoading();
      }

      const {
        file
      } = state.viewData;
      const content = base64ToUtf8(file.content);
      const lines = content.split('\n');

      return `
                <div class="breadcrumb">
                    <span class="breadcrumb-item" onclick="openRepo('${state.currentRepo.owner}', '${state.currentRepo.name}')">
                        ${state.currentRepo.name}
                    </span>
                    <span class="breadcrumb-separator">/</span>
                    <span>${file.name}</span>
                </div>

                <div class="code-viewer">
                    <div class="code-header">
                        <span>${lines.length} lines • ${formatBytes(file.size)}</span>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-sm btn-secondary" onclick="editFile()">Edit</button>
                            <button class="btn btn-sm btn-secondary" onclick="showRenameModalFromAttr(this)" data-rename='${JSON.stringify({type: 'file', name: file.name, path: state.currentFile.path, sha: file.sha, folderPath: null})}'>Rename</button>
                            <button class="btn btn-sm btn-secondary" onclick="downloadCurrentFile()">Download</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCurrentFile()">Delete</button>
                        </div>
                    </div>
                    <div class="code-content">
                        ${lines.map((line, i) => `
                            <div class="code-line">
                                <span class="line-number">${i + 1}</span>
                                <span class="line-content">${escapeHtml(line)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
    }

    function renderIssue() {
      if (!state.viewData) {
        loadIssue();
        return renderLoading();
      }

      const {
        issue,
        comments
      } = state.viewData;

      return `
                <div class="card">
                    <div class="card-body">
                        <h2 style="margin-bottom: 8px;">${escapeHtml(issue.title)} <span style="color: var(--text-secondary)">#${issue.number}</span></h2>
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
                            <span class="pr-status ${issue.state}">${issue.state}</span>
                            <span style="color: var(--text-secondary)">${issue.user.login} opened this ${timeAgo(issue.created_at)}</span>
                        </div>
                        ${issue.body ? `<div class="markdown">${escapeHtml(issue.body)}</div>` : ''}
                    </div>
                </div>

                <h3 style="margin: 16px 0;">Comments (${comments?.length || 0})</h3>

                ${comments?.map(comment => `
                    <div class="card">
                        <div class="card-body">
                            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                                <img src="${comment.user.avatar_url}" style="width: 24px; height: 24px; border-radius: 50%;">
                                <strong>${comment.user.login}</strong>
                                <span style="color: var(--text-secondary)">${timeAgo(comment.created_at)}</span>
                            </div>
                            <div class="markdown">${escapeHtml(comment.body)}</div>
                        </div>
                    </div>
                `).join('') || ''}

                <div class="card" style="margin-top: 16px;">
                    <div class="card-body">
                        <textarea class="textarea" id="commentBody" placeholder="Leave a comment..."></textarea>
                        <button class="btn btn-primary" style="margin-top: 12px;" onclick="addComment()">Comment</button>
                    </div>
                </div>
            `;
    }

    function renderPull() {
      if (!state.viewData) {
        loadPull();
        return renderLoading();
      }

      const {
        pull,
        files
      } = state.viewData;

      return `
                <div class="card">
                    <div class="card-body">
                        <h2 style="margin-bottom: 8px;">${escapeHtml(pull.title)} <span style="color: var(--text-secondary)">#${pull.number}</span></h2>
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
                            <span class="pr-status ${pull.merged ? 'merged' : pull.state}">${pull.merged ? 'Merged' : pull.state}</span>
                            <span style="color: var(--text-secondary)">${pull.user.login} wants to merge into ${pull.base.ref} from ${pull.head.ref}</span>
                        </div>
                        ${pull.body ? `<div class="markdown">${escapeHtml(pull.body)}</div>` : ''}
                    </div>
                </div>

                <h3 style="margin: 16px 0;">Files Changed (${files?.length || 0})</h3>

                ${files?.map(file => `
                    <div class="card">
                        <div style="padding: 12px 16px; background: var(--bg-tertiary); font-family: monospace; font-size: 14px;">${file.filename}</div>
                        <div style="padding: 8px 0; font-size: 12px; color: var(--text-secondary); padding-left: 16px;">
                            +${file.additions} -${file.deletions}
                        </div>
                    </div>
                `).join('') || ''}
            `;
    }

    function renderGists() {
      if (!state.viewData) {
        loadGists();
        return renderLoading();
      }

      return `
                <div class="actions-bar">
                    <button class="btn btn-primary" onclick="showCreateGistModal()">+ New Gist</button>
                </div>
                <div class="card">
                    ${state.viewData.map(gist => `
                        <div class="gist-item" onclick="openGist('${gist.id}')">
                            <div style="font-weight: 600; margin-bottom: 4px;">
                                ${Object.keys(gist.files)[0]}
                            </div>
                            <div style="color: var(--text-secondary); font-size: 14px;">
                                ${gist.description || 'No description'}
                            </div>
                            <div class="gist-files">
                                ${Object.keys(gist.files).map(f => `<span class="gist-file">${f}</span>`).join('')}
                            </div>
                            <div style="color: var(--text-secondary); font-size: 12px; margin-top: 8px;">
                                Created ${timeAgo(gist.created_at)}
                            </div>
                        </div>
                    `).join('') || '<div class="empty-state">No gists</div>'}
                </div>
            `;
    }

    function renderGist() {
      if (!state.viewData) {
        loadGist();
        return renderLoading();
      }

      const gist = state.viewData;

      return `

    function renderSearch() {
      return `
                <form data-search-form onsubmit="handleSearchSubmit(event)">
                    <div class="search-container">
                        <div class="search-input-wrapper">
                            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>

                    <div class="tab ${state.searchType === 'repositories' ? 'active' : ''}" onclick="setSearchType('repositories')">Repositories</div>
                    <div class="tab ${state.searchType === 'users' ? 'active' : ''}" onclick="setSearchType('users')">Users</div>
                </div>
                <div id="searchResults">
                    ${state.searchResults ? renderSearchResults() : '<div class="empty-state">Enter a search query</div>'}
                </div>

    function renderSearchResults() {
      if (!state.searchResults?.items?.length) {
        return '<div class="empty-state">No results found</div>';
      }

      if (state.searchType === 'users') {
        return `
                    <div class="card">
                        ${state.searchResults.items.map(user => `
                            <div class="org-item" onclick="viewUserProfile('${user.login}')">
                                <img class="org-avatar" src="${user.avatar_url}" alt="">
                                <div>
                                    <div style="font-weight: 600;">${user.login}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
      }

      const languages = [...new Set(state.searchResults.items.filter(r => r.language).map(r => r.language))].sort();
      const allLanguages = ['HTML', ...languages.filter(l => l !== 'HTML')];

      let filteredResults = state.searchResults.items;

      // Apply search filters
      if (state.searchFilters.language) {
        filteredResults = filteredResults.filter(r => r.language === state.searchFilters.language);
      }

      if (state.searchFilters.visibility) {
        filteredResults = filteredResults.filter(r => {
          if (state.searchFilters.visibility === 'private') return r.private;
          if (state.searchFilters.visibility === 'public') return !r.private;
          return true;
        });
      }

      if (state.searchFilters.size) {
        filteredResults = filteredResults.filter(r => {
          const size = r.size || 0;
          if (state.searchFilters.size === 'small') return size < 1024;
          if (state.searchFilters.size === 'medium') return size >= 1024 && size < 10240;
          if (state.searchFilters.size === 'large') return size >= 10240;
          return true;
        });
      }

      if (state.searchFilters.updated) {
        filteredResults.sort((a, b) => {
          const result = new Date(b.updated_at) - new Date(a.updated_at);
          return state.searchFilters.updated === 'asc' ? -result : result;
        });
      }

      if (state.searchFilters.stars) {
        filteredResults.sort((a, b) => {
          const result = b.stargazers_count - a.stargazers_count;
          return state.searchFilters.stars === 'asc' ? -result : result;
        });
      }

      if (state.searchFilters.forks) {
        filteredResults.sort((a, b) => {
          const result = b.forks_count - a.forks_count;
          return state.searchFilters.forks === 'asc' ? -result : result;
        });
      }

      // Pagination
      const itemsPerPage = 10;
      const totalItems = filteredResults.length;
      const totalPages = Math.ceil(totalItems / itemsPerPage);
      const currentPage = state.searchPage || 1;
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const paginatedResults = filteredResults.slice(startIndex, endIndex);

      let paginationHTML = '';
      if (totalPages > 1) {
        paginationHTML = `
            <div class="pagination">
              ${currentPage > 1 ? `
                <button class="btn btn-secondary btn-sm" onclick="setSearchPage(${currentPage - 1})">← Previous</button>
              ` : ''}
              
              ${Array.from({ length: totalPages }, (_, i) => i + 1).map(page => `
                <button class="btn ${page === currentPage ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="setSearchPage(${page})" style="min-width: 40px;">${page}</button>
              `).join('')}
              
              ${currentPage < totalPages ? `
                <button class="btn btn-secondary btn-sm" onclick="setSearchPage(${currentPage + 1})">Next →</button>
              ` : ''}
            </div>
          `;
      }

      return `
                <div class="collapsible-filters">
                    <button class="filter-toggle-btn" onclick="toggleFilterDropdown()">
                        ⚙️ Filters
                        <span id="filterChevron">▼</span>
                    </button>
                    <div class="filter-dropdown" id="filterDropdown">
                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Language</label>
                            <select class="filter-dropdown-select" onchange="updateSearchFilter('language', this.value)">
                                <option value="">All Languages</option>
                                ${allLanguages.map(lang => `
                                    <option value="${lang}" ${state.searchFilters.language === lang ? 'selected' : ''}>${lang}</option>
                                `).join('')}
                            </select>
                        </div>

                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Visibility</label>
                            <select class="filter-dropdown-select" onchange="updateSearchFilter('visibility', this.value)">
                                <option value="">All</option>
                                <option value="public" ${state.searchFilters.visibility === 'public' ? 'selected' : ''}>Public</option>
                                <option value="private" ${state.searchFilters.visibility === 'private' ? 'selected' : ''}>Private</option>
                            </select>
                        </div>

                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Size</label>
                            <select class="filter-dropdown-select" onchange="updateSearchFilter('size', this.value)">
                                <option value="">All Sizes</option>
                                <option value="small" ${state.searchFilters.size === 'small' ? 'selected' : ''}>Small (&lt;1MB)</option>
                                <option value="medium" ${state.searchFilters.size === 'medium' ? 'selected' : ''}>Medium (1-10MB)</option>
                                <option value="large" ${state.searchFilters.size === 'large' ? 'selected' : ''}>Large (&gt;10MB)</option>
                            </select>
                        </div>

                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Recently Updated</label>
                            <select class="filter-dropdown-select" onchange="updateSearchFilter('updated', this.value)">
                                <option value="">None</option>
                                <option value="desc" ${state.searchFilters.updated === 'desc' ? 'selected' : ''}>Descending</option>
                                <option value="asc" ${state.searchFilters.updated === 'asc' ? 'selected' : ''}>Ascending</option>
                            </select>
                        </div>

                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Stars</label>
                            <select class="filter-dropdown-select" onchange="updateSearchFilter('stars', this.value)">
                                <option value="">None</option>
                                <option value="desc" ${state.searchFilters.stars === 'desc' ? 'selected' : ''}>Descending</option>
                                <option value="asc" ${state.searchFilters.stars === 'asc' ? 'selected' : ''}>Ascending</option>
                            </select>
                        </div>

                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Forks</label>
                            <select class="filter-dropdown-select" onchange="updateSearchFilter('forks', this.value)">
                                <option value="">None</option>
                                <option value="desc" ${state.searchFilters.forks === 'desc' ? 'selected' : ''}>Descending</option>
                                <option value="asc" ${state.searchFilters.forks === 'asc' ? 'selected' : ''}>Ascending</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="card">
                    ${paginatedResults.map(repo => `
                        <div class="repo-item" onclick="openRepo('${repo.owner.login}', '${repo.name}')">
                            <div class="repo-name">
                                <span>${repo.full_name}</span>
                                <span class="repo-visibility">${repo.private ? 'Private' : 'Public'}</span>
                            </div>
                            ${repo.description ? `<div class="repo-description">${escapeHtml(repo.description)}</div>` : ''}
                            <div class="repo-meta">
                                <span class="repo-meta-item">⭐ ${repo.stargazers_count}</span>
                                ${repo.language ? `<span class="repo-meta-item">${repo.language}</span>` : ''}
                                <span class="repo-meta-item">📦 ${formatBytes(repo.size * 1024)}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>

                ${paginationHTML}

                <div class="pagination-info">
                  Page ${currentPage} of ${totalPages} • Showing ${startIndex + 1}-${Math.min(endIndex, totalItems)} of ${totalItems} results
                </div>
            `;
    }

      try {
        const repos = await state.api.getRepos();

        render();

        showToast('Failed to load repositories: ' + e.message, 'error');

    async function loadRepo() {
      try {
        const {
          owner,
          name
        } = state.currentRepo;
        const pathStr = state.currentPath.length > 0 ? state.currentPath.join('/') : '';
        const [repo, contents, isStarred] = await Promise.all([
          state.api.getRepo(owner, name),
          pathStr ? state.api.getContents(owner, name, pathStr) : state.api.getContents(owner, name),
          state.api.isStarred(owner, name)
        ]);

        let contentsArray = Array.isArray(contents) ? contents : [];

        let readme = null;
        if (state.currentPath.length === 0) {
          try {
            readme = await state.api.getReadme(owner, name);
          } catch (e) {}
        }

        state.viewData = {
          repo,
          contents: contentsArray,
          readme,
          isStarred
        };
        render();
      } catch (e) {
        showToast('Failed to load repository: ' + e.message, 'error');
      }
    }

    function navigate(view) {
      state.currentView = view;
      state.viewData = null;
      state.repoTab = 'code';
      state.filters = {
        language: null,
        updated: null,
        stars: null,
        forks: null,
        size: null,
        visibility: null
      };
      state.searchFilters = {
        language: null,
        updated: null,
        stars: null,
        forks: null,
        size: null,
        visibility: null
      };
      state.searchPage = 1;
      state.filterDropdownOpen = false;
      state.reposFilterDropdownOpen = false;
      closeSidebar();
      render();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
      document.querySelector('.nav-overlay').classList.toggle('active');
    }

    function closeSidebar() {
      document.getElementById('sidebar')?.classList.remove('active');
      document.querySelector('.nav-overlay')?.classList.remove('active');
    }

    function toggleFilterDropdown() {
      state.filterDropdownOpen = !state.filterDropdownOpen;
      const dropdown = document.getElementById('filterDropdown');
      const chevron = document.getElementById('filterChevron');
      if (dropdown) {
        dropdown.classList.toggle('active');
        chevron.textContent = state.filterDropdownOpen ? '▲' : '▼';
      }
    }

      };

      });

    // Text filter
    function filterReposText() {
      const query = document.getElementById('repoSearchInput')?.value.toLowerCase() || '';
      const items = document.querySelectorAll('.repo-item');
      items.forEach(item => {
        const name = item.getAttribute('data-repo-name') || '';
        item.style.display = name.includes(query) ? '' : 'none';

    // Auth functions
    async function signIn() {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token) {
        showToast('Please enter a token', 'error');
        return;
      }

      state.token = token;
      state.api = new GitHubAPI(token);

      try {
        state.user = await state.api.getUser();
        localStorage.setItem('github_token', token);
        showToast('Signed in successfully', 'success');
        render();
      } catch (e) {
        state.token = null;
        state.api = null;
        showToast('Invalid token: ' + e.message, 'error');
      }
    }

    function signOut() {
      state.token = null;
      state.user = null;
      state.api = null;
      localStorage.removeItem('github_token');
      render();
    }

    // Actions
    async function toggleStar(owner, name, isStarred) {
      try {
        if (isStarred) {
          await state.api.unstarRepo(owner, name);
          showToast('Unstarred ' + name, 'success');
        } else {
          await state.api.starRepo(owner, name);
          showToast('Starred ' + name, 'success');
        }
        state.viewData.isStarred = !isStarred;
        render();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    async function forkRepo(owner, name) {
      try {
        await state.api.forkRepo(owner, name);
        showToast('Forked ' + name, 'success');
      } catch (e) {
        showToast('Failed to fork: ' + e.message, 'error');
      }
    }

    async function addComment() {
      const body = document.getElementById('commentBody')?.value.trim();
      if (!body) return;

      try {
        const {
          owner,
          name,
          number
        } = state.currentIssue;
        await state.api.createIssueComment(owner, name, number, body);
        showToast('Comment added', 'success');
        state.viewData = null;
        loadIssue();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    // Search
    function setSearchType(type) {
      state.searchType = type;
      state.searchPage = 1;
      render();
    }

    function handleSearchSubmit(event) {
      event.preventDefault();
      const searchInput = document.getElementById('searchInput');
      const query = searchInput?.value.trim();
      if (query) {
        state.lastSearchQuery = query;
        state.searchPage = 1;
        performSearch(query);
      }
    }

    async function performSearch(query) {
      try {
        let allResults = [];

        // Fetch first 5 pages (150 results total)
        for (let page = 1; page <= 5; page++) {
          try {
            if (state.searchType === 'repositories') {
              const pageResults = await state.api.searchRepos(query, page);

              allResults = allResults.concat(pageResults.items);

              allResults = allResults.concat(pageResults.items);

          } catch (e) {

          }
        }

        state.searchResults = {
          items: allResults,

    async function createFile() {
      const path = document.getElementById('filePath')?.value.trim();
      const content = document.getElementById('fileContent')?.value || '';
      const message = document.getElementById('commitMessage')?.value.trim() || `Create ${path}`;

      if (!path) {
        showToast('File path is required', 'error');
        return;
      }

      const btn = document.querySelector('.modal-footer .btn-primary');
      if (btn) { btn.disabled = true; btn.textContent = 'Committing…'; }
      try {
        const {
          owner,
          name
        } = state.currentRepo;

        // GitHub's PUT /contents/{path} endpoint requires the existing file's
        // "sha" to overwrite it. Without sha you get:
        //   Invalid request. "sha" wasn't supplied.
        // → pre-flight: if the path already exists, fetch its sha and confirm
        //   the overwrite before committing.
        let sha;
        try {
          const existing = await state.api.getContents(owner, name, path);
          sha = existing && existing.sha ? existing.sha : undefined;
        } catch (e) {
          // "Not Found" (404) means the file is new — no sha needed. Any other
          // getContents error bubbles up to the outer catch and is surfaced.
          if (!/not found/i.test(e.message)) throw e;
        }

        if (sha && !confirm(`"${path}" already exists in this repo. Overwrite it?`)) {
          if (btn) { btn.disabled = false; btn.textContent = 'Commit'; }
          return;
        }

        await state.api.createOrUpdateFile(owner, name, path, {
          message,
          content: utf8ToBase64(content),
          ...(sha ? {
            sha
          } : {})
        });
        closeModal();
        showToast(sha ? 'File updated' : 'File created', 'success');
        state.viewData = null;
        loadRepo();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Commit'; }
      }
    }

    // Walk a folder recursively and return [{ path, sha, content }] for every
    // file inside it. Used by folder rename to recreate each file at new path.
    async function listFilesRecursive(owner, repo, path) {
      const items = await state.api.getContents(owner, repo, path);
      const out = [];
      if (!Array.isArray(items)) {
        // Single file returned directly (shouldn't happen for a dir, but safe)
        if (items.type === 'file') {
          out.push({
            path: items.path,
            sha: items.sha,
            content: items.content
          });
        }
        return out;
      }
      for (const item of items) {
        if (item.type === 'file') {
          // Fetch full content + sha for the file
          const f = await state.api.getContents(owner, repo, item.path);
          out.push({
            path: f.path,
            sha: f.sha,
            content: f.content
          });
        } else if (item.type === 'dir') {
          const sub = await listFilesRecursive(owner, repo, item.path);
          out.push(...sub);
        }
      }
      return out;
    }

    async function performRename() {
      const pending = state.pendingRename;
      if (!pending || !pending.oldPath) {
        closeModal();
        return;
      }
      const {
        type,
        name,
        oldPath
      } = pending;
      const newName = document.getElementById('renameInput')?.value.trim();
      if (!newName) {
        showToast('New name is required', 'error');
        return;
      }
      if (newName.includes('/')) {
        showToast('New name cannot contain "/"', 'error');
        return;
      }
      if (newName === name) {
        closeModal();
        return;
      }

      // Build new path: replace the last segment of oldPath
      const oldSegments = oldPath.split('/');
      oldSegments[oldSegments.length - 1] = newName;
      const newPath = oldSegments.join('/');
      const message = document.getElementById('renameCommitMessage')?.value.trim() ||
        `Rename ${oldPath} → ${newPath}`;

      const btn = document.querySelector('.modal-footer .btn-primary');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Renaming…';
      }

      try {
        const {
          owner,
          name: repo
        } = state.currentRepo;

        if (type === 'file') {
          // 1. Fetch current content + sha
          const file = await state.api.getContents(owner, repo, oldPath);
          // 2. Check if new path already exists; if so, ask before overwriting
          let newSha;
          try {
            const existing = await state.api.getContents(owner, repo, newPath);
            newSha = existing && existing.sha ? existing.sha : undefined;
            if (!confirm(`"${newPath}" already exists. Overwrite it?`)) {
              if (btn) {
                btn.disabled = false;
                btn.textContent = 'Rename';
              }
              return;
            }
          } catch (e) {
            if (!/not found/i.test(e.message)) throw e;
          }
          // 3. Create at new path
          await state.api.createOrUpdateFile(owner, repo, newPath, {
            message,
            content: file.content, // already base64 from API
            ...(newSha ? {
              sha: newSha
            } : {})
          });
          // 4. Delete the old path (its sha is the one we fetched in step 1)
          await state.api.deleteFile(owner, repo, oldPath, {
            message,
            sha: file.sha
          });
        } else {
          // Folder rename: walk recursively, recreate each file at new path,
          // then delete the old copy. Same commit message for each pair so
          // git history reads cleanly.
          const files = await listFilesRecursive(owner, repo, oldPath);
          if (files.length === 0) {
            // Empty folder (only a .gitkeep that GitHub didn't return? rare)
            // → just create a new .gitkeep at new path; the old folder will
            // disappear on its own when nothing references it.
            await state.api.createOrUpdateFile(owner, repo, `${newPath}/.gitkeep`, {
              message,
              content: utf8ToBase64('')
            });
          } else {
            for (const f of files) {
              const newFilePath = newPath + f.path.substring(oldPath.length);
              let existingSha;
              try {
                const existing = await state.api.getContents(owner, repo, newFilePath);
                existingSha = existing && existing.sha ? existing.sha : undefined;
              } catch (e) {
                if (!/not found/i.test(e.message)) throw e;
              }
              await state.api.createOrUpdateFile(owner, repo, newFilePath, {
                message,
                content: f.content, // already base64
                ...(existingSha ? {
                  sha: existingSha
                } : {})
              });
              await state.api.deleteFile(owner, repo, f.path, {
                message,
                sha: f.sha
              });
            }
          }
        }

        closeModal();
        showToast(`${type === 'file' ? 'File' : 'Folder'} renamed`, 'success');
        state.pendingRename = null;
        // Reload — if we were viewing the file, drop back to the repo view;
        // otherwise refresh the listing.
        if (state.currentView === 'file') {
          state.currentView = 'repo';
          state.viewData = null;
          render();
          loadRepo();
        } else {
          state.viewData = null;
          loadRepo();
        }
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Rename';
        }
      }
    }

    function triggerFileUpload(isFolder) {
      const id = isFolder ? 'uploadFolderInput' : 'uploadFileInput';
      const input = document.getElementById(id);
      if (input) {
        // Reset so picking the same file again still fires onchange
        input.value = '';

      }
    }

    // Read a File object and return its base64 representation (without the
    // data-URL prefix). Works for any file type — text, binary, image, etc.
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          // reader.result is "data:<mime>;base64,XXXX" — strip the prefix
          const result = reader.result || '';
          const commaIdx = result.indexOf(',');
          resolve(commaIdx >= 0 ? result.substring(commaIdx + 1) : result);
        };
        reader.onerror = () => reject(reader.error || new Error('File read failed'));
        reader.readAsDataURL(file);
      });
    }

    async function handleFileUpload(event, isFolder) {
      const input = event.target;
      const files = Array.from(input.files || []);
      if (!files.length) return;

      const statusEl = document.getElementById('uploadStatus');
      const footer = document.querySelector('.modal-footer');
      // Swap the modal footer to a "Done" button that only enables when finished
      if (footer) {
        footer.innerHTML = '<button class="btn btn-secondary" onclick="closeModal()" id="uploadDoneBtn" disabled>Uploading…</button>';
      }

      const {
        owner,
        name
      } = state.currentRepo;
      const basePath = state.currentPath.join('/');
      const messagePrefix = isFolder ? `Upload folder: ` : `Upload: `;

      let success = 0;
      const failed = [];

      const renderStatus = (currentIdx, total, currentPath, pct) => {
        if (!statusEl) return;
        statusEl.style.display = 'block';
        statusEl.innerHTML = `
                    <div>Uploading ${currentIdx + 1} of ${total} — <code>${escapeHtml(currentPath)}</code></div>
                    <div class="upload-progress-bar"><div class="upload-progress-fill" style="width:${pct}%"></div></div>
                    ${success > 0 ? `<div style="margin-top:8px;color:var(--text-secondary);font-size:12px;">✅ ${success} uploaded</div>` : ''}
                    ${failed.length ? `<div style="margin-top:8px;color:var(--text-secondary);font-size:12px;">❌ ${failed.length} failed</div>` : ''}
                `;
      };

      try {
        for (let i = 0; i < files.length; i++) {
          const f = files[i];
          // For folder uploads, webkitRelativePath is "TopFolder/sub/file.txt".
          // For file uploads, we just use the file name.
          const relPath = isFolder && f.webkitRelativePath ? f.webkitRelativePath : f.name;
          const targetPath = basePath ? `${basePath}/${relPath}` : relPath;
          renderStatus(i, files.length, targetPath, Math.round((i / files.length) * 100));

          try {
            const base64 = await fileToBase64(f);
            // Pre-flight: if the path exists, fetch its sha so we overwrite cleanly.
            let sha;
            try {
              const existing = await state.api.getContents(owner, name, targetPath);
              sha = existing && existing.sha ? existing.sha : undefined;
            } catch (e) {
              if (!/not found/i.test(e.message)) throw e;
            }
            await state.api.createOrUpdateFile(owner, name, targetPath, {
              message: messagePrefix + targetPath,
              content: base64,
              ...(sha ? {
                sha
              } : {})
            });
            success++;
          } catch (e) {
            failed.push({
              path: targetPath,
              error: e.message
            });
          }
        }

        // Final status
        renderStatus(files.length - 1, files.length, '', 100);
        if (statusEl) {
          statusEl.innerHTML = `
                    <div>✅ Uploaded ${success} of ${files.length} file${success === 1 ? '' : 's'}.</div>
                    ${failed.length ? `
                        <div style="margin-top:8px;">❌ Failed (${failed.length}):</div>
                        <ul style="margin:6px 0 0 18px;padding:0;">
                            ${failed.map(f => `<li><code>${escapeHtml(f.path)}</code> — ${escapeHtml(f.error)}</li>`).join('')}
                        </ul>
                    ` : ''}
                    <div style="margin-top:8px;color:var(--text-secondary);font-size:12px;">Reloading repo…</div>
                `;
        }
        // Re-enable the Done button
        const doneBtn = document.getElementById('uploadDoneBtn');
        if (doneBtn) {
          doneBtn.disabled = false;
          doneBtn.textContent = 'Done';
        }
        // Reload the repo listing so the new files/folders appear
        setTimeout(() => {
          closeModal();
          state.viewData = null;
          loadRepo();
        }, 1200);
      } catch (e) {
        if (statusEl) {
          statusEl.style.display = 'block';
          statusEl.innerHTML = `<div>❌ Upload failed: ${escapeHtml(e.message)}</div>`;
        }
        const doneBtn = document.getElementById('uploadDoneBtn');
        if (doneBtn) {
          doneBtn.disabled = false;
          doneBtn.textContent = 'Close';
        }
      }
    }

    function escapeHtml(text) {
      if (!text) return '';

    // UTF-8 safe Base64 helpers — support emojis and ALL Unicode characters.
    // Plain btoa()/atob() only handle Latin-1 and throw or garble anything else.
    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      const chunkSize = 0x8000; // 32K chunks avoid call-stack limits on large files
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function base64ToUtf8(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      try {
        return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      } catch (e) {
        // Content isn't valid UTF-8 (e.g. binary or legacy encoding) — return raw
        return binary;
      }
    }

    function timeAgo(date) {
      const seconds = Math.floor((new Date() - new Date(date)) / 1000);
      const intervals = [{
          label: 'year',
          seconds: 31536000
        },
        {
          label: 'month',
          seconds: 2592000
        },
        {
          label: 'day',
          seconds: 86400
        },
        {
          label: 'hour',
          seconds: 3600
        },
        {
          label: 'minute',
          seconds: 60
        }
      ];

      for (const interval of intervals) {
        const count = Math.floor(seconds / interval.seconds);
        if (count >= 1) {
          return `${count} ${interval.label}${count > 1 ? 's' : ''} ago`;
        }
      }
      return 'just now';
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';

    }

      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Tiny, safe markdown renderer (input is escaped first)
    function renderMarkdown(src) {
      if (!src) return '';
      const blocks = [];
      let text = String(src).replace(/\r\n/g, '\n').replace(/```([\w-]*)\n([\s\S]*?)```/g, (m, lang, code) => {
        blocks.push(`<pre><code>${escFast(code.replace(/\n$/, ''))}</code></pre>`);
        return `\u0000${blocks.length - 1}\u0000`;
      });
      text = escFast(text);
      const inline = s => s
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[\s(])_([^_]+)_(?=[\s).,!?]|$)/g, '$1<em>$2</em>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
      const out = [];
      let list = null;
      const flushList = () => { if (list) { out.push(`<${list.type}>${list.items.map(i => `<li>${inline(i)}</li>`).join('')}</${list.type}>`); list = null; } };
      let para = [];
      const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join('<br>'))}</p>`); para = []; } };
      for (const line of text.split('\n')) {
        let m;
        if (/^\u0000\d+\u0000$/.test(line.trim())) { flushPara(); flushList(); out.push(line.trim()); continue; }
        if ((m = /^(#{1,4})\s+(.*)$/.exec(line))) { flushPara(); flushList(); const lvl = Math.min(m[1].length + 1, 4); out.push(`<h${lvl}>${inline(m[2])}</h${lvl}>`); continue; }
        if ((m = /^\s*[-*]\s+(.*)$/.exec(line))) { flushPara(); if (!list || list.type !== 'ul') { flushList(); list = { type: 'ul', items: [] }; } list.items.push(m[1]); continue; }
        if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(line))) { flushPara(); if (!list || list.type !== 'ol') { flushList(); list = { type: 'ol', items: [] }; } list.items.push(m[1]); continue; }
        if ((m = /^&gt;\s?(.*)$/.exec(line))) { flushPara(); flushList(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); continue; }
        if (!line.trim()) { flushPara(); flushList(); continue; }
        flushList();
        para.push(line);
      }
      flushPara(); flushList();
      return out.join('').replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[+i]);
    }

    // ---------- API upgrades ----------
    // Robust request(): no stale browser cache, handles empty bodies, raw text.
    GitHubAPI.prototype.request = async function (endpoint, options = {}) {
      const url = endpoint.startsWith('http') ? endpoint : `${this.baseUrl}${endpoint}`;
      const { raw, ...opts } = options;
      const method = (opts.method || 'GET').toUpperCase();
      const response = await fetch(url, {
        ...opts,
        cache: method === 'GET' ? 'no-store' : opts.cache,
        headers: {
          'Authorization': `Bearer ${this.token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json',
          ...(opts.headers || {})
        }
      });
      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        const err = new Error(error.message || `HTTP ${response.status}`);
        err.status = response.status;
        throw err;
      }
      if (response.status === 204) return null;
      const text = await response.text();
      if (raw) return text;
      if (!text) return null;
      try { return JSON.parse(text); } catch (e) { return text; }
    };

    // Branch-aware content operations: when you're inside a repo, reads and
    // writes target the branch picked in the branch switcher.

      const r = state.currentRepo;
      return (r && r.owner === owner && r.name === repo && state.currentBranch) ? state.currentBranch : '';
    }
    const _origGetContents = GitHubAPI.prototype.getContents;
    GitHubAPI.prototype.getContents = function (owner, repo, path = '', ref = '') {
      return _origGetContents.call(this, owner, repo, path, ref || activeRefFor(owner, repo));
    };
    const _origPutFile = GitHubAPI.prototype.createOrUpdateFile;
    GitHubAPI.prototype.createOrUpdateFile = function (owner, repo, path, data) {
      const b = activeRefFor(owner, repo);
      return _origPutFile.call(this, owner, repo, path, (b && !data.branch) ? { ...data, branch: b } : data);
    };
    const _origDeleteFile = GitHubAPI.prototype.deleteFile;

      const b = activeRefFor(owner, repo);

    };
