    function stateFilter(kind, current) {
      return `<div class="segmented" style="margin-bottom: 12px;">
        ${['open', 'closed', 'all'].map(s => `<button class="${current === s ? 'active' : ''}" onclick="setListFilter('${kind}', '${s}')">${s[0].toUpperCase() + s.slice(1)}</button>`).join('')}
      </div>`;
    }
    function setListFilter(kind, s) {
      if (kind === 'issues') { state.issueFilter = s; state.viewData.issues = null; }
      else { state.pullFilter = s; state.viewData.pulls = null; }
      render();
    }

    function renderRepoIssues() {
      if (!state.viewData.issues) { loadRepoIssues(); return renderLoading(); }
      const { owner, name } = state.currentRepo;
      const list = state.viewData.issues.filter(i => !i.pull_request);
      return `
        <div class="row-between" style="flex-wrap: wrap;">
          ${stateFilter('issues', state.issueFilter || 'open')}
          <button class="btn btn-primary btn-sm" onclick="showCreateIssueModal()">+ New issue</button>
        </div>
        <div class="card">
          ${list.map(issue => `
            <div class="issue-item" onclick="openIssue(${jsArg(owner)}, ${jsArg(name)}, ${issue.number})">
              <div class="issue-title">
                <span class="pr-status ${issue.state}" style="padding: 1px 8px; font-size: 11px;">${issue.state}</span>
                <span>${escFast(issue.title)}</span>
              </div>
              <div class="issue-meta">
                #${issue.number} opened ${timeAgo(issue.created_at)} by ${escFast(issue.user.login)}
                ${issue.labels?.map(l => `<span class="topic" style="margin-left: 6px; background: #${l.color}33; color: #${l.color};">${escFast(l.name)}</span>`).join('') || ''}
                ${issue.comments ? ` · 💬 ${issue.comments}` : ''}
              </div>
            </div>`).join('') || '<div class="empty-state">No issues</div>'}
        </div>`;
    }

    function renderRepoPulls() {
      if (!state.viewData.pulls) { loadRepoPulls(); return renderLoading(); }
      const { owner, name } = state.currentRepo;
      return `
        <div class="row-between" style="flex-wrap: wrap;">
          ${stateFilter('pulls', state.pullFilter || 'open')}
          <button class="btn btn-primary btn-sm" onclick="showCompareModal()">+ New pull request</button>
        </div>
        <div class="card">
          ${state.viewData.pulls.map(pr => {
            const st = pr.merged_at ? 'merged' : pr.state;
            return `
            <div class="issue-item" onclick="openPull(${jsArg(owner)}, ${jsArg(name)}, ${pr.number})">
              <div class="issue-title">
                <span class="pr-status ${st}" style="padding: 1px 8px; font-size: 11px;">${st}</span>
                <span>${escFast(pr.title)}</span>
              </div>
              <div class="issue-meta">#${pr.number} · ${escFast(pr.head.ref)} → ${escFast(pr.base.ref)} · ${timeAgo(pr.created_at)} by ${escFast(pr.user.login)}${pr.draft ? ' · Draft' : ''}</div>
            </div>`;
          }).join('') || '<div class="empty-state">No pull requests</div>'}
        </div>`;
    }

    function renderRepoCommits() {
      if (!state.viewData.commits) { loadRepoCommits(); return renderLoading(); }
      const { owner, name } = state.currentRepo;
      return `
        <div class="card">
          ${state.viewData.commits.map(c => `
            <div class="commit-item clickable" onclick="openCommit(${jsArg(owner)}, ${jsArg(name)}, ${jsArg(c.sha)})">
              <div class="commit-message">${escFast(c.commit.message.split('\n')[0])}</div>
              <div class="commit-meta">
                ${c.author ? `<img class="commit-avatar" src="${escAttr(c.author.avatar_url)}" alt="">` : ''}
                <span>${escFast(c.commit.author.name)}</span><span>•</span>
                <span>${timeAgo(c.commit.author.date)}</span><span>•</span>
                <span class="sha">${c.sha.slice(0, 7)}</span>
              </div>
            </div>`).join('') || '<div class="empty-state">No commits</div>'}
        </div>`;
    }

    // ---------- commit detail ----------
    function openCommit(owner, name, sha) {
      state.currentRepo = { owner, name };
      state.currentCommit = { owner, name, sha };
      state.currentView = 'commit';
      state.viewData = null;
      render();
      window.scrollTo(0, 0);
    }

    function renderCommit() {
      if (!state.viewData) {
        const { owner, name, sha } = state.currentCommit;
        state.api.getCommit(owner, name, sha).then(c => { state.viewData = { commit: c }; render(); })
          .catch(e => { state.viewData = { fatal: e.message }; render(); });
        return renderLoading();
      }
      if (state.viewData.fatal) return `<div class="card"><div class="empty-state">${escFast(state.viewData.fatal)}</div></div>`;
      const c = state.viewData.commit;
      const { owner, name } = state.currentCommit;
      const [title, ...rest] = c.commit.message.split('\n');
      return `
        <div class="breadcrumb">
          <span class="breadcrumb-item" onclick="backToRepo('commits')">${escFast(name)}</span>
          <span class="breadcrumb-separator">/</span><span>Commit ${c.sha.slice(0, 7)}</span>
        </div>
        <div class="card"><div class="card-body">
          <h2 style="font-size: 18px; margin-bottom: 8px; word-break: break-word;">${escFast(title)}</h2>
          ${rest.join('\n').trim() ? `<pre style="white-space: pre-wrap; font-size: 13px; color: var(--text-secondary); margin-bottom: 10px;">${escFast(rest.join('\n').trim())}</pre>` : ''}
          <div class="commit-meta">
            ${c.author ? `<img class="commit-avatar" src="${escAttr(c.author.avatar_url)}" alt="">` : ''}
            <span>${escFast(c.commit.author.name)}</span><span>•</span><span>${timeAgo(c.commit.author.date)}</span><span>•</span>
            <span class="sha">${c.sha.slice(0, 7)}</span>
          </div>
          <div class="diff-stat" style="margin-top: 10px;">${plural(c.files?.length || 0, 'file')} changed · <span class="a">+${c.stats?.additions || 0}</span> <span class="d">−${c.stats?.deletions || 0}</span></div>
          <div class="row" style="margin-top: 12px;">
            <button class="btn btn-sm btn-secondary" onclick="copyText(${jsArg(c.sha)})">Copy SHA</button>
            <a class="btn btn-sm btn-secondary" href="${escAttr(c.html_url)}" target="_blank" rel="noopener">Open on GitHub</a>
            ${c.parents?.length === 1 ? `<button class="btn btn-sm btn-secondary" onclick="revertCommitAsRequest()">Stage revert</button>` : ''}
          </div>
        </div></div>
        ${(c.files || []).map(f => renderPatchFile(f)).join('')}`;
    }

    function renderPatchFile(f, open = true) {
      const act = { added: 'create', removed: 'delete', renamed: 'rename', modified: 'update', changed: 'update' }[f.status] || 'update';
      return `
        <div class="card diff-file">
          <details class="diff-details" ${open ? 'open' : ''}>
            <summary class="diff-file-header">
              <span class="chev">▶</span>
              <span class="action-pill ${act}">${f.status}</span>
              <span class="diff-file-path">${f.previous_filename ? `${escFast(f.previous_filename)} → ` : ''}${escFast(f.filename)}</span>
              <span class="diff-stat"><span class="a">+${f.additions}</span> <span class="d">−${f.deletions}</span></span>
            </summary>
            <div class="diff-body">${renderPatch(f.patch)}</div>
          </details>
        </div>`;
    }

    function backToRepo(tab) {
      state.currentView = 'repo';
      state.repoTab = tab;
      state.viewData = null;
      render();
    }

    async function revertCommitAsRequest() {
      const c = state.viewData.commit;
      const { owner, name } = state.currentCommit;
      if (!confirm(`Stage a revert of ${c.sha.slice(0, 7)}? You'll review the diff before anything is pushed.`)) return;
      try {
        const parent = c.parents[0].sha;
        const repo = await state.api.getRepo(owner, name);
        const branch = state.currentBranch || repo.default_branch;
        let n = 0;
        for (const f of c.files) {
          if (f.status === 'added') {
            stageChange({ owner, repo: name, branch, path: f.filename, action: 'delete' });
          } else {
            const src = f.status === 'renamed' ? f.previous_filename : f.filename;
            const text = await state.api.getRaw(owner, name, src, parent);
            stageChange({ owner, repo: name, branch, path: src, action: f.status === 'removed' ? 'create' : 'update', content: text });
            if (f.status === 'renamed') stageChange({ owner, repo: name, branch, path: f.filename, action: 'delete' });
          }
          n++;
        }
        updateRequestCount();
        showToast(`Staged revert of ${plural(n, 'file')}`, 'success');
        openStagedRequest(`${owner}/${name}@${branch}`);
      } catch (e) { showToast('Could not stage revert: ' + e.message, 'error'); }
    }

    // ---------- branches ----------
    function renderRepoBranches() {
      const { repo, branches } = state.viewData;
      const { owner, name } = state.currentRepo;
      return `
        <div class="actions-bar"><button class="btn btn-primary btn-sm" onclick="showCreateBranchModal()">+ New branch</button></div>
        <div class="card">
          ${(branches || []).map(b => `
            <div class="list-row">
              <div class="list-row-main">
                <div class="list-row-title" style="font-family: monospace;">${escFast(b.name)} ${b.name === repo.default_branch ? '<span class="status-pill outline">default</span>' : ''} ${b.protected ? '<span class="status-pill outline">protected</span>' : ''}</div>
                <div class="muted small"><span class="sha">${b.commit.sha.slice(0, 7)}</span></div>
              </div>
              <div class="list-row-actions">
                <button class="btn btn-sm btn-secondary" onclick="state.repoTab='code'; switchBranch(${jsArg(b.name)})">Browse</button>
                ${b.name !== repo.default_branch ? `
                  <button class="btn btn-sm btn-secondary" onclick="state.currentBranch=${jsArg(b.name)}; showCompareModal()">PR</button>
                  <button class="btn btn-sm btn-danger" onclick="deleteBranch(${jsArg(b.name)})">Delete</button>` : ''}
              </div>
            </div>`).join('') || '<div class="empty-state">No branches</div>'}
        </div>`;
    }

    function showCreateBranchModal() {
      const { branches } = state.viewData;
      showModal('New branch', `
        <div class="input-group"><label class="input-label">Branch name</label><input class="input" id="newBranchName" placeholder="feature/my-change"></div>
        <div class="input-group"><label class="input-label">From</label>
          <select class="select" id="newBranchFrom">${(branches || []).map(b => `<option ${b.name === state.currentBranch ? 'selected' : ''}>${escFast(b.name)}</option>`).join('')}</select>
        </div>`, `
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="createBranch()">Create branch</button>`);
    }

    async function createBranch() {
      const nameV = document.getElementById('newBranchName').value.trim();
      const from = document.getElementById('newBranchFrom').value;
      if (!/^[\w./-]+$/.test(nameV)) { showToast('Enter a valid branch name', 'error'); return; }
      const { owner, name } = state.currentRepo;
      try {
        const sha = (state.viewData.branches.find(b => b.name === from) || {}).commit?.sha || (await state.api.getRef(owner, name, from)).object.sha;
        await state.api.createRef(owner, name, nameV, sha);
        closeModal();
        showToast(`Branch ${nameV} created`, 'success');
        state.repoTab = 'code';
        switchBranch(nameV);
      } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    async function deleteBranch(b) {
      if (!confirm(`Delete branch "${b}"?`)) return;
      const { owner, name } = state.currentRepo;
      try {
        await state.api.deleteBranch(owner, name, b);
        if (state.currentBranch === b) state.currentBranch = null;
        showToast('Branch deleted', 'success');
        state.viewData = null; render();
      } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    function showCompareModal() {
      const { repo, branches } = state.viewData;
      const names = (branches || []).map(b => b.name);
      const head = state.currentBranch !== repo.default_branch ? state.currentBranch : names.find(n => n !== repo.default_branch) || '';
      showModal('New pull request', `
        <div class="settings-grid">
          <div class="input-group"><label class="input-label">Merge into (base)</label>
            <select class="select" id="prBase">${names.map(n => `<option ${n === repo.default_branch ? 'selected' : ''}>${escFast(n)}</option>`).join('')}</select></div>
          <div class="input-group"><label class="input-label">From (head)</label>
            <select class="select" id="prHead">${names.map(n => `<option ${n === head ? 'selected' : ''}>${escFast(n)}</option>`).join('')}</select></div>
        </div>
        <div class="input-group"><label class="input-label">Title</label><input class="input" id="prTitle" value="${escAttr(head ? head.replace(/[-_/]/g, ' ') : '')}"></div>
        <div class="input-group"><label class="input-label">Description</label><textarea class="textarea" id="prBody" placeholder="What does this change?"></textarea></div>
        <label class="checkbox-label"><input type="checkbox" id="prDraft"> Open as draft</label>`, `
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="createPullRequest()">Create pull request</button>`);
    }

    async function createPullRequest() {
      const base = document.getElementById('prBase').value, head = document.getElementById('prHead').value;
      const title = document.getElementById('prTitle').value.trim();
      if (base === head) { showToast('Pick two different branches', 'error'); return; }
      if (!title) { showToast('Add a title', 'error'); return; }
      const { owner, name } = state.currentRepo;
      try {
        const pr = await state.api.createPull(owner, name, { base, head, title, body: document.getElementById('prBody').value, draft: document.getElementById('prDraft').checked });
        closeModal();
        showToast(`Pull request #${pr.number} opened`, 'success');
        openPull(owner, name, pr.number);
      } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    // ---------- Actions ----------
    function renderRepoActions() {
      const v = state.viewData;
      const { owner, name } = state.currentRepo;
      if (!v.runs) {
        Promise.all([state.api.getRuns(owner, name), state.api.getWorkflows(owner, name)])
          .then(([r, w]) => { v.runs = r.workflow_runs || []; v.workflows = w.workflows || []; render(); })
          .catch(e => { v.runs = []; v.workflows = []; v.actionsError = e.message; render(); });
        return renderLoading();
      }
      return `
        ${v.actionsError ? `<div class="warn-banner" style="margin: 0 0 12px;">${escFast(v.actionsError)}</div>` : ''}
        <div class="row-between" style="margin-bottom: 12px; flex-wrap: wrap;">
          <span class="muted small">${plural(v.workflows.length, 'workflow')}</span>
          <div class="row">
            <button class="btn btn-sm btn-secondary" onclick="state.viewData.runs=null; render()">Refresh</button>
            ${v.workflows.length ? `<button class="btn btn-sm btn-primary" onclick="showDispatchModal()">Run workflow</button>` : ''}
          </div>
        </div>
        <div class="card">
          ${v.runs.map(r => `
            <div class="list-row">
              <span class="run-dot ${r.conclusion || r.status}" title="${escAttr(r.conclusion || r.status)}"></span>
              <div class="list-row-main">
                <div class="list-row-title">${escFast(r.display_title || r.name)}</div>
                <div class="muted small">${escFast(r.name)} · ${escFast(r.head_branch || '')} · ${escFast(r.event)} · ${timeAgo(r.created_at)} · ${escFast(r.conclusion || r.status)}</div>
              </div>
              <div class="list-row-actions">
                ${['in_progress', 'queued', 'waiting'].includes(r.status) ? `<button class="btn btn-sm btn-secondary" onclick="runAction('cancel', ${r.id})">Cancel</button>` : `<button class="btn btn-sm btn-secondary" onclick="runAction('rerun', ${r.id})">Re-run</button>`}
                <a class="btn btn-sm btn-secondary" href="${escAttr(r.html_url)}" target="_blank" rel="noopener">Logs</a>
              </div>
            </div>`).join('') || '<div class="empty-state">No workflow runs yet</div>'}
        </div>`;
    }

    async function runAction(kind, id) {
      const { owner, name } = state.currentRepo;
      try {
        await (kind === 'cancel' ? state.api.cancelRun(owner, name, id) : state.api.rerunRun(owner, name, id));
        showToast(kind === 'cancel' ? 'Cancel requested' : 'Re-run started', 'success');
        setTimeout(() => { if (state.viewData) { state.viewData.runs = null; render(); } }, 1500);
      } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    function showDispatchModal() {
      const { workflows, branches, repo } = state.viewData;
      showModal('Run workflow', `
        <div class="muted small" style="margin-bottom: 10px;">Only workflows with a <code class="inline">workflow_dispatch</code> trigger can be started manually.</div>
        <div class="input-group"><label class="input-label">Workflow</label>
          <select class="select" id="dispatchWf">${workflows.map(w => `<option value="${w.id}">${escFast(w.name)}</option>`).join('')}</select></div>
        <div class="input-group"><label class="input-label">Branch</label>
          <select class="select" id="dispatchRef">${(branches || []).map(b => `<option ${b.name === repo.default_branch ? 'selected' : ''}>${escFast(b.name)}</option>`).join('')}</select></div>`, `
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="dispatchWorkflow()">Run</button>`);
    }

    async function dispatchWorkflow() {
      const { owner, name } = state.currentRepo;
      try {
        await state.api.dispatchWorkflow(owner, name, document.getElementById('dispatchWf').value, document.getElementById('dispatchRef').value);
        closeModal();
        showToast('Workflow queued', 'success');
        setTimeout(() => { if (state.viewData) { state.viewData.runs = null; render(); } }, 2500);
      } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    // ---------- Releases ----------
    function renderRepoReleases() {
      const v = state.viewData;
      const { owner, name } = state.currentRepo;
      if (!v.releases) {
        state.api.getReleases(owner, name).then(r => { v.releases = r; render(); }).catch(e => { v.releases = []; showToast(e.message, 'error'); render(); });
        return renderLoading();
      }
      const admin = v.repo.permissions?.push;
      return `
        ${admin ? `<div class="actions-bar"><button class="btn btn-primary btn-sm" onclick="showCreateReleaseModal()">+ New release</button></div>` : ''}
        ${v.releases.map(r => `
          <div class="card"><div class="card-body">
            <div class="row-between">
              <div>
                <div style="font-weight: 600; font-size: 16px;">${escFast(r.name || r.tag_name)}</div>
                <div class="muted small">${escFast(r.tag_name)} · ${timeAgo(r.published_at || r.created_at)} ${r.prerelease ? '· Pre-release' : ''} ${r.draft ? '· Draft' : ''}</div>
              </div>
              <div class="row">
                <a class="btn btn-sm btn-secondary" href="${escAttr(r.html_url)}" target="_blank" rel="noopener">View</a>
                ${admin ? `<button class="btn btn-sm btn-danger" onclick="deleteRelease(${r.id})">Delete</button>` : ''}
              </div>
            </div>
            ${r.body ? `<div class="markdown" style="margin-top: 10px;">${renderMarkdown(r.body)}</div>` : ''}
            ${r.assets?.length ? `<div class="muted small" style="margin-top: 8px;">${r.assets.map(a => `<a class="link" href="${escAttr(a.browser_download_url)}">${escFast(a.name)}</a> (${formatBytes(a.size)})`).join(' · ')}</div>` : ''}
          </div></div>`).join('') || '<div class="card"><div class="empty-state">No releases yet</div></div>'}`;
    }

    function showCreateReleaseModal() {
      const { branches, repo } = state.viewData;
      showModal('New release', `
        <div class="settings-grid">
          <div class="input-group"><label class="input-label">Tag</label><input class="input" id="relTag" placeholder="v1.0.0"></div>
          <div class="input-group"><label class="input-label">Target branch</label>
            <select class="select" id="relTarget">${(branches || []).map(b => `<option ${b.name === repo.default_branch ? 'selected' : ''}>${escFast(b.name)}</option>`).join('')}</select></div>
        </div>
        <div class="input-group"><label class="input-label">Title</label><input class="input" id="relName"></div>
        <div class="input-group"><label class="input-label">Notes</label><textarea class="textarea" id="relBody"></textarea></div>
        <label class="checkbox-label"><input type="checkbox" id="relAuto" checked> Auto-generate notes from commits</label>
        <label class="checkbox-label"><input type="checkbox" id="relPre"> Pre-release</label>
        <label class="checkbox-label"><input type="checkbox" id="relDraft"> Save as draft</label>`, `
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="createRelease()">Publish release</button>`);
    }

    async function createRelease() {
      const tag = document.getElementById('relTag').value.trim();
      if (!tag) { showToast('A tag is required', 'error'); return; }
      const { owner, name } = state.currentRepo;
      try {
        await state.api.createRelease(owner, name, {
          tag_name: tag, target_commitish: document.getElementById('relTarget').value,
          name: document.getElementById('relName').value.trim() || tag, body: document.getElementById('relBody').value,
          generate_release_notes: document.getElementById('relAuto').checked,
          prerelease: document.getElementById('relPre').checked, draft: document.getElementById('relDraft').checked
        });
        closeModal(); showToast('Release created', 'success');
        state.viewData.releases = null; render();
      } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    async function deleteRelease(id) {
      if (!confirm('Delete this release? The tag stays in the repository.')) return;
      const { owner, name } = state.currentRepo;
      try { await state.api.deleteRelease(owner, name, id); state.viewData.releases = null; render(); showToast('Release deleted', 'success'); }
      catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    // ---------- Settings ----------
    function renderRepoSettings() {
      const v = state.viewData;
      const r = v.repo;
      const { owner, name } = state.currentRepo;
      if (v.pages === undefined) {
        state.api.getPages(owner, name).then(p => { v.pages = p; render(); }).catch(() => { v.pages = null; render(); });
      }
      return `
        <div class="card">
          <div class="card-header">General</div>
          <div class="card-body">
            <div class="settings-grid">
              <div class="input-group"><label class="input-label">Repository name</label><input class="input" id="setName" value="${escAttr(r.name)}"></div>
              <div class="input-group"><label class="input-label">Website</label><input class="input" id="setHomepage" value="${escAttr(r.homepage || '')}" placeholder="https://"></div>
            </div>
            <div class="input-group"><label class="input-label">Description</label><input class="input" id="setDesc" value="${escAttr(r.description || '')}"></div>
            <div class="input-group"><label class="input-label">Topics (comma separated)</label><input class="input" id="setTopics" value="${escAttr((r.topics || []).join(', '))}"></div>
            <div class="settings-grid">
              <div class="input-group"><label class="input-label">Default branch</label>
                <select class="select" id="setDefault">${(v.branches || []).map(b => `<option ${b.name === r.default_branch ? 'selected' : ''}>${escFast(b.name)}</option>`).join('')}</select></div>
              <div class="input-group"><label class="input-label">Features</label>
                <label class="checkbox-label"><input type="checkbox" id="setIssues" ${r.has_issues ? 'checked' : ''}> Issues</label>
                <label class="checkbox-label"><input type="checkbox" id="setWiki" ${r.has_wiki ? 'checked' : ''}> Wiki</label>
                <label class="checkbox-label"><input type="checkbox" id="setDelBranch" ${r.delete_branch_on_merge ? 'checked' : ''}> Delete head branches after merge</label>
              </div>
            </div>
            <button class="btn btn-primary" onclick="saveRepoSettings()">Save changes</button>
          </div>
        </div>

        <div class="card">
          <div class="card-header">GitHub Pages</div>
          <div class="card-body">
            ${v.pages === undefined ? '<div class="skeleton" style="width: 60%;"></div>' : v.pages ? `
              <div class="kv"><span>Status</span><span>${escFast(v.pages.status || 'enabled')}</span></div>
              <div class="kv"><span>URL</span><a class="link" href="${escAttr(v.pages.html_url)}" target="_blank" rel="noopener">${escFast(v.pages.html_url)}</a></div>
              <div class="kv"><span>Source</span><span>${escFast(v.pages.source?.branch || '')} ${escFast(v.pages.source?.path || '')}</span></div>
              <div class="row" style="margin-top: 12px;">
                <button class="btn btn-sm btn-secondary" onclick="showPagesModal(true)">Change source</button>
                <button class="btn btn-sm btn-danger" onclick="disablePages()">Unpublish</button>
              </div>` : `
              <div class="muted small" style="margin-bottom: 10px;">Publish this repo as a website at <code class="inline">${escFast(owner)}.github.io/${escFast(name)}</code>.</div>
              <button class="btn btn-sm btn-primary" onclick="showPagesModal(false)">Enable Pages</button>`}
          </div>
        </div>

        <div class="card danger-zone">
          <div class="card-header">Danger zone</div>
          <div class="list-row">
            <div class="list-row-main"><div class="list-row-title">Change visibility</div><div class="muted small">Currently ${r.private ? 'private' : 'public'}</div></div>
            <button class="btn btn-sm btn-secondary" onclick="setVisibility(${!r.private})">Make ${r.private ? 'public' : 'private'}</button>
          </div>
          <div class="list-row">
            <div class="list-row-main"><div class="list-row-title">${r.archived ? 'Unarchive' : 'Archive'} this repository</div><div class="muted small">${r.archived ? 'Make it writable again' : 'Mark read-only'}</div></div>
            <button class="btn btn-sm btn-secondary" onclick="setArchived(${!r.archived})">${r.archived ? 'Unarchive' : 'Archive'}</button>
          </div>
          <div class="list-row">
            <div class="list-row-main"><div class="list-row-title">Delete this repository</div><div class="muted small">This cannot be undone</div></div>
            <button class="btn btn-sm btn-danger" onclick="deleteThisRepo()">Delete</button>
          </div>
        </div>`;
    }

    async function saveRepoSettings() {
      const { owner, name } = state.currentRepo;
      const data = {
        name: document.getElementById('setName').value.trim(),
        description: document.getElementById('setDesc').value,
        homepage: document.getElementById('setHomepage').value.trim(),
        default_branch: document.getElementById('setDefault').value,
        has_issues: document.getElementById('setIssues').checked,
        has_wiki: document.getElementById('setWiki').checked,
        delete_branch_on_merge: document.getElementById('setDelBranch').checked
      };
      const topics = document.getElementById('setTopics').value.split(',').map(t => t.trim().toLowerCase().replace(/\s+/g, '-')).filter(Boolean);
      try {
        const updated = await state.api.updateRepo(owner, name, data);
        await state.api.replaceTopics(owner, updated.name, topics);
        showToast('Settings saved', 'success');
        state.currentRepo = { owner, name: updated.name };
        state.viewData = null; render();
      } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    async function setVisibility(makePrivate) {
      if (!confirm(`Make ${state.currentRepo.name} ${makePrivate ? 'private' : 'public'}?`)) return;
      const { owner, name } = state.currentRepo;
      try { await state.api.updateRepo(owner, name, { private: makePrivate }); showToast('Visibility updated', 'success'); state.viewData = null; render(); }
      catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    async function setArchived(archived) {
      if (!confirm(`${archived ? 'Archive' : 'Unarchive'} ${state.currentRepo.name}?`)) return;
      const { owner, name } = state.currentRepo;
      try { await state.api.updateRepo(owner, name, { archived }); showToast(archived ? 'Archived' : 'Unarchived', 'success'); state.viewData = null; render(); }
      catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    async function deleteThisRepo() {
      const { owner, name } = state.currentRepo;
      const typed = prompt(`This permanently deletes ${owner}/${name}. Type the repository name to confirm.`);
      if (typed !== name) { if (typed != null) showToast('Name did not match — nothing deleted', 'warning'); return; }
      try { await state.api.deleteRepo(owner, name); showToast('Repository deleted', 'success'); navigate('repos'); }
      catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    function showPagesModal(existing) {
      const { branches, repo } = state.viewData;
      showModal(existing ? 'Pages source' : 'Enable GitHub Pages', `
        <div class="settings-grid">
          <div class="input-group"><label class="input-label">Branch</label>
            <select class="select" id="pagesBranch">${(branches || []).map(b => `<option ${b.name === repo.default_branch ? 'selected' : ''}>${escFast(b.name)}</option>`).join('')}</select></div>
          <div class="input-group"><label class="input-label">Folder</label>
            <select class="select" id="pagesPath"><option value="/">/ (root)</option><option value="/docs">/docs</option></select></div>
        </div>`, `
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="savePages(${existing})">Save</button>`);
    }

    async function savePages(existing) {
      const { owner, name } = state.currentRepo;
      const b = document.getElementById('pagesBranch').value, p = document.getElementById('pagesPath').value;
      try {
        await (existing ? state.api.updatePages(owner, name, b, p) : state.api.enablePages(owner, name, b, p));
        closeModal(); showToast('Pages updated — the first build can take a minute', 'success');
        state.viewData.pages = undefined; render();
      } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    async function disablePages() {
      if (!confirm('Unpublish the GitHub Pages site?')) return;
      const { owner, name } = state.currentRepo;
      try { await state.api.disablePages(owner, name); state.viewData.pages = null; render(); showToast('Pages disabled', 'success'); }
      catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    // =====================================================================
    //  PULL REQUESTS — review diffs, merge, close
    // =====================================================================
    async function loadPull() {
      try {
        const { owner, name, number } = state.currentPull;
        const [pull, files, comments] = await Promise.all([
          state.api.getPull(owner, name, number),
          state.api.getAllPullFiles(owner, name, number),
          state.api.getIssueComments(owner, name, number).catch(() => [])
        ]);
        state.viewData = { pull, files, comments };
        render();
      } catch (e) {
        state.viewData = { fatal: e.message };
        render();
      }
    }

    function renderPull() {
      if (!state.viewData) { loadPull(); return renderLoading(); }
      if (state.viewData.fatal) return `<div class="card"><div class="empty-state">Failed to load pull request: ${escFast(state.viewData.fatal)}</div></div>`;
      const { pull, files, comments } = state.viewData;
      const { owner, name } = state.currentPull;
      const st = pull.merged ? 'merged' : pull.state;
      const adds = files.reduce((a, f) => a + f.additions, 0), dels = files.reduce((a, f) => a + f.deletions, 0);
      const isRequest = (pull.labels || []).some(l => l.name === CR_LABEL);
      const mergeState = pull.mergeable === false ? 'conflicts' : pull.mergeable_state;
      return `
        <div class="breadcrumb">
          <span class="breadcrumb-item" onclick="openRepo(${jsArg(owner)}, ${jsArg(name)}); state.repoTab='pulls'">${escFast(name)}</span>
          <span class="breadcrumb-separator">/</span><span>#${pull.number}</span>
        </div>
        <div class="card"><div class="card-body">
          <h2 style="margin-bottom: 8px; font-size: 20px; word-break: break-word;">${escFast(pull.title)} <span class="muted">#${pull.number}</span></h2>
          <div class="row" style="margin-bottom: 12px;">
            <span class="pr-status ${st}">${st}</span>
            ${pull.draft ? '<span class="status-pill outline">Draft</span>' : ''}
            ${isRequest ? '<span class="status-pill outline">Change request</span>' : ''}
            <span class="muted small">${escFast(pull.user.login)} wants to merge <code class="inline">${escFast(pull.head.label)}</code> into <code class="inline">${escFast(pull.base.ref)}</code></span>
          </div>
          ${pull.body ? `<div class="markdown">${renderMarkdown(pull.body)}</div>` : '<div class="muted small">No description provided.</div>'}
          <div class="diff-stat" style="margin-top: 12px;">${plural(files.length, 'file')} · ${plural(pull.commits, 'commit')} · <span class="a">+${adds}</span> <span class="d">−${dels}</span></div>
        </div></div>

        <h3 style="margin: 16px 0 12px; font-size: 16px;">Files changed</h3>
        ${files.map((f, i) => renderPatchFile(f, i < 10)).join('') || '<div class="card"><div class="empty-state">No file changes</div></div>'}

        <h3 style="margin: 16px 0 12px; font-size: 16px;">Conversation (${comments.length})</h3>
        ${comments.map(c => `
          <div class="card"><div class="card-body">
            <div class="row" style="margin-bottom: 8px;"><img src="${escAttr(c.user.avatar_url)}" style="width: 24px; height: 24px; border-radius: 50%;" alt=""><strong>${escFast(c.user.login)}</strong><span class="muted small">${timeAgo(c.created_at)}</span></div>
            <div class="markdown">${renderMarkdown(c.body)}</div>
          </div></div>`).join('')}
        <div class="card"><div class="card-body">
          <textarea class="textarea" id="commentBody" placeholder="Leave a comment…"></textarea>
          <button class="btn btn-secondary" style="margin-top: 12px;" onclick="addPullComment()">Comment</button>
        </div></div>

        ${pull.state === 'open' ? `
          <div class="sticky-actions">
            ${mergeState === 'conflicts' ? '<span class="muted small">This branch has conflicts — resolve them on GitHub.</span>' : ''}
            <button class="btn btn-primary" onclick="showMergeModal()" ${mergeState === 'conflicts' || pull.draft ? 'disabled' : ''}>Merge…</button>
            ${pull.draft ? `<button class="btn btn-secondary" onclick="markReady()">Ready for review</button>` : ''}
            <span class="spacer"></span>
            <button class="btn btn-danger btn-sm" onclick="setPullState('closed')">Close</button>
          </div>` : pull.merged ? '' : `
          <div class="sticky-actions"><span class="muted small">Closed without merging.</span><span class="spacer"></span><button class="btn btn-secondary btn-sm" onclick="setPullState('open')">Reopen</button></div>`}`;
    }

    function showMergeModal() {
      const { pull } = state.viewData;
      showModal(`Merge #${pull.number}`, `
        <div class="input-group"><label class="input-label">Merge method</label>
          <select class="select" id="mergeMethod">
            <option value="merge">Create a merge commit</option>
            <option value="squash" selected>Squash and merge</option>
            <option value="rebase">Rebase and merge</option>
          </select></div>
        <div class="input-group"><label class="input-label">Commit title</label><input class="input" id="mergeTitle" value="${escAttr(`${pull.title} (#${pull.number})`)}"></div>
        <label class="checkbox-label"><input type="checkbox" id="mergeDeleteBranch" ${pull.head.repo?.full_name === pull.base.repo.full_name ? 'checked' : 'disabled'}> Delete <code class="inline">${escFast(pull.head.ref)}</code> after merging</label>`, `
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="mergeBtn" onclick="mergePull()">Confirm merge</button>`);
    }

    async function mergePull() {
      const { owner, name, number } = state.currentPull;
      const { pull } = state.viewData;
      const btn = document.getElementById('mergeBtn');
      btn.disabled = true; btn.textContent = 'Merging…';
      try {
        const method = document.getElementById('mergeMethod').value;
        await state.api.mergePull(owner, name, number, { merge_method: method, commit_title: method === 'rebase' ? undefined : document.getElementById('mergeTitle').value });
        if (document.getElementById('mergeDeleteBranch').checked) await state.api.deleteBranch(owner, name, pull.head.ref).catch(() => {});
        closeModal();
        showToast('Pull request merged', 'success');
        state.viewData = null; state.requests = null; render(); refreshRequestBadge();
      } catch (e) { btn.disabled = false; btn.textContent = 'Confirm merge'; showToast('Merge failed: ' + e.message, 'error'); }
    }

    async function setPullState(s) {
      const { owner, name, number } = state.currentPull;
      try { await state.api.updatePull(owner, name, number, { state: s }); showToast(s === 'closed' ? 'Pull request closed' : 'Reopened', 'success'); state.viewData = null; render(); refreshRequestBadge(); }
      catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    async function markReady() {
      // Draft → ready needs GraphQL; fall back to GitHub
      window.open(state.viewData.pull.html_url, '_blank', 'noopener');
    }

    async function addPullComment() {
      const body = document.getElementById('commentBody').value.trim();
      if (!body) return;
      const { owner, name, number } = state.currentPull;
      try { await state.api.createIssueComment(owner, name, number, body); state.viewData = null; render(); showToast('Comment added', 'success'); }
      catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    // =====================================================================
    //  ISSUES — markdown, close / reopen, labels
    // =====================================================================
    function renderIssue() {
      if (!state.viewData) { loadIssue(); return renderLoading(); }
      const { issue, comments } = state.viewData;
      const { owner, name } = state.currentIssue;
      return `
        <div class="breadcrumb">
          <span class="breadcrumb-item" onclick="openRepo(${jsArg(owner)}, ${jsArg(name)}); state.repoTab='issues'">${escFast(name)}</span>
          <span class="breadcrumb-separator">/</span><span>#${issue.number}</span>
        </div>
        <div class="card"><div class="card-body">
          <h2 style="margin-bottom: 8px; font-size: 20px; word-break: break-word;">${escFast(issue.title)} <span class="muted">#${issue.number}</span></h2>
          <div class="row" style="margin-bottom: 12px;">
            <span class="pr-status ${issue.state}">${issue.state}</span>
            <span class="muted small">${escFast(issue.user.login)} opened this ${timeAgo(issue.created_at)}</span>
            ${(issue.labels || []).map(l => `<span class="topic" style="background: #${l.color}33; color: #${l.color};">${escFast(l.name)}</span>`).join('')}
          </div>
          ${issue.body ? `<div class="markdown">${renderMarkdown(issue.body)}</div>` : '<div class="muted small">No description provided.</div>'}
        </div></div>
        <h3 style="margin: 16px 0; font-size: 16px;">Comments (${comments?.length || 0})</h3>
        ${(comments || []).map(c => `
          <div class="card"><div class="card-body">
            <div class="row" style="margin-bottom: 8px;"><img src="${escAttr(c.user.avatar_url)}" style="width: 24px; height: 24px; border-radius: 50%;" alt=""><strong>${escFast(c.user.login)}</strong><span class="muted small">${timeAgo(c.created_at)}</span></div>
            <div class="markdown">${renderMarkdown(c.body)}</div>
          </div></div>`).join('')}
        <div class="card" style="margin-top: 16px;"><div class="card-body">
          <textarea class="textarea" id="commentBody" placeholder="Leave a comment…"></textarea>
          <div class="row" style="margin-top: 12px;">
            <button class="btn btn-primary" onclick="addComment()">Comment</button>
            <button class="btn btn-secondary" onclick="setIssueState(${jsArg(issue.state === 'open' ? 'closed' : 'open')})">${issue.state === 'open' ? 'Close issue' : 'Reopen issue'}</button>
            <button class="btn btn-secondary" onclick="editIssueLabels()">Labels</button>
          </div>
        </div></div>`;
    }

    async function setIssueState(s) {
      const { owner, name, number } = state.currentIssue;
      try {
        const body = document.getElementById('commentBody')?.value.trim();
        if (body) await state.api.createIssueComment(owner, name, number, body);
        await state.api.request(`/repos/${owner}/${name}/issues/${number}`, { method: 'PATCH', body: JSON.stringify({ state: s }) });
        showToast(s === 'closed' ? 'Issue closed' : 'Issue reopened', 'success');
        state.viewData = null; render();
      } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    function editIssueLabels() {
      const cur = (state.viewData.issue.labels || []).map(l => l.name).join(', ');
      const v = prompt('Labels (comma separated):', cur);
      if (v == null) return;
      const labels = v.split(',').map(s => s.trim()).filter(Boolean);
      const { owner, name, number } = state.currentIssue;
      state.api.request(`/repos/${owner}/${name}/issues/${number}/labels`, { method: 'PUT', body: JSON.stringify({ labels }) })
        .then(() => { state.viewData = null; render(); showToast('Labels updated', 'success'); })
        .catch(e => showToast('Failed: ' + e.message, 'error'));
    }

    // =====================================================================
    //  FILE VIEW — branch-aware, edit → commit now OR stage for later
    // =====================================================================
    function renderFile() {
      if (!state.viewData) return renderLoading();
      const { file } = state.viewData;
      const { owner, name, path } = state.currentFile;
      const text = base64ToUtf8((file.content || '').replace(/\n/g, ''));
      const lines = text.split('\n');
      const parts = path.split('/');
      const staged = state.staged.find(s => s.owner === owner && s.repo === name && s.branch === state.currentBranch && s.path === path);
      return `
        <div class="breadcrumb">
          <span class="breadcrumb-item" onclick="backToRepoPath([])">${escFast(name)}</span>
          ${parts.slice(0, -1).map((p, i) => `<span class="breadcrumb-separator">/</span><span class="breadcrumb-item" onclick="backToRepoPath(${jsArg(parts.slice(0, i + 1))})">${escFast(p)}</span>`).join('')}
          <span class="breadcrumb-separator">/</span><span>${escFast(file.name)}</span>
        </div>
        ${state.currentBranch ? `<div class="branch-bar">${ICONS.branch}<span class="muted small" style="font-family: monospace;">${escFast(state.currentBranch)}</span></div>` : ''}
        ${staged ? `<div class="staged-banner"><span>You have a staged edit for this file.</span><button class="btn btn-sm btn-primary" onclick="openStagedRequest(${jsArg(`${owner}/${name}@${state.currentBranch}`)})">Review &amp; push</button></div>` : ''}
        <div class="code-viewer">
          <div class="code-header" style="flex-wrap: wrap; gap: 8px;">
            <span>${lines.length} lines • ${formatBytes(file.size)}</span>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
              <button class="btn btn-sm btn-secondary" onclick="editFile()">Edit</button>
              <button class="btn btn-sm btn-secondary" onclick="showFileHistory()">History</button>
              <button class="btn btn-sm btn-secondary" onclick="copyText(${jsArg(text)})">Copy</button>
              <button class="btn btn-sm btn-secondary" onclick="showRenameModalFromAttr(this)" data-rename='${escAttr(JSON.stringify({ type: 'file', name: file.name, path, sha: file.sha, folderPath: null }))}'>Rename</button>
              <button class="btn btn-sm btn-secondary" onclick="downloadCurrentFile()">Download</button>
              <button class="btn btn-sm btn-danger" onclick="deleteCurrentFile()">Delete</button>
            </div>
          </div>
          <div class="code-content">
            ${lines.map((l, i) => `<div class="code-line"><span class="line-number">${i + 1}</span><span class="line-content">${escFast(l)}</span></div>`).join('')}
          </div>
        </div>`;
    }

    function backToRepoPath(path) {
      state.currentView = 'repo';
      state.repoTab = 'code';
      state.currentPath = path;
      state.viewData = null;
      render();
    }

    function editFile() {
      const { file } = state.viewData;
      const { owner, name, path } = state.currentFile;
      const staged = state.staged.find(s => s.owner === owner && s.repo === name && s.branch === state.currentBranch && s.path === path);
      const content = staged ? staged.content : base64ToUtf8((file.content || '').replace(/\n/g, ''));
      showModal(`Edit ${escFast(file.name)}`, `
        ${staged ? '<div class="info-banner" style="margin: 0 0 12px;">Showing your staged version.</div>' : ''}
        <div class="input-group">
          <textarea class="textarea" id="editFileContent" style="min-height: 320px; font-family: monospace; font-size: 12px;">${escFast(content)}</textarea>
        </div>
        <div class="input-group">
          <label class="input-label">Commit message</label>
          <input type="text" class="input" id="editCommitMessage" placeholder="Update ${escAttr(file.name)}">
        </div>
        <div class="muted small">Stage to batch several file edits into one commit — review them later under Requests.</div>
      `, `
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-secondary" onclick="stageFileEdit()">Stage</button>
        <button class="btn btn-primary" onclick="saveFile()">Commit to ${escFast(state.currentBranch || 'branch')}</button>
      `);
      document.querySelector('.modal')?.classList.add('modal-lg');
    }

    function stageFileEdit() {
      const content = document.getElementById('editFileContent').value;
      const { owner, name, path } = state.currentFile;
      stageChange({ owner, repo: name, branch: state.currentBranch, path, action: 'update', content, baseSha: state.viewData.file.sha });
      updateRequestCount();
      closeModal();
      showToast('Staged — push it from Requests or the repo banner', 'success');
      render();
    }

    async function saveFile() {
      const content = document.getElementById('editFileContent')?.value ?? '';
      const message = document.getElementById('editCommitMessage')?.value.trim() || `Update ${state.currentFile.path}`;
      const btn = document.querySelector('.modal-footer .btn-primary');
      if (btn) { btn.disabled = true; btn.textContent = 'Committing…'; }
      try {
        const { owner, name, path } = state.currentFile;
        await state.api.createOrUpdateFile(owner, name, path, { message, content: utf8ToBase64(content), sha: state.viewData.file.sha });
        state.staged = state.staged.filter(s => !(s.owner === owner && s.repo === name && s.branch === state.currentBranch && s.path === path));
        saveStaged(); updateRequestCount();
        closeModal();
        showToast('File updated', 'success');
        state.viewData = null;
        openFile(owner, name, path);
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Commit'; }
      }
    }

    async function showFileHistory() {
      const { owner, name, path } = state.currentFile;
      try {
        const commits = await state.api.getCommits(owner, name, { path, per_page: 20, ...(state.currentBranch ? { sha: state.currentBranch } : {}) });
        showModal('File history', `
          <div class="card" style="margin: 0;">
            ${commits.map(c => `
              <div class="commit-item clickable" onclick="closeModal(); openCommit(${jsArg(owner)}, ${jsArg(name)}, ${jsArg(c.sha)})">
                <div class="commit-message">${escFast(c.commit.message.split('\n')[0])}</div>
                <div class="commit-meta"><span>${escFast(c.commit.author.name)}</span><span>•</span><span>${timeAgo(c.commit.author.date)}</span><span>•</span><span class="sha">${c.sha.slice(0, 7)}</span></div>
              </div>`).join('') || '<div class="empty-state">No history</div>'}
          </div>`, `<button class="btn btn-secondary" onclick="closeModal()">Close</button>`);
      } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    // =====================================================================
    //  NOTIFICATIONS — mark read
    // =====================================================================
    async function deleteCurrentFile() {
      if (!confirm('Delete this file?')) return;
      try {
        const { owner, name, path } = state.currentFile;
        await state.api.deleteFile(owner, name, path, { message: `Delete ${path}`, sha: state.viewData.file.sha });
        showToast('File deleted', 'success');
        backToRepoPath(path.split('/').slice(0, -1));
      } catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    async function signIn() {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token) { showToast('Please enter a token', 'error'); return; }
      state.token = token;
      state.api = new GitHubAPI(token);
      try {
        state.user = await state.api.getUser();
        safeStorage.set('github_token', token);
        showToast('Signed in successfully', 'success');
        render();
        startBackgroundRefresh();
      } catch (e) {
        state.token = null; state.api = null;
        showToast('Invalid token: ' + e.message, 'error');
      }
    }

    // =====================================================================
    //  BOOT
    // =====================================================================
    function startBackgroundRefresh() {
      if (state._bg) return;
      state._bg = true;
      refreshRateLimit().then(() => { if (!document.querySelector('.modal-overlay')) {} });
      setTimeout(refreshRequestBadge, 400);
      setInterval(() => { if (document.visibilityState === 'visible') { refreshRequestBadge(); refreshRateLimit(); } }, 90000);
    }

    async function loadUser() {
      try {
        state.user = await state.api.getUser();
        updateRequestCount();
        render();
        startBackgroundRefresh();
      } catch (e) {
        showToast('Failed to load user: ' + e.message, 'error');
        signOut();
      }
    }

    // Deep link: #requests or #request/<id>
    (function handleHash() {
      const h = location.hash.replace(/^#/, '');
      if (h === 'requests') state.currentView = 'requests';
      else if (h.startsWith('request/')) { state.currentView = 'request'; state.currentRequest = { id: decodeURIComponent(h.slice(8)) }; }
    })();

    function renderNotifications() {
      if (!state.viewData) { loadNotifications(); return renderLoading(); }
      const list = Array.isArray(state.viewData) ? state.viewData : [];
      return `
        <div class="row-between" style="margin-bottom: 12px;">
          <span class="muted small">${plural(list.length, 'unread notification')}</span>
          ${list.length ? '<button class="btn btn-sm btn-secondary" onclick="markAllRead()">Mark all as read</button>' : ''}
        </div>
        <div class="card">
          ${list.map(n => `
            <div class="notification-item" style="cursor: pointer;" onclick="openNotification(${jsArg(n.id)}, ${jsArg(n.repository.full_name)}, ${jsArg(n.subject.type)}, ${jsArg(n.subject.url || '')})">
              <div class="notification-icon" style="background: var(--bg-tertiary);">${n.subject.type === 'PullRequest' ? '🔀' : n.subject.type === 'Issue' ? '🔴' : n.subject.type === 'Release' ? '🏷' : '🔔'}</div>
              <div class="notification-content" style="flex: 1; min-width: 0;">
                <div class="notification-title">${escFast(n.subject.title)}</div>
                <div class="notification-repo">${escFast(n.repository.full_name)} · ${escFast(n.reason.replace(/_/g, ' '))} · ${timeAgo(n.updated_at)}</div>
              </div>
              <button class="btn btn-sm btn-secondary" onclick="event.stopPropagation(); markThread(${jsArg(n.id)})" title="Mark as read">✓</button>
            </div>`).join('') || '<div class="empty-state">No unread notifications</div>'}
        </div>`;
    }

    function openNotification(id, full, type, url) {
      state.api.markThreadRead(id).catch(() => {});
      const [o, n] = full.split('/');
      const num = +(url.match(/\/(\d+)$/) || [])[1];
      if (type === 'PullRequest' && num) return openPull(o, n, num);
      if (type === 'Issue' && num) return openIssue(o, n, num);
      openRepo(o, n);
    }

    async function markThread(id) {
      try { await state.api.markThreadRead(id); state.viewData = state.viewData.filter(n => n.id !== id); render(); }
      catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    async function markAllRead() {
      try { await state.api.markAllNotificationsRead(); showToast('All notifications marked as read', 'success'); state.viewData = []; render(); }
      catch (e) { showToast('Failed: ' + e.message, 'error'); }
    }

    // Initialize
    render();

  </script>
</body>

</html>
