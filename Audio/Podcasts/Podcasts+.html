t=Date.now(); saveState(); renderHome(); } } });audio.addEventListener('play',()=>{ state.isPlaying=true; updatePlayIcons(); });audio.addEventListener('pause',()=>{ state.isPlaying=false; updatePlayIcons(); saveState(); });function openFullPlayer(){ $('full-player').classList.add('open'); }function closeFullPlayer(){ $('full-player').classList.remove('open'); }function cycleSpeed(){ const idx=SPEEDS.indexOf(state.speed); state.speed=SPEEDS[(idx+1)%SPEEDS.length]; audio.playbackRate=state.speed; $('fp-speed-btn').textContent=state.speed+'x'; saveState(); renderSpeedOptions(); }async function downloadSingleEpisode(i){  const ep=state.currentEpisodes[i]; if(!ep) return;  const btn=document.getElementById('ep-dl-'+i); if(btn) btn.innerHTML='<i class="fas fa-circle-notch spinner"></i>';  try{    const res=await fetch(ep.url,{mode:'cors'});    if(!res.ok) throw new Error('fetch '+res.status);    const blob=await res.blob();    const ext=getAudioExt(ep.url);    const fileName=sanitize(ep.title)+'.'+ext;    if('showSaveFilePicker' in window){      try{        const h=await window.showSaveFilePicker({suggestedName:fileName,startIn:'downloads',types:[{description:'Audio',accept:{'audio/*':['.'+ext,'.mp3','.m4a']}}]});        const w=await h.createWritable(); await w.write(blob); await w.close();      }catch(e){        if(e.name==='AbortError') throw e;        const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);      }    }else{      const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);    }    if(btn) btn.innerHTML='<i class="fas fa-circle-check"></i>';    state.downloads.unshift({episodeTitle:ep.title,podcastTitle:state.currentPodcast?.title||'',url:ep.url,date:new Date().toISOString()}); saveState(); renderSettings();    setTimeout(()=>{ if(btn) btn.innerHTML='<i class="fas fa-circle-down"></i>'; },2000);  }catch(e){    if(e.name==='AbortError'){ if(btn) btn.innerHTML='<i class="fas fa-circle-down"></i>'; return; }    if(btn) btn.innerHTML='<i class="fas fa-circle-xmark"></i>';    setTimeout(()=>{ if(btn) btn.innerHTML='<i class="fas fa-circle-down"></i>'; },2000);  }}async function downloadAllPodcast(){  if(!state.currentPodcast||state.currentEpisodes.length===0) return;  if(!('showDirectoryPicker' in window)){    for(let i=0;i<state.currentEpisodes.length;i++){ await downloadSingleEpisode(i); }    return;  }  const total=state.currentEpisodes.length; state.downloadAllCancelled=false;  $('dl-modal-title').textContent='Downloading'; $('dl-modal-sub').textContent='0 of '+total; $('dl-modal-fill').style.width='0%'; $('dl-modal-detail').textContent='Starting...'; $('download-modal').classList.add('visible');  try{    const dir=await window.showDirectoryPicker({id:'podflow-downloads',startIn:'downloads',mode:'readwrite'});    const pod=await dir.getDirectoryHandle(sanitize(state.currentPodcast.title),{create:true});    let c=0,f=0;    for(let i=0;i<total;i++){      if(state.downloadAllCancelled) break;      const ep=state.currentEpisodes[i]; $('dl-modal-detail').textContent=ep.title; $('dl-modal-sub').textContent=(i+1)+' of '+total;      try{ const res=await fetch(ep.url,{mode:'cors'}); if(!res.ok) throw new Error(); const blob=await res.blob(); const ext=getAudioExt(ep.url); const fh=await pod.getFileHandle(sanitize(ep.title)+'.'+ext,{create:true}); const w=await fh.createWritable(); await w.write(blob); await w.close(); c++; state.downloads.unshift({episodeTitle:ep.title,podcastTitle:state.currentPodcast.title,url:ep.url,date:new Date().toISOString()}); }catch(e){ f++; }      $('dl-modal-fill').style.width=((i+1)/total*100)+'%';    }    saveState(); renderSettings(); $('dl-modal-title').textContent=state.downloadAllCancelled?'Cancelled':'Complete'; $('dl-modal-sub').textContent=c+' saved to Downloads'+(f?', '+f+' failed':''); $('dl-modal-cancel').textContent='Done';  }catch(err){ if(err.name==='AbortError') $('download-modal').classList.remove('visible'); else { $('dl-modal-title').textContent='Failed'; $('dl-modal-sub').textContent=err.message; $('dl-modal-cancel').textContent='Close'; } }}function cancelDownloadAll(){ state.downloadAllCancelled=true; $('download-modal').classList.remove('visible'); $('dl-modal-cancel').textContent='Cancel'; }async function redoDownload(i){  const dl=state.downloads[i]; if(!dl) return;  try{    const res=await fetch(dl.url,{mode:'cors'}); if(!res.ok) throw new Error(); const blob=await res.blob(); const ext=getAudioExt(dl.url); const fn=sanitize(dl.episodeTitle)+'.'+ext;    if('showSaveFilePicker' in window){      try{        const h=await window.showSaveFilePicker({suggestedName:fn,startIn:'downloads',types:[{description:'Audio',accept:{'audio/*':['.'+ext]}}]});        const w=await h.createWritable(); await w.write(blob); await w.close();      }catch(e){        const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);      }    }else{ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); }  }catch(e){}}function clearDownloads(){ state.downloads=[]; saveState(); renderSettings(); }function renderSpeedOptions(){ $('speed-options').innerHTML=SPEEDS.map(s=>`<button class="speed-opt ${s===state.speed?'active':''}" onclick="setSpeed(${s})">${s}x</button>`).join(''); }function setSpeed(s){ state.speed=s; audio.playbackRate=s; $('fp-speed-btn').textContent=s+'x'; saveState(); renderSpeedOptions(); }function clearSearchHistory(){ state.searchHistory=[]; saveState(); renderHome(); }function clearFollows(){ state.follows=[]; state.followingCache=[]; state.recommendations=[]; saveState(); renderHome(); renderSettings(); }function clearProgress(){ state.progress={}; state.recommendations=[]; saveState(); renderHome(); renderSettings(); }renderSpeedOptions(); renderHome(); renderSettings(); ensurePlayerPadding(); loadExplore();</script></body></html>
