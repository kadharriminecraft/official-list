<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GIFs</title>
<style>
  :root{
    --bg:#0a0a0f;
    --bg-elev:#13131c;
    --bg-elev-2:#1c1c28;
    --border:#262633;
    --text:#f4f4f8;
    --text-dim:#a0a0b8;
    --text-faint:#66667a;
    --accent:#ff3864;
    --accent-2:#7b5cff;
    --accent-3:#00d9c0;
    --success:#22c55e;
    --warning:#f59e0b;
    --error:#ef4444;
    --radius:14px;
    --radius-sm:10px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --nav-h:58px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
    display:flex;flex-direction:column;
    user-select:none;-webkit-user-select:none;
  }
  button{font-family:inherit}
  input{user-select:text;-webkit-user-select:text}
  .app{max-width:720px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;min-height:0}

  /* ---------- Header ---------- */
  header{
    background:rgba(10,10,15,.85);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--border);
    padding:10px 12px 10px;flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .logo{
    width:26px;height:26px;border-radius:7px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;font-size:11px;letter-spacing:-.5px;
    box-shadow:0 4px 12px rgba(255,56,100,.4);
  }
  .brand h1{font-size:17px;font-weight:700;letter-spacing:-.4px}
  .brand .status{
    margin-left:auto;font-size:10px;font-weight:700;
    color:var(--success);display:flex;align-items:center;gap:5px;
    text-transform:uppercase;letter-spacing:.5px;
  }
  .brand .status .dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
  .brand .status.loading{color:var(--warning)}
  .brand .status.loading .dot{background:var(--warning);animation:pulse 1s infinite}
  .brand .status.error{color:var(--error)}
  .brand .status.error .dot{background:var(--error)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .search-wrap{position:relative;display:flex;gap:6px}
  .search-wrap.gone{display:none}
  .search-input-wrap{position:relative;flex:1}
  .search-input-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--text-faint);pointer-events:none}
  #searchInput{
    width:100%;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
    padding:11px 32px 11px 36px;border-radius:11px;
    font-size:16px;outline:none;transition:border-color .15s,background .15s;
    -webkit-appearance:none;appearance:none;
  }
  #searchInput:focus{border-color:var(--accent);background:var(--bg-elev-2)}
  #searchInput::placeholder{color:var(--text-faint)}
  #searchInput::-webkit-search-cancel-button{display:none}
  .clear-btn{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border-radius:50%;
    background:var(--bg-elev-2);border:none;color:var(--text-dim);
    display:none;align-items:center;justify-content:center;cursor:pointer;font-size:13px;
  }
  .clear-btn.visible{display:flex}

  /* Category detail header row (replaces search on that page) */
  .detail-bar{display:none;align-items:center;gap:10px}
  .detail-bar.visible{display:flex}
  .back-btn{
    width:36px;height:36px;border-radius:50%;flex:0 0 auto;
    background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .12s;
  }
  .back-btn svg{width:17px;height:17px;margin-right:1px}
  .back-btn:active{transform:scale(.88)}
  .detail-emoji{font-size:21px;line-height:1}
  .detail-title{
    flex:1;font-size:17px;font-weight:700;letter-spacing:-.3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* ---------- Scroll area ---------- */
  .scroll-area{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:8px 8px 24px;
    position:relative;
  }
  .scroll-area::-webkit-scrollbar{width:0}

  /* ---------- GIF feed grid (masonry) ---------- */
  .grid{
    column-count:2;
    column-gap:6px;
  }
  @media(min-width:480px){.grid{column-count:3}}
  @media(min-width:720px){.grid{column-count:4}}

  /* Empty / message states: truly centered */
  .grid.empty{
    column-count:auto;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    min-height:min(62vh,520px);
    text-align:center;padding:0 24px;
  }

  /* Liked grid: centered flex-wrap collection */
  .grid.liked-grid{
    column-count:auto;
    display:flex;flex-wrap:wrap;gap:6px;
    justify-content:center;align-items:flex-start;
  }
  .liked-grid .gif-card{width:calc(50% - 3px);margin-bottom:0}
  @media(min-width:420px){.liked-grid .gif-card{width:calc(33.333% - 4px)}}
  @media(min-width:640px){.liked-grid .gif-card{width:calc(25% - 5px)}}
  .liked-count{
    width:100%;text-align:center;
    color:var(--text-faint);font-size:10.5px;font-weight:700;
    letter-spacing:.8px;text-transform:uppercase;
    padding:8px 0 12px;
  }

  .gif-card{
    break-inside:avoid;
    margin-bottom:6px;
    position:relative;overflow:hidden;
    border-radius:8px;background:var(--bg-elev);cursor:pointer;
    transition:transform .12s;
  }
  .gif-card:active{transform:scale(.97)}
  .gif-card img{
    width:100%;height:auto;display:block;
    background:var(--bg-elev-2);
  }
  .gif-card .play-icon{
    position:absolute;bottom:5px;right:5px;
    width:18px;height:18px;border-radius:50%;
    background:rgba(0,0,0,.55);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .gif-card .play-icon svg{width:9px;height:9px;color:#fff;margin-left:1px}
  .gif-card .play-icon.hidden{display:none}
  .gif-card .heart-badge{
    position:absolute;top:5px;right:5px;
    width:20px;height:20px;border-radius:50%;
    background:rgba(255,56,100,.9);backdrop-filter:blur(8px);
    display:none;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .gif-card .heart-badge svg{width:10px;height:10px;color:#fff}
  .gif-card.liked .heart-badge{display:flex}

  .skeleton{
    break-inside:avoid;margin-bottom:6px;border-radius:8px;
    background:linear-gradient(90deg,var(--bg-elev) 25%,var(--bg-elev-2) 50%,var(--bg-elev) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s infinite;
  }
  .skeleton:nth-child(3n){height:140px}
  .skeleton:nth-child(3n+1){height:200px}
  .skeleton:nth-child(3n+2){height:100px}
  @keyframes shimmer{
    0%{background-position:200% 0}
    100%{background-position:-200% 0}
  }

  .empty-state{text-align:center;color:var(--text-faint)}
  .empty-state svg{width:44px;height:44px;margin:0 auto 14px;opacity:.45;display:block}
  .empty-state .empty-icon{
    width:78px;height:78px;border-radius:50%;
    background:rgba(255,56,100,.08);border:1px solid rgba(255,56,100,.22);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;
  }
  .empty-state .empty-icon svg{width:34px;height:34px;margin:0;opacity:1;color:var(--accent)}
  .empty-state h3{font-size:15px;color:var(--text-dim);margin-bottom:6px;font-weight:600}
  .empty-state p{font-size:13px;line-height:1.55;max-width:260px;margin:0 auto}
  .empty-state .retry-btn{
    margin-top:16px;background:var(--accent);color:#fff;border:none;
    padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .empty-state .retry-btn:active{transform:scale(.96)}

  /* Full-width rows inside the masonry flow */
  .inline-loader{
    column-span:all;
    display:flex;justify-content:center;align-items:center;
    padding:16px 0;color:var(--text-faint);font-size:12px;gap:8px;
  }
  .inline-loader .spinner{
    width:18px;height:18px;border:2px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .end-marker{
    column-span:all;text-align:center;padding:16px 0;color:var(--text-faint);font-size:11px;
  }
  .end-marker .line{display:inline-block;width:24px;height:1px;background:var(--border);vertical-align:middle;margin:0 8px}

  .related-pill{
    column-span:all;
    text-align:center;padding:14px 0 6px;
    color:var(--text-faint);font-size:10.5px;
  }
  .related-pill .pill-inner{
    display:inline-block;background:var(--bg-elev);border:1px solid var(--border);
    padding:4px 12px;border-radius:12px;color:var(--accent-3);font-weight:600;letter-spacing:.3px;
  }

  /* ---------- Categories page (dedicated full page) ---------- */
  .grid.cat-page{
    column-count:auto;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
    gap:10px;padding:4px 2px 10px;
    animation:pagein .22s ease;
  }
  @keyframes pagein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .cat-page-head{
    grid-column:1/-1;display:flex;align-items:baseline;gap:8px;
    padding:4px 2px 4px;
  }
  .cat-page-head h2{font-size:16px;font-weight:700;letter-spacing:-.3px}
  .cat-page-head span{font-size:11px;color:var(--text-faint);font-weight:600}
  .cat-tile{
    height:106px;border-radius:var(--radius);border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    color:#fff;
    box-shadow:0 6px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18);
    transition:transform .12s,filter .12s;
    text-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .cat-tile:active{transform:scale(.94);filter:brightness(1.12)}
  .cat-tile .emoji{font-size:31px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
  .cat-tile .label{
    font-size:12px;font-weight:700;letter-spacing:.2px;
    max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* ---------- Bottom navigation ---------- */
  .bottom-nav{
    flex-shrink:0;display:flex;
    background:rgba(10,10,15,.9);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:1px solid var(--border);
    padding:6px 10px calc(6px + var(--safe-bottom));
    z-index:50;
  }
  .nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:7px 0 3px;background:none;border:none;
    color:var(--text-faint);font-size:10px;font-weight:600;letter-spacing:.2px;
    cursor:pointer;position:relative;
    transition:color .18s,transform .12s;
  }
  .nav-item svg{width:22px;height:22px}
  .nav-item:active{transform:scale(.9)}
  .nav-item.active{color:var(--accent)}
  .nav-item.active svg{filter:drop-shadow(0 0 7px rgba(255,56,100,.55))}
  .nav-item .badge{
    position:absolute;top:1px;right:calc(50% - 26px);
    background:var(--accent);color:#fff;
    font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;
    min-width:16px;text-align:center;
    box-shadow:0 2px 8px rgba(255,56,100,.5);
    display:none;
  }
  .nav-item .badge.visible{display:block}

  /* ---------- Fullscreen viewer ---------- */
  .viewer{
    position:fixed;inset:0;z-index:100;
    background:rgba(0,0,0,.96);
    display:none;align-items:center;justify-content:center;
    animation:fadein .2s ease;
    -webkit-touch-callout:none;
  }
  .viewer.visible{display:flex}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .viewer-img{
    max-width:100%;max-height:100%;width:100%;height:100%;
    object-fit:contain;display:block;
    touch-action:none;will-change:transform;
  }
  .viewer.visible .viewer-img{animation:viewerPop .22s cubic-bezier(.22,1,.36,1)}
  @keyframes viewerPop{from{transform:scale(.94);opacity:.5}to{transform:scale(1);opacity:1}}
  .viewer-close{
    position:absolute;top:calc(12px + var(--safe-top));right:12px;z-index:2;
    width:38px;height:38px;border-radius:50%;
    background:rgba(0,0,0,.5);backdrop-filter:blur(10px);
    border:none;color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .viewer-close svg{width:18px;height:18px}
  .viewer-heart{
    position:absolute;bottom:calc(20px + var(--safe-bottom));left:50%;
    transform:translateX(-50%);z-index:2;
    display:flex;gap:10px;align-items:center;
  }
  .viewer-heart-btn{
    width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,.1);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.15);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .viewer-heart-btn:active{transform:scale(.92)}
  .viewer-heart-btn svg{width:24px;height:24px}
  .viewer-heart-btn.liked{background:var(--accent);border-color:var(--accent)}
  .viewer-heart-btn.liked svg{fill:#fff;color:#fff;animation:heartbeat .4s ease}
  @keyframes heartbeat{0%{transform:scale(1)}30%{transform:scale(1.3)}60%{transform:scale(.95)}100%{transform:scale(1)}}
  .viewer-title{
    position:absolute;bottom:calc(85px + var(--safe-bottom));left:0;right:0;
    text-align:center;color:#fff;font-size:13px;font-weight:600;
    padding:0 30px;pointer-events:none;
    text-shadow:0 2px 8px rgba(0,0,0,.8);
    opacity:.9;
  }
  .viewer-hint{
    position:absolute;top:calc(16px + var(--safe-top));left:0;right:0;
    text-align:center;color:rgba(255,255,255,.45);font-size:11px;
    pointer-events:none;opacity:0;
    animation:hintFade 2.6s ease .3s forwards;
  }
  @keyframes hintFade{
    0%{opacity:0}
    15%{opacity:.55}
    70%{opacity:.55}
    100%{opacity:0}
  }

  .toast{
    position:fixed;bottom:calc(var(--nav-h) + 24px + var(--safe-bottom));left:50%;
    transform:translateX(-50%) translateY(100px);
    background:var(--success);color:#fff;padding:11px 20px;border-radius:24px;
    font-size:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);
    z-index:300;opacity:0;transition:all .25s cubic-bezier(.22,1,.36,1);
    display:flex;align-items:center;gap:7px;pointer-events:none;max-width:90vw;
  }
  .toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:14px;height:14px}
  .toast.error{background:var(--error)}
  .toast.warn{background:var(--warning);color:#0a0a0f}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">GIF</div>
      <h1>GIFs</h1>
      <span class="status" id="status"><span class="dot"></span><span id="statusText">Ready</span></span>
    </div>
    <div class="search-wrap" id="searchWrap">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input id="searchInput" type="search" inputmode="search" enterkeyhint="search" placeholder="Search GIFs…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="clear-btn" id="clearBtn" aria-label="Clear">×</button>
      </div>
    </div>
    <div class="detail-bar" id="detailBar">
      <button class="back-btn" id="backBtn" aria-label="Back to categories">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="detail-emoji" id="detailEmoji"></div>
      <div class="detail-title" id="detailTitle"></div>
    </div>
  </header>

  <div class="scroll-area" id="scrollArea">
    <div class="grid" id="grid"></div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-tab="popular" aria-label="Popular">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
      Popular
    </button>
    <button class="nav-item" data-tab="categories" aria-label="Categories">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Categories
    </button>
    <button class="nav-item" data-tab="liked" aria-label="Liked">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      Liked
      <span class="badge" id="likedBadge">0</span>
    </button>
  </nav>
</div>

<!-- Fullscreen viewer -->
<div class="viewer" id="viewer">
  <button class="viewer-close" id="viewerClose" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="viewer-hint">Swipe down to close</div>
  <img class="viewer-img" id="viewerImg" src="" alt="" draggable="false">
  <div class="viewer-title" id="viewerTitle"></div>
  <div class="viewer-heart">
    <button class="viewer-heart-btn" id="viewerHeart" aria-label="Like">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toastText">Copied!</span>
</div>

<script>
/* =========================================================
   GIFs v8 — mobile-first, real page navigation
   Pages: Popular (endless feed) / Categories (full page) /
          Category detail (back button) / Liked (centered)
   - Endless loading on Popular AND category detail pages
   - Multi-proxy fallback chain
   - Viewer: tap to open, swipe down to dismiss
   ========================================================= */

/* ---------- CORS proxies (tried in order, working one is remembered) ---------- */
const PROXIES = [
  u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://proxy.cors.sh/${u}`,
];
let proxyIdx = 0;

const CATEGORIES = [
  {name:"Reactions", q:"reactions", emoji:"😎"},
  {name:"Happy", q:"happy", emoji:"😄"},
  {name:"Love", q:"love", emoji:"❤️"},
  {name:"Sad", q:"sad", emoji:"😢"},
  {name:"Angry", q:"angry", emoji:"😠"},
  {name:"Funny", q:"funny", emoji:"😂"},
  {name:"Wow", q:"wow", emoji:"😮"},
  {name:"Thumbs Up", q:"thumbs up", emoji:"👍"},
  {name:"Dance", q:"dance", emoji:"💃"},
  {name:"Animals", q:"animals", emoji:"🐶"},
  {name:"Cats", q:"cats", emoji:"🐱"},
  {name:"Dogs", q:"dogs", emoji:"🐶"},

/* ---------- Likes (localStorage) ---------- */

function getLikes(){
  try{ return JSON.parse(localStorage.getItem(LIKES_KEY) || "{}"); }
  catch{ return {}; }
}

  return id in getLikes();
}
function toggleLike(g){
  const likes = getLikes();
  if(g.id in likes){
    delete likes[g.id];
  }else{
    likes[g.id] = g;
    const ids = Object.keys(likes);
    if(ids.length > 200) delete likes[ids[0]];
  }
  try{ localStorage.setItem(LIKES_KEY, JSON.stringify(likes)); }catch{}
  updateLikedBadge();
}

  const count = Object.keys(getLikes()).length;
  const badge = $("likedBadge");
  if(count > 0){

}

/* ---------- Fetch with proxy fallback ---------- */
async function fetchHTML(targetUrl){
  let lastErr = null;
  for(let attempt = 0; attempt < PROXIES.length; attempt++){
    const p = (proxyIdx + attempt) % PROXIES.length;
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 9000);
    try{
      const res = await fetch(PROXIES[p](targetUrl), { signal: ctrl.signal });
      if(!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      if(!text || text.length < 500) throw new Error("Empty response");
      proxyIdx = p; // remember the proxy that worked
      return text;
    }catch(e){
      lastErr = e;
    }finally{
      clearTimeout(timer);
    }
  }
  throw lastErr || new Error("All proxies failed");
}

/* ---------- Tenor URL builder ---------- */
function buildTenorUrl(mode, query){
  if(mode === "trending") return "https://tenor.com/";
  if(mode === "search"){
    const slug = query.trim().toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9-]/g, "");
    if(!slug) return null;
    return `https://tenor.com/search/${encodeURIComponent(slug)}-gifs`;
  }
  return null;
}

/* ---------- Parse Tenor's embedded JSON state ---------- */
function parseTenorJSON(html){
  const m = html.match(/<script[^>]*>(\{"appConfig.*?\})<\/script>/s);
  if(!m) return { results: [], related: [] };
  let raw = m[1].replace(/\\u002F/g, "/");
  let data;
  try{ data = JSON.parse(raw); }
  catch{ return { results: [], related: [] }; }

  let results = [];
  let related = [];

  const featured = data?.gifs?.featured;
  if(featured?.results) results = featured.results;

  const search = data?.universal?.search || data?.gifs?.search;
  if(search){
    if(Array.isArray(search?.results) && search.results.length){
      results = search.results;
    }else{
      for(const key in search){
        if(search[key]?.results?.length){
          results = search[key].results;
          break;
        }
      }
    }
  }

  const suggestions = data?.searchSuggestions;
  if(suggestions){
    for(const key in suggestions){
      if(suggestions[key]?.results?.length){
        related = suggestions[key].results;
        break;
      }
    }
  }

  const explore = data?.exploreterms;
  if(explore && related.length === 0){
    for(const key in explore){
      if(explore[key]?.terms?.length){
        related = explore[key].terms;
        break;
      }
    }
  }

  return { results, related };
}

/* ---------- Normalize a Tenor result ---------- */
function normalizeResult(r){
  if(!r || !r.media_formats) return null;
  const mf = r.media_formats;
  const gif = mf.gif || mf.mediumgif || mf.full;
  const tinygif = mf.tinygif || mf.tinygifpreview || gif;
  const mp4 = mf.mp4 || mf.tinymp4;
  const webp = mf.webp || mf.tinywebp;
  const still = mf.gifpreview || mf.tinygifpreview || mf.mediumgif;

  if(!gif && !mp4) return null;

  const id = r.id || (gif?.url || "").match(/tenor\.com\/([A-Za-z0-9_-]+)/)?.[1] || Math.random().toString(36);
  const title = r.title || r.content_description || r.h1_title || "";
  const dims = gif?.dims || [220, 220];

  let slug = "";
  if(gif?.url){
    const slugMatch = gif.url.match(/tenor\.com\/(?:m\/)?[A-Za-z0-9_-]+\/([^/.]+)/);
    if(slugMatch) slug = slugMatch[1];
  }
  const page_url = slug ? `https://tenor.com/view/${slug}` : `https://tenor.com`;

  return {
    id: String(id),
    title: title.replace(/\s+/g, " ").trim() || slug.replace(/-/g, " "),
    thumb: tinygif?.url || gif?.url,
    full: gif?.url,
    still: still?.url || tinygif?.url,
    mp4: mp4?.url,
    webp: webp?.url,
    width: dims[0] || 220,
    height: dims[1] || 220,
    page_url,
    slug,
  };
}

/* ---------- What feed is the current page showing? ---------- */
function currentFetchTarget(){
  if(state.page === "category") return { mode:"search", query: state.category.q };
  if(state.searchQuery.trim()) return { mode:"search", query: state.searchQuery };
  return { mode:"trending", query:"" };
}

function ensureSeeded(v){
  if(v.seeded) return;
  v.seeded = true;
  const known = new Set(v.relatedQueries.map(q=>String(q).toLowerCase()));
  if(v.ownQuery) known.add(v.ownQuery.toLowerCase());
  TRENDING_SEEDS.forEach(s=>{
    if(!known.has(s)) v.relatedQueries.push(s);
  });
}

/* ---------- Core load ---------- */
async function loadCurrent(force=false){
  if(state.page === "liked"){ renderLiked(); return; }
  if(state.page === "categories"){ renderCatTiles(); return; }

  const key = effectiveKey();
  const v = getView(key);
  if(v.loading) return;

  if(v.items.length > 0 && !force){
    renderView(v);
    return;
  }

  v.loading = true;
  setStatus("loading");
  if(v.items.length === 0) showSkeletons(10);

  try{
    const { mode: fetchMode, query: fetchQuery } = currentFetchTarget();
    const url = buildTenorUrl(fetchMode, fetchQuery);
    const html = await fetchHTML(url);
    const { results, related } = parseTenorJSON(html);
    const fresh = results.map(normalizeResult).filter(Boolean);
    if(fresh.length === 0){
      v.error = "empty";
      showEmpty("No GIFs found", "Try a different search term.");
      setStatus("error");
      return;
    }
    v.items.push(...fresh);
    v.ownQuery = fetchQuery;
    v.relatedQueries = related.map(String);
    v.relatedIndex = 0;
    v.error = null;
    ensureSeeded(v); // guarantees there's always a next page to load
    renderView(v);
    setStatus("ready");
  }catch(e){
    console.error("Load failed:", e);
    if(v.items.length === 0){
      showError("Couldn't load", "Network blocked. Tap retry.");
    }else{
      toast("Load failed", "error");
      removeInlineLoader();
    }
    setStatus("error");
  }finally{
    v.loading = false;
  }
}

/* ---------- Endless scroll (popular + category detail) ---------- */
async function loadMore(){
  if(state.page !== "popular" && state.page !== "category") return;
  const key = effectiveKey();
  const v = getView(key);
  if(v.loading || v.exhausted) return;
  if(v.items.length === 0) return;

  v.loading = true;
  showInlineLoader();

  try{
    let added = 0;
    let attempts = 0;

    /* Keep trying queries until at least one new GIF is added,
       so the feed never dead-ends on a sparse topic */
    while(added === 0 && attempts < 3 && !v.exhausted){
      if(v.relatedIndex >= v.relatedQueries.length){
        ensureSeeded(v);
        if(v.relatedIndex >= v.relatedQueries.length){
          v.exhausted = true;
          break;
        }
      }
      const relatedQuery = String(v.relatedQueries[v.relatedIndex++]);
      const url = buildTenorUrl("search", relatedQuery);
      if(!url){ attempts++; continue; }
      attempts++;

      try{
        const html = await fetchHTML(url);
        const { results, related: newRelated } = parseTenorJSON(html);
        const normalized = results.map(normalizeResult).filter(Boolean);

        const existing = new Set(v.items.map(g => g.id));
        const fresh = normalized.filter(g => !existing.has(g.id));

        if(fresh.length > 0){
          const pill = document.createElement("div");
          pill.className = "related-pill";
          pill.innerHTML = `<span class="pill-inner">More: ${escapeHtml(relatedQuery)}</span>`;
          insertAtEnd(pill);

          const frag = document.createDocumentFragment();
          fresh.forEach(g => frag.appendChild(buildCard(g)));
          insertAtEnd(frag);
          v.items.push(...fresh);
          added += fresh.length;
        }

        const known = new Set(v.relatedQueries.map(String));
        newRelated.forEach(q=>{
          const qs = String(q);
          if(!known.has(qs)){
            v.relatedQueries.push(qs);
            known.add(qs);
          }
        });
      }catch(e){ /* fall through to next query */ }
    }

    if(v.items.length >= MAX_ITEMS) v.exhausted = true;
  }finally{
    removeInlineLoader();
    if(v.exhausted) showEndMarker();
    v.loading = false;
  }
}

/* ---------- Render feed view ---------- */
function renderView(v){
  detachSentinel();
  if(v.items.length === 0){
    if(v.error === "empty") showEmpty("No GIFs found", "Try a different search term.");
    else showSkeletons(10);
    return;
  }
  grid.className = "grid";
  grid.innerHTML = "";
  const frag = document.createDocumentFragment();
  v.items.forEach(g => frag.appendChild(buildCard(g)));
  grid.appendChild(frag);
  attachSentinel();
  if(v.scrollTop){
    requestAnimationFrame(()=>{ scrollArea.scrollTop = v.scrollTop; });
  }
  if(v.exhausted) showEndMarker();
}

/* ---------- Single shared lazy-load observer ---------- */
const lazyObserver = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      const img = entry.target;
      const dataSrc = img.dataset.src;
      if(dataSrc && !img.dataset.loaded){
        const tmp = new Image();
        tmp.onload = ()=>{
          img.src = dataSrc;
          img.dataset.loaded = "1";
          const card = img.closest(".gif-card");
          const playIcon = card?.querySelector(".play-icon");
          if(playIcon) playIcon.classList.add("hidden");
        };
        tmp.src = dataSrc;
      }
      lazyObserver.unobserve(img);
    }
  });
}, { rootMargin: "300px 0px" });

function buildCard(g){
  const card = document.createElement("div");
  card.className = "gif-card";
  if(isLiked(g.id)) card.classList.add("liked");
  card.dataset.gifData = JSON.stringify(g);
  const w = g.width || 220;
  const h = g.height || 220;
  card.innerHTML = `
    <img src="${g.still || g.thumb}" data-src="${g.thumb}" loading="lazy" decoding="async" width="${w}" height="${h}" alt="${(g.title||'gif').replace(/"/g,'&quot;')}">
    <div class="play-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
    <div class="heart-badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
  `;
  const img = card.querySelector("img");
  lazyObserver.observe(img);
  card.addEventListener("click", ()=>openViewer(card.dataset.gifData));
  return card;
}

/* ---------- Infinite scroll observer ---------- */
const scrollObserver = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      loadMore();
    }
  });
}, { rootMargin: "400px 0px" });

let sentinel = null;
function attachSentinel(){
  detachSentinel();
  sentinel = document.createElement("div");
  sentinel.style.height = "1px";
  grid.appendChild(sentinel); // always the LAST child
  scrollObserver.observe(sentinel);
}
function detachSentinel(){
  if(sentinel){
    scrollObserver.unobserve(sentinel);
    sentinel.remove();
    sentinel = null;
  }
}

/* ---------- Fullscreen viewer ---------- */
const viewer = $("viewer");
const viewerImg = $("viewerImg");
const viewerTitle = $("viewerTitle");
const viewerHeart = $("viewerHeart");
let currentViewedGif = null;

function openViewer(gifDataStr){
  let g;
  try{ g = JSON.parse(gifDataStr); }catch{ return; }
  currentViewedGif = g;
  viewerImg.style.transition = "none";
  viewerImg.style.transform = "";
  viewerImg.src = g.full;
  viewerTitle.textContent = (g.title || "GIF").replace(/\b\w/g, c => c.toUpperCase());
  if(isLiked(g.id)) viewerHeart.classList.add("liked");
  else viewerHeart.classList.remove("liked");
  viewer.classList.add("visible");
  document.body.style.overflow = "hidden";
}

function closeViewer(){
  viewer.classList.remove("visible");
  document.body.style.overflow = "";
  viewerImg.src = "";
  currentViewedGif = null;
}

$("viewerClose").addEventListener("click", closeViewer);
viewer.addEventListener("click", e=>{
  if(e.target === viewer) closeViewer();
});

/* Swipe down to dismiss */
let vStartY = null, vDy = 0;
viewerImg.addEventListener("touchstart", e=>{
  vStartY = e.touches[0].clientY;
  vDy = 0;
  viewerImg.style.transition = "none";
}, { passive:true });
viewerImg.addEventListener("touchmove", e=>{
  if(vStartY === null) return;
  vDy = e.touches[0].clientY - vStartY;
  if(vDy > 0){
    const scale = Math.max(.75, 1 - vDy / 700);
    viewerImg.style.transform = `translateY(${vDy}px) scale(${scale})`;
    viewer.style.background = `rgba(0,0,0,${Math.max(.55, .96 - vDy / 500)})`;
  }
}, { passive:true });
function endViewerDrag(){
  if(vStartY === null) return;
  vStartY = null;
  viewerImg.style.transition = "transform .25s cubic-bezier(.22,1,.36,1)";
  if(vDy > 90){
    viewer.style.background = "";
    closeViewer();
  }else{
    viewerImg.style.transform = "";
    viewer.style.background = "";
  }
  vDy = 0;
}
viewerImg.addEventListener("touchend", endViewerDrag, { passive:true });
viewerImg.addEventListener("touchcancel", endViewerDrag, { passive:true });

viewerHeart.addEventListener("click", ()=>{
  if(!currentViewedGif) return;
  toggleLike(currentViewedGif);
  if(isLiked(currentViewedGif.id)){
    viewerHeart.classList.add("liked");
    toast("Added to liked");
  }else{
    viewerHeart.classList.remove("liked");
    toast("Removed from liked", "warn");
  }
  document.querySelectorAll(".gif-card").forEach(card=>{
    try{
      const data = JSON.parse(card.dataset.gifData);
      if(data.id === currentViewedGif.id){
        card.classList.toggle("liked", isLiked(data.id));
      }
    }catch{}
  });
  if(state.page === "liked"){
    setTimeout(()=>renderLiked(), 300);
  }
});

/* ---------- Page switching ---------- */
function setPage(page){
  state.page = page;
  const navTab = page === "popular" ? "popular"
               : page === "liked" ? "liked"
               : "categories"; // categories + category detail both highlight this tab
  navEl.querySelectorAll(".nav-item").forEach(t=>{
    t.classList.toggle("active", t.dataset.tab === navTab);
  });
  // Header: search bar everywhere except category detail (back button + title there)
  const isDetail = page === "category";
  searchWrap.classList.toggle("gone", isDetail);
  detailBar.classList.toggle("visible", isDetail);
  if(isDetail && state.category){
    detailTitle.textContent = state.category.name;
    detailEmoji.textContent = state.category.emoji;
  }
}

function saveScroll(){
  if(state.page === "categories"){
    state.catPageScroll = scrollArea.scrollTop;
  }else{
    const v = views.get(effectiveKey());
    if(v) v.scrollTop = scrollArea.scrollTop;
  }
}

/* Bottom navigation */
navEl.addEventListener("click", e=>{
  const item = e.target.closest(".nav-item");
  if(!item) return;
  const tab = item.dataset.tab;
  const page = tab === "popular" ? "popular" : tab;
  if(page === state.page) return;
  saveScroll();

  if(page === "popular"){
    state.searchQuery = searchInput.value;
    setPage("popular");
    loadCurrent();
  }else if(page === "categories"){
    setPage("categories");
    renderCatTiles();
  }else{
    setPage("liked");
    renderLiked();
  }
});

/* Back from category detail to categories page */
$("backBtn").addEventListener("click", ()=>{
  saveScroll();
  setPage("categories");
  renderCatTiles();
});

/* ---------- Search (lives on the Popular page) ---------- */
let searchTimer;
function goPopularFromSearch(){
  if(state.page !== "popular"){
    saveScroll();
    setPage("popular");
  }
}
searchInput.addEventListener("input", ()=>{
  clearBtn.classList.toggle("visible", !!searchInput.value);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    goPopularFromSearch();
    saveScroll();
    state.searchQuery = searchInput.value;
    scrollArea.scrollTop = 0;
    loadCurrent();
  }, 450);
});
searchInput.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    e.preventDefault();
    clearTimeout(searchTimer);
    goPopularFromSearch();
    saveScroll();
    state.searchQuery = searchInput.value;
    scrollArea.scrollTop = 0;
    loadCurrent();
    searchInput.blur();
  }
});
clearBtn.addEventListener("click", ()=>{
  searchInput.value = "";
  clearBtn.classList.remove("visible");
  goPopularFromSearch();
  saveScroll();
  state.searchQuery = "";
  scrollArea.scrollTop = 0;
  loadCurrent();
  searchInput.focus();
});

/* ---------- Save scroll position (debounced, passive) ---------- */
let scrollSaveTimer;
scrollArea.addEventListener("scroll", ()=>{
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer = setTimeout(()=>{
    if(state.page === "categories"){
      state.catPageScroll = scrollArea.scrollTop;
    }else{
      const v = views.get(effectiveKey());
      if(v) v.scrollTop = scrollArea.scrollTop;
    }
  }, 120);
}, { passive:true });

/* ---------- Init ---------- */
updateLikedBadge();
setStatus("ready");
setPage("popular");
loadCurrent();
</script>
</body>
</html>
