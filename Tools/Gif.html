<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GIFs</title>
<style>
  :root{
    --bg:#0a0a0f;
    --bg-elev:#13131c;
    --bg-elev-2:#1c1c28;
    --border:#262633;
    --text:#f4f4f8;
    --text-dim:#a0a0b8;
    --text-faint:#66667a;
    --accent:#ff3864;
    --accent-2:#7b5cff;
    --accent-3:#00d9c0;
    --success:#22c55e;
    --warning:#f59e0b;
    --error:#ef4444;
    --radius:14px;
    --radius-sm:10px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
    display:flex;flex-direction:column;
  }
  .app{max-width:720px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;min-height:0}

  header{
    background:rgba(10,10,15,.85);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--border);
    padding:10px 12px 8px;flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .logo{
    width:28px;height:28px;border-radius:7px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;font-size:12px;letter-spacing:-.5px;
    box-shadow:0 4px 12px rgba(255,56,100,.4);
  }
  .brand h1{font-size:17px;font-weight:700;letter-spacing:-.4px}
  .brand .status{
    margin-left:auto;font-size:10px;font-weight:700;
    color:var(--success);display:flex;align-items:center;gap:5px;
    text-transform:uppercase;letter-spacing:.5px;
  }
  .brand .status .dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
  .brand .status.loading{color:var(--warning)}
  .brand .status.loading .dot{background:var(--warning);animation:pulse 1s infinite}
  .brand .status.error{color:var(--error)}
  .brand .status.error .dot{background:var(--error)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .search-wrap{position:relative;display:flex;gap:6px}
  .search-input-wrap{position:relative;flex:1}
  .search-input-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--text-faint);pointer-events:none}
  #searchInput{
    width:100%;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
    padding:11px 32px 11px 36px;border-radius:11px;
    font-size:16px;outline:none;transition:border-color .15s,background .15s;
  }
  #searchInput:focus{border-color:var(--accent);background:var(--bg-elev-2)}
  #searchInput::placeholder{color:var(--text-faint)}
  .clear-btn{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border-radius:50%;
    background:var(--bg-elev-2);border:none;color:var(--text-dim);
    display:none;align-items:center;justify-content:center;cursor:pointer;font-size:13px;
  }
  .clear-btn.visible{display:flex}

  /* Tabs */
  .tabs{display:flex;gap:4px;margin-top:8px}
  .tab{
    flex:1;background:transparent;border:1px solid var(--border);color:var(--text-dim);
    padding:8px 12px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;
    transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;
  }
  .tab svg{width:13px;height:13px}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab:active{transform:scale(.97)}
  .tab .badge{
    background:rgba(255,255,255,.2);color:#fff;
    font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;
    min-width:16px;text-align:center;
  }
  .tab.active .badge{background:rgba(255,255,255,.25)}
  .tab:not(.active) .badge{background:var(--bg-elev-2);color:var(--text-faint)}

  /* Categories — wrapping grid, not single scrolling line */
  .cat-grid{
    display:none;
    grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
    gap:6px;padding:8px 12px 4px;
  }
  .cat-grid.visible{display:grid}
  .cat-chip{
    background:var(--bg-elev);border:1px solid var(--border);color:var(--text-dim);
    padding:10px 6px;border-radius:10px;font-size:11px;font-weight:600;cursor:pointer;
    transition:all .15s;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    text-align:center;
  }
  .cat-chip .emoji{font-size:22px;line-height:1}
  .cat-chip .label{font-size:10px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .cat-chip.active{background:var(--accent-3);border-color:var(--accent-3);color:#0a0a0f}
  .cat-chip:active{transform:scale(.95)}

  .scroll-area{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:8px 8px calc(80px + var(--safe-bottom));
    position:relative;
  }
  .scroll-area::-webkit-scrollbar{width:0}

  .grid{
    column-count:2;
    column-gap:6px;
  }
  @media(min-width:480px){.grid{column-count:3}}
  @media(min-width:720px){.grid{column-count:4}}

  .gif-card{
    break-inside:avoid;
    margin-bottom:6px;
    position:relative;overflow:hidden;
    border-radius:8px;background:var(--bg-elev);cursor:pointer;
    transition:transform .12s;
  }
  .gif-card:active{transform:scale(.97)}
  .gif-card img{
    width:100%;height:auto;display:block;
    background:var(--bg-elev-2);
  }
  .gif-card .play-icon{
    position:absolute;bottom:5px;right:5px;
    width:18px;height:18px;border-radius:50%;
    background:rgba(0,0,0,.55);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .gif-card .play-icon svg{width:9px;height:9px;color:#fff;margin-left:1px}
  .gif-card .play-icon.hidden{display:none}
  .gif-card .heart-badge{
    position:absolute;top:5px;right:5px;
    width:20px;height:20px;border-radius:50%;
    background:rgba(255,56,100,.9);backdrop-filter:blur(8px);
    display:none;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .gif-card .heart-badge svg{width:10px;height:10px;color:#fff}
  .gif-card.liked .heart-badge{display:flex}

  .skeleton{
    break-inside:avoid;margin-bottom:6px;border-radius:8px;
    background:linear-gradient(90deg,var(--bg-elev) 25%,var(--bg-elev-2) 50%,var(--bg-elev) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s infinite;
  }
  .skeleton:nth-child(3n){height:140px}
  .skeleton:nth-child(3n+1){height:200px}
  .skeleton:nth-child(3n+2){height:100px}
  @keyframes shimmer{
    0%{background-position:200% 0}
    100%{background-position:-200% 0}
  }

  .empty-state{
    grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-faint);
  }
  .empty-state svg{width:48px;height:48px;margin:0 auto 14px;opacity:.4}
  .empty-state h3{font-size:15px;color:var(--text-dim);margin-bottom:6px;font-weight:600}
  .empty-state p{font-size:13px;line-height:1.5}
  .empty-state .retry-btn{
    margin-top:14px;background:var(--accent);color:#fff;border:none;
    padding:9px 18px;border-radius:18px;font-size:13px;font-weight:600;cursor:pointer;
  }

  .inline-loader{
    grid-column:1/-1;
    display:flex;justify-content:center;align-items:center;
    padding:18px 0;color:var(--text-faint);font-size:12px;gap:8px;
  }
  .inline-loader .spinner{
    width:18px;height:18px;border:2px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .end-marker{
    grid-column:1/-1;text-align:center;padding:18px 0;color:var(--text-faint);font-size:11px;
  }
  .end-marker .line{display:inline-block;width:24px;height:1px;background:var(--border);vertical-align:middle;margin:0 8px}

  .related-pill{
    grid-column:1/-1;
    text-align:center;padding:8px 0;
    color:var(--text-faint);font-size:11px;
  }
  .related-pill .pill-inner{
    display:inline-block;background:var(--bg-elev);border:1px solid var(--border);
    padding:4px 10px;border-radius:12px;color:var(--accent-3);font-weight:600;
  }

  /* Fullscreen viewer */
  .viewer{
    position:fixed;inset:0;z-index:100;
    background:rgba(0,0,0,.96);
    display:none;align-items:center;justify-content:center;
    animation:fadein .2s ease;
    -webkit-touch-callout:none;
  }
  .viewer.visible{display:flex}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .viewer-img{
    max-width:100%;max-height:100%;width:100%;height:100%;
    object-fit:contain;display:block;
  }
  .viewer-close{
    position:absolute;top:calc(12px + var(--safe-top));right:12px;z-index:2;
    width:38px;height:38px;border-radius:50%;
    background:rgba(0,0,0,.5);backdrop-filter:blur(10px);
    border:none;color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .viewer-close svg{width:18px;height:18px}
  .viewer-heart{
    position:absolute;bottom:calc(20px + var(--safe-bottom));left:50%;
    transform:translateX(-50%);z-index:2;
    display:flex;gap:10px;align-items:center;
  }
  .viewer-heart-btn{
    width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,.1);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.15);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .viewer-heart-btn:active{transform:scale(.92)}
  .viewer-heart-btn svg{width:24px;height:24px}
  .viewer-heart-btn.liked{background:var(--accent);border-color:var(--accent)}
  .viewer-heart-btn.liked svg{fill:#fff;color:#fff;animation:heartbeat .4s ease}
  @keyframes heartbeat{0%{transform:scale(1)}30%{transform:scale(1.3)}60%{transform:scale(.95)}100%{transform:scale(1)}}
  .viewer-title{
    position:absolute;bottom:calc(85px + var(--safe-bottom));left:0;right:0;
    text-align:center;color:#fff;font-size:13px;font-weight:600;
    padding:0 30px;pointer-events:none;
    text-shadow:0 2px 8px rgba(0,0,0,.8);
    opacity:.9;
  }

  .toast{
    position:fixed;bottom:calc(20px + var(--safe-bottom));left:50%;
    transform:translateX(-50%) translateY(100px);
    background:var(--success);color:#fff;padding:11px 20px;border-radius:24px;
    font-size:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);
    z-index:300;opacity:0;transition:all .25s cubic-bezier(.22,1,.36,1);
    display:flex;align-items:center;gap:7px;pointer-events:none;max-width:90vw;
  }
  .toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:14px;height:14px}
  .toast.error{background:var(--error)}
  .toast.warn{background:var(--warning);color:#0a0a0f}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">GIF</div>
      <h1>GIFs</h1>
      <span class="status" id="status"><span class="dot"></span><span id="statusText">Ready</span></span>
    </div>
    <div class="search-wrap">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input id="searchInput" type="search" inputmode="search" placeholder="Search GIFs…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="clear-btn" id="clearBtn" aria-label="Clear">×</button>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>Home
      </button>
      <button class="tab" data-tab="categories">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Categories
      </button>
      <button class="tab" data-tab="liked">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        Liked
        <span class="badge" id="likedBadge" style="display:none">0</span>
      </button>
    </div>
  </header>

  <div class="cat-grid" id="catGrid"></div>

  <div class="scroll-area" id="scrollArea">
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- Fullscreen viewer -->
<div class="viewer" id="viewer">
  <button class="viewer-close" id="viewerClose" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <img class="viewer-img" id="viewerImg" src="" alt="">
  <div class="viewer-title" id="viewerTitle"></div>
  <div class="viewer-heart">
    <button class="viewer-heart-btn" id="viewerHeart" aria-label="Like">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toastText">Copied!</span>
</div>

<script>
/* =========================================================
   GIFs v6 — Fullscreen viewer, likes, grid categories
   - Click GIF → fullscreen view (no copy)
   - Heart in fullscreen → saved to localStorage
   - Categories: wrapping grid (not scrolling line)
   - Search integrated into Home tab
   ========================================================= */

const PROXY = url => `https://proxy.cors.sh/${url}`;
const MOBILE_UA = "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1";

const CATEGORIES = [
  {name:"Reactions", q:"reactions", emoji:"😎"},
  {name:"Happy", q:"happy", emoji:"😄"},
  {name:"Love", q:"love", emoji:"❤️"},
  {name:"Sad", q:"sad", emoji:"😢"},
  {name:"Angry", q:"angry", emoji:"😠"},
  {name:"Funny", q:"funny", emoji:"😂"},
  {name:"Wow", q:"wow", emoji:"😮"},
  {name:"Thumbs Up", q:"thumbs up", emoji:"👍"},
  {name:"Dance", q:"dance", emoji:"💃"},
  {name:"Animals", q:"animals", emoji:"🐶"},
  {name:"Cats", q:"cats", emoji:"🐱"},
  {name:"Dogs", q:"dogs", emoji:"🐶"},
  {name:"Music", q:"music", emoji:"🎵"},
  {name:"Sports", q:"sports", emoji:"⚽"},
  {name:"Gaming", q:"gaming", emoji:"🎮"},
  {name:"Movies", q:"movies", emoji:"🎬"},
  {name:"Anime", q:"anime", emoji:"🌸"},
  {name:"Food", q:"food", emoji:"🍔"},
  {name:"Coffee", q:"coffee", emoji:"☕"},
  {name:"Birthday", q:"birthday", emoji:"🎂"},
  {name:"Congrats", q:"congratulations", emoji:"🎉"},
  {name:"Thanks", q:"thank you", emoji:"🙏"},
  {name:"Hello", q:"hello", emoji:"👋"},
  {name:"Goodbye", q:"goodbye", emoji:"🖐️"},
  {name:"Sorry", q:"sorry", emoji:"😟"},
  {name:"Celebrate", q:"celebrate", emoji:"🎊"},
  {name:"Excited", q:"excited", emoji:"🤩"},
  {name:"Tired", q:"tired", emoji:"😴"},
  {name:"Confused", q:"confused", emoji:"🤔"},
  {name:"Eye Roll", q:"eye roll", emoji:"🙄"},
  {name:"High Five", q:"high five", emoji:"🙌"},
  {name:"Mind Blown", q:"mind blown", emoji:"🤯"},
  {name:"Shrug", q:"shrug", emoji:"🤷"},
  {name:"Facepalm", q:"facepalm", emoji:"🤦"},
];

/* ---------- Likes (localStorage) ---------- */
const LIKES_KEY = "gifLikes";
function getLikes(){
  try{ return JSON.parse(localStorage.getItem(LIKES_KEY) || "{}"); }
  catch{ return {}; }
}
function isLiked(id){
  return id in getLikes();
}
function toggleLike(g){
  const likes = getLikes();
  if(g.id in likes){
    delete likes[g.id];
  }else{
    likes[g.id] = g;
    // Keep only last 200 to avoid bloat
    const ids = Object.keys(likes);
    if(ids.length > 200){
      delete likes[ids[0]];
    }
  }
  try{ localStorage.setItem(LIKES_KEY, JSON.stringify(likes)); }catch{}
  updateLikedBadge();
}
function updateLikedBadge(){
  const count = Object.keys(getLikes()).length;
  const badge = $("likedBadge");
  if(count > 0){
    badge.textContent = count > 99 ? "99+" : count;
    badge.style.display = "inline-block";
  }else{
    badge.style.display = "none";
  }
}

/* ---------- View cache ---------- */
const views = new Map();
function viewKey(mode, query=""){
  if(mode === "home" && !query) return "home:trending";
  if(mode === "liked") return "liked";
  return `${mode}:${query.toLowerCase().trim()}`;
}
function getView(mode, query=""){
  const k = viewKey(mode, query);
  if(!views.has(k)){
    views.set(k, {
      items: [],
      relatedQueries: [],
      relatedIndex: 0,
      exhausted: false,
      scrollTop: 0,
      error: null,
      loading: false,
    });
  }
  return views.get(k);
}

const state = {
  mode: "home",
  query: "",
  activeCategory: null,
};

const $ = id => document.getElementById(id);
const grid = $("grid");
const scrollArea = $("scrollArea");
const searchInput = $("searchInput");
const clearBtn = $("clearBtn");
const tabsEl = $("tabs");
const catGrid = $("catGrid");
const statusEl = $("status");
const statusText = $("statusText");

let toastTimer;
function toast(msg, type="success"){
  const t = $("toast");
  $("toastText").textContent = msg;
  t.classList.remove("error","warn");
  if(type === "error") t.classList.add("error");
  if(type === "warn") t.classList.add("warn");
  t.classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("visible"), 1800);
}

function setStatus(s){
  statusEl.className = "status " + s;
  const labels = { ready:"Ready", loading:"Loading", error:"Offline" };
  statusText.textContent = labels[s] || "Ready";
}

/* ---------- Skeletons & status ---------- */
function showSkeletons(count=8){
  let html = "";
  for(let i = 0; i < count; i++) html += '<div class="skeleton"></div>';
  grid.innerHTML = html;
}
function showEmpty(title, sub, withRetry=false){
  grid.innerHTML = `<div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <h3>${title}</h3><p>${sub}</p>
    ${withRetry ? '<button class="retry-btn" onclick="loadCurrent(true)">Try again</button>' : ''}
  </div>`;
}
function showEmptyHeart(){
  grid.innerHTML = `<div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <h3>No liked GIFs yet</h3><p>Tap any GIF to open it, then tap the heart to save it here.</p>
  </div>`;
}
function showError(title, sub){
  grid.innerHTML = `<div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <h3>${title}</h3><p>${sub}</p>
    <button class="retry-btn" onclick="loadCurrent(true)">Try again</button>
  </div>`;
}
function showEndMarker(){
  if(grid.querySelector(".end-marker")) return;
  const el = document.createElement("div");
  el.className = "end-marker";
  el.innerHTML = '<span class="line"></span>End<span class="line"></span>';
  grid.appendChild(el);
}
function showInlineLoader(){
  if(grid.querySelector(".inline-loader")) return;
  const el = document.createElement("div");
  el.className = "inline-loader";
  el.innerHTML = '<div class="spinner"></div>Loading more…';
  grid.appendChild(el);
}
function removeInlineLoader(){
  const el = grid.querySelector(".inline-loader");
  if(el) el.remove();
}

/* ---------- Fetch ---------- */
async function fetchHTML(targetUrl){
  const proxyUrl = PROXY(targetUrl);
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 10000);
  try{
    const res = await fetch(proxyUrl, {
      signal: ctrl.signal,
      headers: { "User-Agent": MOBILE_UA }
    });
    clearTimeout(timer);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.text();
  }catch(e){
    clearTimeout(timer);
    throw e;
  }
}

/* ---------- Tenor URL builder ---------- */
function buildTenorUrl(mode, query){
  if(mode === "trending" || (mode === "home" && !query)) return "https://tenor.com/";
  if(mode === "search" || mode === "categories" || (mode === "home" && query)){
    const slug = query.trim().toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9-]/g, "");
    if(!slug) return null;
    return `https://tenor.com/search/${encodeURIComponent(slug)}-gifs`;
  }
  return null;
}

/* ---------- Parse Tenor's embedded JSON state ---------- */
function parseTenorJSON(html){
  const m = html.match(/<script[^>]*>(\{"appConfig.*?\})<\/script>/s);
  if(!m) return { results: [], related: [] };
  let raw = m[1].replace(/\\u002F/g, "/");
  let data;
  try{ data = JSON.parse(raw); }
  catch{ return { results: [], related: [] }; }

  let results = [];
  let related = [];

  const featured = data?.gifs?.featured;
  if(featured?.results) results = featured.results;

  const search = data?.universal?.search;
  if(search){
    for(const key in search){
      if(search[key]?.results?.length){
        results = search[key].results;
        break;
      }
    }
  }

  const suggestions = data?.searchSuggestions;
  if(suggestions){
    for(const key in suggestions){
      if(suggestions[key]?.results?.length){
        related = suggestions[key].results;
        break;
      }
    }
  }

  const explore = data?.exploreterms;
  if(explore && related.length === 0){
    for(const key in explore){
      if(explore[key]?.terms?.length){
        related = explore[key].terms;
        break;
      }
    }
  }

  return { results, related };
}

/* ---------- Normalize a Tenor result ---------- */
function normalizeResult(r){
  if(!r || !r.media_formats) return null;
  const mf = r.media_formats;
  const gif = mf.gif || mf.mediumgif || mf.full;
  const tinygif = mf.tinygif || mf.tinygifpreview || gif;
  const mp4 = mf.mp4 || mf.tinymp4;
  const webp = mf.webp || mf.tinywebp;
  const still = mf.gifpreview || mf.tinygifpreview || mf.mediumgif;

  if(!gif && !mp4) return null;

  const id = r.id || (gif?.url || "").match(/tenor\.com\/([A-Za-z0-9_-]+)/)?.[1] || Math.random().toString(36);
  const title = r.title || r.content_description || r.h1_title || "";
  const dims = gif?.dims || [220, 220];

  let slug = "";
  if(gif?.url){
    const slugMatch = gif.url.match(/tenor\.com\/(?:m\/)?[A-Za-z0-9_-]+\/([^/.]+)/);
    if(slugMatch) slug = slugMatch[1];
  }
  const page_url = slug ? `https://tenor.com/view/${slug}` : `https://tenor.com`;

  return {
    id: String(id),
    title: title.replace(/\s+/g, " ").trim() || slug.replace(/-/g, " "),
    thumb: tinygif?.url || gif?.url,
    full: gif?.url,
    still: still?.url || tinygif?.url,
    mp4: mp4?.url,
    webp: webp?.url,
    width: dims[0] || 220,
    height: dims[1] || 220,
    page_url,
    slug,
  };
}

/* ---------- Core load ---------- */
async function fetchView(mode, query){
  const url = buildTenorUrl(mode, query);
  if(!url) return { results: [], related: [] };
  const html = await fetchHTML(url);
  const { results, related } = parseTenorJSON(html);
  return {
    results: results.map(normalizeResult).filter(Boolean),
    related,
  };
}

function currentMode(){
  // Map UI state to fetch mode
  if(state.mode === "liked") return "liked";
  if(state.mode === "categories" && state.activeCategory) return "search";
  if(state.mode === "home" && state.query.trim()) return "search";
  return "trending";
}

async function loadCurrent(force=false){
  const v = getView(state.mode, state.query);
  if(v.loading) return;

  // Liked tab — no network, just render from localStorage
  if(state.mode === "liked"){
    renderLiked();
    return;
  }

  if(v.items.length > 0 && !force){
    renderView(v);
    return;
  }

  v.loading = true;
  setStatus("loading");

  if(v.items.length === 0){
    showSkeletons(8);
  }

  try{
    const fetchMode = currentMode();
    const { results, related } = await fetchView(fetchMode, state.query);
    if(results.length === 0){
      v.error = "empty";
      showEmpty("No GIFs found", "Try a different search term.");
      setStatus("error");
      return;
    }
    const existing = new Set(v.items.map(g => g.id));
    const fresh = results.filter(g => !existing.has(g.id));
    v.items.push(...fresh);
    v.relatedQueries = related;
    v.relatedIndex = 0;
    v.error = null;
    if(related.length === 0){
      v.exhausted = true;
    }
    renderView(v);
    setStatus("ready");
  }catch(e){
    console.error("Load failed:", e);
    if(v.items.length === 0){
      showError("Couldn't load", "Network blocked. Tap retry.");
    }else{
      toast("Load failed", "error");
      removeInlineLoader();
    }
    setStatus("error");
  }finally{
    v.loading = false;
  }
}

/* ---------- Render liked ---------- */
function renderLiked(){
  const likes = getLikes();
  const items = Object.values(likes);
  grid.innerHTML = "";
  if(items.length === 0){
    showEmptyHeart();
    return;
  }
  // Show in reverse order (most recently liked first)
  items.reverse();
  const frag = document.createDocumentFragment();
  items.forEach(g => frag.appendChild(buildCard(g)));
  grid.appendChild(frag);
}

/* ---------- Infinite scroll ---------- */
async function loadMore(){
  const v = getView(state.mode, state.query);
  if(v.loading || v.exhausted) return;
  if(state.mode === "liked"){
    v.exhausted = true;
    showEndMarker();
    return;
  }
  // Only search and categories have related queries
  const fetchMode = currentMode();
  if(fetchMode !== "search"){
    v.exhausted = true;
    showEndMarker();
    removeInlineLoader();
    return;
  }

  if(v.relatedIndex >= v.relatedQueries.length){
    v.exhausted = true;
    showEndMarker();
    removeInlineLoader();
    return;
  }

  v.loading = true;
  showInlineLoader();

  try{
    const relatedQuery = v.relatedQueries[v.relatedIndex];
    v.relatedIndex++;

    const url = buildTenorUrl("search", relatedQuery);
    if(!url){ v.exhausted = true; showEndMarker(); removeInlineLoader(); return; }
    const html = await fetchHTML(url);
    const { results, related: newRelated } = parseTenorJSON(html);
    const normalized = results.map(normalizeResult).filter(Boolean);

    const existing = new Set(v.items.map(g => g.id));
    const fresh = normalized.filter(g => !existing.has(g.id));

    if(fresh.length > 0){
      const pill = document.createElement("div");
      pill.className = "related-pill";
      pill.innerHTML = `<span class="pill-inner">More: ${relatedQuery}</span>`;
      grid.insertBefore(pill, grid.querySelector(".inline-loader"));

      const frag = document.createDocumentFragment();
      fresh.forEach(g => frag.appendChild(buildCard(g)));
      grid.insertBefore(frag, grid.querySelector(".inline-loader") || null);
      v.items.push(...fresh);
    }

    const existingRelated = new Set(v.relatedQueries);
    newRelated.forEach(q => {
      if(!existingRelated.has(q)){
        v.relatedQueries.push(q);
        existingRelated.add(q);
      }
    });

    if(v.relatedIndex >= v.relatedQueries.length){
      v.exhausted = true;
      removeInlineLoader();
      showEndMarker();
    }
  }catch(e){
    console.error("loadMore failed:", e);
    toast("Couldn't load more", "error");
    removeInlineLoader();
  }finally{
    v.loading = false;
  }
}

/* ---------- Render ---------- */
function renderView(v){
  if(v.items.length === 0){
    if(v.error === "empty") showEmpty("No GIFs found", "Try a different search term.");
    else showSkeletons(8);
    return;
  }
  const frag = document.createDocumentFragment();
  v.items.forEach(g => frag.appendChild(buildCard(g)));
  grid.innerHTML = "";
  grid.appendChild(frag);
  if(v.scrollTop){
    requestAnimationFrame(()=>{ scrollArea.scrollTop = v.scrollTop; });
  }
  if(v.exhausted) showEndMarker();
}

/* ---------- Single shared lazy-load observer ---------- */
const lazyObserver = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      const img = entry.target;
      const dataSrc = img.dataset.src;
      if(dataSrc && !img.dataset.loaded){
        const tmp = new Image();
        tmp.onload = ()=>{
          img.src = dataSrc;
          img.dataset.loaded = "1";
          const card = img.closest(".gif-card");
          const playIcon = card?.querySelector(".play-icon");
          if(playIcon) playIcon.classList.add("hidden");
        };
        tmp.src = dataSrc;
      }
      lazyObserver.unobserve(img);
    }
  });
}, { rootMargin: "200px 0px" });

function buildCard(g){
  const card = document.createElement("div");
  card.className = "gif-card";
  if(isLiked(g.id)) card.classList.add("liked");
  card.dataset.gifData = JSON.stringify(g);
  const w = g.width || 220;
  const h = g.height || 220;
  card.innerHTML = `
    <img src="${g.still || g.thumb}" data-src="${g.thumb}" loading="lazy" width="${w}" height="${h}" alt="${(g.title||'gif').replace(/"/g,'&quot;')}">
    <div class="play-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
    <div class="heart-badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
  `;
  const img = card.querySelector("img");
  lazyObserver.observe(img);
  card.addEventListener("click", ()=>openViewer(card.dataset.gifData));
  return card;
}

/* ---------- Infinite scroll observer ---------- */
const scrollObserver = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      loadMore();
    }
  });
}, { rootMargin: "300px 0px" });

let sentinel;
function attachSentinel(){
  if(sentinel) sentinel.remove();
  sentinel = document.createElement("div");
  sentinel.style.height = "1px";
  grid.appendChild(sentinel);
  scrollObserver.observe(sentinel);
}

const _originalRender = renderView;
renderView = function(v){
  _originalRender(v);
  attachSentinel();
  // Also re-attach after liked render
  if(state.mode === "liked") attachSentinel();
};

/* ---------- Fullscreen viewer ---------- */
const viewer = $("viewer");
const viewerImg = $("viewerImg");
const viewerTitle = $("viewerTitle");
const viewerHeart = $("viewerHeart");
const viewerClose = $("viewerClose");
let currentViewedGif = null;

function openViewer(gifDataStr){
  let g;
  try{ g = JSON.parse(gifDataStr); }catch{ return; }
  currentViewedGif = g;
  viewerImg.src = g.full;
  viewerTitle.textContent = (g.title || "GIF").replace(/\b\w/g, c => c.toUpperCase());
  // Set heart state
  if(isLiked(g.id)){
    viewerHeart.classList.add("liked");
  }else{
    viewerHeart.classList.remove("liked");
  }
  viewer.classList.add("visible");
  document.body.style.overflow = "hidden";
}

function closeViewer(){
  viewer.classList.remove("visible");
  document.body.style.overflow = "";
  // Stop loading the full GIF to save bandwidth
  viewerImg.src = "";
  currentViewedGif = null;
}

viewerClose.addEventListener("click", closeViewer);
viewer.addEventListener("click", e=>{
  // Close when tapping the background (not the image or heart)
  if(e.target === viewer) closeViewer();
});

viewerHeart.addEventListener("click", ()=>{
  if(!currentViewedGif) return;
  toggleLike(currentViewedGif);
  if(isLiked(currentViewedGif.id)){
    viewerHeart.classList.add("liked");
    toast("Added to liked");
  }else{
    viewerHeart.classList.remove("liked");
    toast("Removed from liked", "warn");
  }
  // Update card heart badge if visible
  document.querySelectorAll(`.gif-card`).forEach(card=>{
    try{
      const data = JSON.parse(card.dataset.gifData);
      if(data.id === currentViewedGif.id){
        card.classList.toggle("liked", isLiked(data.id));
      }
    }catch{}
  });
  // If we're on the liked tab, re-render to reflect changes
  if(state.mode === "liked"){
    setTimeout(()=>renderLiked(), 300);
  }
});

/* ---------- Tabs ---------- */
function saveCurrentScroll(){
  const v = getView(state.mode, state.query);
  if(v) v.scrollTop = scrollArea.scrollTop;
}

tabsEl.addEventListener("click", e=>{
  const tab = e.target.closest(".tab");
  if(!tab || tab.classList.contains("active")) return;
  saveCurrentScroll();
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  tab.classList.add("active");
  const mode = tab.dataset.tab;
  state.mode = mode;

  if(mode === "categories"){
    catGrid.classList.add("visible");
    if(!state.activeCategory){
      // No category selected — show trending
      state.query = "";
      loadCurrent();
    }else{
      state.query = state.activeCategory;
      loadCurrent();
    }
  }else{
    catGrid.classList.remove("visible");
    if(mode === "home"){
      // Home tab: respect current search input
      state.query = searchInput.value;
      loadCurrent();
    }else if(mode === "liked"){
      loadCurrent();
    }
  }
});

/* ---------- Categories (wrapping grid) ---------- */
function renderCategories(){
  catGrid.innerHTML = CATEGORIES.map(c=>`
    <button class="cat-chip" data-q="${c.q}">
      <span class="emoji">${c.emoji}</span>
      <span class="label">${c.name}</span>
    </button>
  `).join("");
  catGrid.querySelectorAll(".cat-chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      catGrid.querySelectorAll(".cat-chip").forEach(c=>c.classList.remove("active"));
      chip.classList.add("active");
      state.activeCategory = chip.dataset.q;
      state.query = chip.dataset.q;
      // Clear search input since we're using a category
      searchInput.value = "";
      clearBtn.classList.remove("visible");
      loadCurrent();
    });
  });
}

/* ---------- Search (integrated into Home tab) ---------- */
let searchTimer;
searchInput.addEventListener("input", ()=>{
  clearBtn.classList.toggle("visible", !!searchInput.value);
  // Clear any active category when user types
  if(searchInput.value && state.activeCategory){
    catGrid.querySelectorAll(".cat-chip").forEach(c=>c.classList.remove("active"));
    state.activeCategory = null;
  }
  // Auto-switch to Home tab if not already
  if(state.mode !== "home"){
    saveCurrentScroll();
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.querySelector('.tab[data-tab="home"]').classList.add("active");
    state.mode = "home";
    catGrid.classList.remove("visible");
  }
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    saveCurrentScroll();
    state.query = searchInput.value;
    loadCurrent();
  }, 500);
});
searchInput.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    e.preventDefault();
    clearTimeout(searchTimer);
    saveCurrentScroll();
    state.query = searchInput.value;
    if(state.mode !== "home"){
      document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
      document.querySelector('.tab[data-tab="home"]').classList.add("active");
      state.mode = "home";
      catGrid.classList.remove("visible");
    }
    loadCurrent();
    searchInput.blur();
  }
});
clearBtn.addEventListener("click", ()=>{
  searchInput.value = "";
  clearBtn.classList.remove("visible");
  state.query = "";
  searchInput.focus();
  saveCurrentScroll();
  loadCurrent();
});

/* ---------- Save scroll on scroll ---------- */
let scrollSaveTimer;
scrollArea.addEventListener("scroll", ()=>{
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer = setTimeout(()=>{
    const v = getView(state.mode, state.query);
    if(v) v.scrollTop = scrollArea.scrollTop;
  }, 100);
});

/* ---------- Init ---------- */
renderCategories();
updateLikedBadge();
setStatus("ready");
loadCurrent();
</script>
